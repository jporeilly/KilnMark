# Supplier intake: check the feed before it is trusted (a Kilnmark sample).
# The second step of the supplier intake scenario. Keeps each SKU's latest delivery, looks each one
# up among the products and their agreed costs, and works out how far the new cost is from the
# agreed one, in percent. Rows for a product nobody knows, or with a cost that is not positive, are
# quarantined. Rows whose cost moved by more than 20% go to a price review file. The rest are
# accepted, for sample-supplier-load to load.
# Why it matters: A partner's file is typically loaded only after it has been checked, since one
# wrong price can reach invoices, stock valuations or a customer's bill. Unknown products and large
# price changes are held for a data steward to review with the supplier, not loaded on trust.
# Look for: the two lookups (unmatched: keep, so an unknown SKU arrives at the gate with no product),
# change_pct, and the two quarantining gates, each with a file of its own. The first gate also
# checks the supplier feed table's own quality rules, which a steward adds in Quality (rules_from).
# Each gate's share set aside is what sample-supplier-intake reads to decide whether to load.
# Needs: shop-db (the stock schema) and files.
kilnmark: pipeline/v1
name: sample-supplier-check
description: The supplier feed checked against the products and their agreed costs.

nodes:
  - id: feed
    type: read
    source: shop-db
    asset: stock.supplier_feed

  - id: latest
    type: dedupe
    input: feed
    key: [sku]
    duplicates: latest
    duplicates_by: received_on       # a SKU delivered twice: the later delivery counts

  - id: products
    type: read
    source: shop-db
    asset: stock.products
    columns: [product_id, sku, name, discontinued]

  - id: costs
    type: read
    source: shop-db
    asset: stock.product_costs
    columns: [sku, agreed_cost]

  - id: known
    type: lookup
    inputs: { main: latest, lookup: products }
    on: { sku: sku }
    keep: [product_id, name, discontinued]
    unmatched: keep                  # an unknown SKU goes on with no product_id, for the gate

  - id: agreed
    type: lookup
    inputs: { main: known, lookup: costs }
    on: { sku: sku }
    keep: [agreed_cost]
    unmatched: keep

  - id: change
    type: compute
    input: agreed
    columns:
      change_pct: "round((cost_price - agreed_cost) / nullif(agreed_cost, 0) * 100, 1)"

  - id: product_check
    type: gate
    input: change
    on_fail: quarantine
    rules_from: feed                 # the supplier feed table's own rules, besides these
    rules:
      - {name: known product, type: not_null, field: product_id}
      - {name: positive cost, type: in_range, field: cost_price, min: 0.01}
    max_failing_share: 0.2

  - id: price_check
    type: gate
    input: product_check
    on_fail: quarantine
    asset_rules: false
    rules:
      - {name: cost within 20% of the agreed cost, type: in_range, field: change_pct, min: -20, max: 20}
    max_failing_share: 0.5

  - id: accepted
    type: write
    input: price_check
    source: files
    path: samples/scenarios/supplier-intake/accepted.parquet
    mode: replace

  - id: quarantined
    type: write
    input: product_check.quarantine
    source: files
    path: samples/scenarios/supplier-intake/quarantined_rows.csv
    mode: replace

  - id: price_review
    type: write
    input: price_check.quarantine
    source: files
    path: samples/scenarios/supplier-intake/price_review.csv
    mode: replace

  - id: superseded
    type: write
    input: latest.rejected
    source: files
    path: samples/scenarios/supplier-intake/superseded_rows.csv
    mode: replace
