# Sort: rows in order (a Kilnmark sample).
# Lists the shop's orders by status, then the dearest shipping first, then the oldest first.
# Why it matters: Statements, reports and reconciliations are typically read in a set order. A
# stable sort keeps rows that tie in the order they came, so two runs on the same rows give the same
# file.
# Look for: several sort columns, the second largest first (desc). Orders that are equal on all
# three keep the order they arrived in.
# Needs: shop-db (the shop schema) and files.
kilnmark: pipeline/v1
name: sample-sort
description: Shop orders by status, then dearest shipping first, then oldest first.

nodes:
  - id: orders
    type: read
    source: shop-db
    asset: shop.orders

  - id: ordered
    type: sort
    input: orders
    by: [status, shipping_fee desc, ordered_at]

  - id: out
    type: write
    input: ordered
    source: files
    path: samples/transform/orders_sorted.csv
    mode: replace
