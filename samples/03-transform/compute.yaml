# Compute: new and tidied columns (a Kilnmark sample).
# Adds a full name, a tidy email, a rough age and the postcode area to the CRM customers, each from
# an expression. Tidy the text once, here, and every node after it sees the same values.
# Why it matters: Names, emails and postcodes typically arrive untidy from many systems. Tidying
# them once, early, means every report and every match after it sees the same values.
# Look for: the expressions, and the node's columns on the canvas, which show each new column's
# type. sample-functions shows more of the functions.
# Needs: crm-db (the crm schema) and files.
kilnmark: pipeline/v1
name: sample-compute
description: CRM customers with a full name, a tidy email and a rough age.

nodes:
  - id: customers
    type: read
    source: crm-db
    asset: crm.customers

  - id: tidy
    type: compute
    input: customers
    columns:
      full_name: "trim(first_name) || ' ' || trim(last_name)"
      email: "lower(trim(email))"
      age_years: "date_part('year', today()) - date_part('year', date_of_birth)"
      postcode_area: "upper(regex_replace(postcode, '^([A-Za-z]+).*$', '$1'))"

  - id: out
    type: write
    input: tidy
    source: files
    path: samples/transform/customers_tidy.csv
    mode: replace
