# Select: keep, retype, rename and order columns (a Kilnmark sample).
# Keeps the shop customer columns wanted, makes the id text, renames two columns and puts the
# customer code first. Use it to give a file or a table exactly the columns it should have.
# Why it matters: Files and tables handed to another system usually have an agreed layout. Shaping
# the columns in one node keeps that agreement in one place, and dropping the columns no one needs
# keeps personal data out.
# Look for: the order the settings apply in: keep or drop first, then cast, then rename, then order.
# Needs: shop-db (the shop schema) and files.
kilnmark: pipeline/v1
name: sample-select
description: Shop customers, shaped.

nodes:
  - id: customers
    type: read
    source: shop-db
    asset: shop.customers

  - id: shape
    type: select
    input: customers
    keep: [customer_id, customer_code, first_name, last_name, loyalty_tier, created_at]
    cast: { customer_id: utf8 }
    rename: { loyalty_tier: tier, created_at: joined_at }
    order: [customer_code]

  - id: out
    type: write
    input: shape
    source: files
    path: samples/transform/customers_shaped.csv
    mode: replace
