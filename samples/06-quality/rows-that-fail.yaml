# Rows that fail: set aside, not fatal (a Kilnmark sample).
# Works out the number in each supplier SKU. A badly shaped SKU cannot be cast to a number, so its
# row goes to the compute node's errors port and on to a quarantine file, with what went wrong.
# More than 5% of rows failing would stop the run.
# Look for: the errors port, max_error_share, the error_code and error_message columns in the
# quarantine file, and the line in the run's log that counts the rows set aside.
kilnmark: pipeline/v1
name: sample-rows-that-fail
description: Supplier feed with each SKU's number; rows whose SKU cannot be read set aside.

nodes:
  - id: feed
    type: read
    source: shop-db
    asset: stock.supplier_feed

  - id: numbered
    type: compute
    input: feed
    columns:
      sku_number: "cast(split_part(sku, '-', 2) as int64)"
    max_error_share: 0.05

  - id: out
    type: write
    input: numbered
    source: files
    path: samples/quality/supplier_feed_numbered.csv
    mode: replace

  - id: aside
    type: write
    input: numbered.errors
    source: files
    path: samples/quality/supplier_feed_errors.csv
    mode: replace
