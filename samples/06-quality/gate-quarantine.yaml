# Quality gate: set failing rows aside (a Kilnmark sample).
# Checks the CRM customers on the way. Rows with no email or an unknown segment go to a quarantine
# file, and the rest to the clean file. If more than 20% failed, the run would stop instead.
# Why it matters: Bad rows are kept and reviewed, not dropped or loaded, so data-quality controls
# have evidence. The threshold stops a run whose source has gone badly wrong.
# Look for: on_fail: quarantine, the quarantine output, and the quality chips on the run's page.
# Needs: crm-db (the crm schema) and files.
kilnmark: pipeline/v1
name: sample-gate-quarantine
description: CRM customers checked; failing rows set aside.

nodes:
  - id: customers
    type: read
    source: crm-db
    asset: crm.customers

  - id: check
    type: gate
    note: More than 20% failing stops the run
    input: customers
    on_fail: quarantine
    rules:
      - {name: has an email, type: not_null, field: email, blank_is_missing: true}
      - {name: known segment, type: allowed_values, field: segment, values: [Retail, Premier, Business, Student]}
    max_failing_share: 0.2

  - id: clean
    type: write
    input: check
    source: files
    path: samples/quality/customers_clean.csv
    mode: replace

  - id: aside
    type: write
    input: check.quarantine
    source: files
    path: samples/quality/customers_aside.csv
    mode: replace

# Notes on the canvas, for people. Kilnmark ignores this list when it runs the pipeline.
notes:
  - text: |-
      **Failing rows are set aside, not dropped.** Run it, then open the run: the gate's chips say how many rows passed and how many went to the quarantine file.
    node: customers
    x: 0
    y: -160
    width: 300
    height: 130
    colour: green