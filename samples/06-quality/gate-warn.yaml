# Quality gate: warn only (a Kilnmark sample).
# Checks the supplier feed for repeated SKUs, prices that are not positive and badly shaped SKUs,
# but lets every row through. What failed is recorded with the run.
# Why it matters: A partner's or supplier's feed is often loaded even with faults, because waiting
# would cost more. Recording what failed with the run gives the steward a list to raise with the
# sender.
# Look for: on_fail: warn. The run succeeds, and its page lists what failed.
# Needs: shop-db (the stock schema) and files.
kilnmark: pipeline/v1
name: sample-gate-warn
description: Supplier feed, checked but not stopped.

nodes:
  - id: feed
    type: read
    source: shop-db
    asset: stock.supplier_feed

  - id: check
    type: gate
    input: feed
    on_fail: warn
    rules:
      - {name: one row per SKU, type: unique, field: sku}
      - {name: positive price, type: in_range, field: cost_price, min: 0.01}
      - {name: SKU shape, type: matches_pattern, field: sku, regex: "^[A-Z]{2,4}-[0-9]+$"}

  - id: out
    type: write
    input: check
    source: files
    path: samples/quality/supplier_feed_checked.csv
    mode: replace
