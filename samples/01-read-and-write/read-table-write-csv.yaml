# Read a table, write a CSV file (a Kilnmark sample).
# Reads every row of the CRM accounts table and writes it to a CSV file. It is the smallest useful
# pipeline: one read node and one write node.
# Why it matters: A table copied to a file is often how data is handed to another team, a partner or
# a reporting portal. The run's record of the rows read and written is evidence that the extract was
# complete.
# Look for: the rows read and written, on the run's page. After the next scan of files, the CSV has
# its own page in the catalogue. mode: replace swaps the file in on each run; create, the default,
# fails if the file is already there.
# Needs: crm-db (the crm schema) and files.
kilnmark: pipeline/v1
name: sample-read-write-csv
description: Every CRM account, as a CSV file.

nodes:
  - id: accounts
    type: read
    source: crm-db
    asset: crm.accounts

  - id: out
    type: write
    input: accounts
    source: files
    path: samples/read-and-write/accounts.csv
    mode: replace          # create (the default) fails if the file exists; replace swaps it in
