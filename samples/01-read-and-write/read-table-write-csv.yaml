# Read a table, write a CSV file (a Kilnmark sample).
# Reads the CRM accounts table and writes every row to a CSV file in the files source.
# Look for: the run's rows read and written, and the file's own page in the catalogue after the next scan.
kilnmark: pipeline/v1
name: sample-read-write-csv
description: Every CRM account, as a CSV file.

nodes:
  - id: accounts
    type: read
    source: crm-db
    asset: crm.accounts

  - id: out
    type: write
    input: accounts
    source: files
    path: samples/read-and-write/accounts.csv
    mode: replace          # create (the default) fails if the file exists; replace swaps it in
