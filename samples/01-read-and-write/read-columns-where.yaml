# Read only the columns and rows you need (a Kilnmark sample).
# Reads five columns of the CRM customers, and only the Premier and Business customers who opted in
# to marketing and whose last name starts with S. Writes them to a CSV file. Reading less makes the
# run quicker, and keeps the columns you do not need out of the file.
# Why it matters: Reading only the columns and rows a job needs is a typical data-minimisation step
# under GDPR, and in US healthcare under HIPAA's minimum necessary standard: personal data a report
# does not use never leaves the source. It also keeps extracts small and quick.
# Look for: the note under the read node. It says who applies each part of the where: the database
# applies the segment and opt-in part as it reads, with each value bound rather than written into
# the SQL, and Kilnmark applies lower(...) as the rows arrive. The rows are the same either way.
# Needs: crm-db (the crm schema) and files.
kilnmark: pipeline/v1
name: sample-read-columns-where
description: Premier and Business customers who opted in, five columns.

nodes:
  - id: customers
    type: read
    source: crm-db
    asset: crm.customers
    columns: [customer_id, first_name, last_name, segment, created_at]   # in this order; the rest are not read
    where: "segment in ('Premier', 'Business') and marketing_opt_in and lower(last_name) like 's%'"

  - id: out
    type: write
    input: customers
    source: files
    path: samples/read-and-write/opted_in_customers.csv
    mode: replace
