# Aggregate: one row per group (a Kilnmark sample).
# Totals each shop order's lines: how many lines, how many items, what they are worth and how many
# different products they hold.
# Why it matters: Totals per group are the backbone of most reporting, for example balances per
# customer or payments per day. Totals that add up to the detail are what aggregation reviews check,
# for example under BCBS 239 for risk data.
# Look for: group_by and values. Without group_by, all the rows become one row of totals.
# Needs: shop-db (the shop schema) and files.
kilnmark: pipeline/v1
name: sample-aggregate
description: Each shop order's lines, items and value.

nodes:
  - id: lines
    type: read
    source: shop-db
    asset: shop.order_lines

  - id: per_order
    type: aggregate
    input: lines
    group_by: [order_id]
    values:
      lines: "count(*)"
      items: "sum(quantity)"
      order_value: "sum(quantity * unit_price)"
      products: "count_distinct(product_id)"

  - id: out
    type: write
    input: per_order
    source: files
    path: samples/aggregate/order_totals.csv
    mode: replace
