# Aggregate: a whole-table summary (a Kilnmark sample).
# Summarises the product catalogue by category: how many products, the price range and its width.
# Look for: a value can be any expression over the group, such as max(x) - min(x).
kilnmark: pipeline/v1
name: sample-catalogue-summary
description: Products by category.

nodes:
  - id: products
    type: read
    source: shop-db
    asset: stock.products

  - id: by_category
    type: aggregate
    input: products
    group_by: [category]
    values:
      products: "count(*)"
      cheapest: "min(list_price)"
      dearest: "max(list_price)"
      price_range: "max(list_price) - min(list_price)"

  - id: out
    type: write
    input: by_category
    source: files
    path: samples/aggregate/products_by_category.csv
    mode: replace
