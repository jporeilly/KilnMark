# Server variables: values set on the server (a Kilnmark sample).
# Names its file after the server variable sample_region, so the same YAML writes an EMEA file on
# one server and an APAC file on another. The parameter region takes the variable's value unless a
# run gives another.
# Why it matters: Development, test and production servers typically need one pipeline to use a
# different region, folder or limit. A server variable keeps that difference out of the YAML, so the
# version promoted is the version tested.
# Look for: ${vars.sample_region} as the parameter's default, and ${region} in the file's path.
# Needs: shop-db (the shop schema), files, and the server variable sample_region. The starter pack
# sets it; otherwise a steward or an admin sets it:
#   PUT /api/v1/variables/sample_region   {"type": "text", "value": "EMEA"}
# Without it, the sample is saved as a draft whose problem says the variable is not set.
kilnmark: pipeline/v1
name: sample-server-variable
description: Gold customers, in a file named after the server's region.

parameters:
  region: { type: text, default: "${vars.sample_region}", description: The region the file is for }

nodes:
  - id: customers
    type: read
    source: shop-db
    asset: shop.customers

  - id: gold
    type: filter
    input: customers
    condition: "loyalty_tier = 'gold'"

  - id: out
    type: write
    input: gold
    source: files
    path: samples/parameters/gold_customers_${region}.csv
    mode: replace
