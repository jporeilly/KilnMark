# Parameters: values given for each run (a Kilnmark sample).
# Reads the shop orders in the statuses asked for (a text list) with at least a given shipping fee
# (a number), and names the file after a label (text). Run it as it is, or give other values
# through the API:
#   POST /api/v1/pipelines/sample-orders-by-status/runs
#   {"parameters": {"statuses": ["shipped", "delivered"], "min_fee": 5, "label": "both"}}
# Why it matters: One pipeline that takes values for each run replaces many near-copies, so a change
# is made and reviewed once, which helps where change control needs evidence, for example under SOX.
# Bound values also keep what a person types out of the SQL.
# Look for: the note under the read node. status in ${statuses} becomes status in (?) with the
# value bound, so the database sends only those rows. A value only ever fills a value.
# Needs: shop-db (the shop schema) and files.
kilnmark: pipeline/v1
name: sample-orders-by-status
description: Shop orders in the statuses asked for.

parameters:
  statuses: { type: text list, default: [delivered], description: The order statuses to keep }
  min_fee: { type: number, default: 0, description: Only orders with at least this shipping fee }
  label: { type: text, default: delivered, description: Names the file written }

nodes:
  - id: orders
    type: read
    source: shop-db
    asset: shop.orders
    columns: [order_id, customer_id, ordered_at, status, shipping_fee]
    where: "status in ${statuses} and shipping_fee >= ${min_fee}"

  - id: out
    type: write
    input: orders
    source: files
    path: samples/parameters/orders_${label}.csv
    mode: replace
