# Route: send rows different ways (a Kilnmark sample).
# Sends each shop order line to the first route it meets: large lines (worth 200 or more), bulk
# lines (5 items or more) or, meeting neither, the out output. Each kind goes to a file of its own.
# Why it matters: Rows often need different handling by size or kind: for example, large payments
# sent for a second look while the rest go straight through. The first route that fits wins, so each
# row is handled once.
# Look for: each route's name is an output of the node. The order the routes are written in
# decides, so a line that is both large and bulk counts as large.
# Needs: shop-db (the shop schema) and files.
kilnmark: pipeline/v1
name: sample-route
description: Order lines by size.

nodes:
  - id: lines
    type: read
    source: shop-db
    asset: shop.order_lines

  - id: by_size
    type: route
    input: lines
    routes:
      large: "quantity * unit_price >= 200"
      bulk: "quantity >= 5"

  - id: large
    type: write
    input: by_size.large
    source: files
    path: samples/filter-and-route/large_lines.csv
    mode: replace

  - id: bulk
    type: write
    input: by_size.bulk
    source: files
    path: samples/filter-and-route/bulk_lines.csv
    mode: replace

  - id: rest
    type: write
    input: by_size
    source: files
    path: samples/filter-and-route/other_lines.csv
    mode: replace
