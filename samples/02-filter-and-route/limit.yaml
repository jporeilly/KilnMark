# Limit: the first rows only (a Kilnmark sample).
# Passes on the first 100 billing transactions and stops reading once it has them. Use it to try a
# pipeline on a few rows before you run it on all of them.
# Why it matters: Trying a pipeline on a few rows first is a cheap check before a long run against a
# production source, and it keeps test extracts small.
# Look for: the rows read, on the run's page: far fewer than the table holds.
# Needs: crm-db (the billing schema) and files.
kilnmark: pipeline/v1
name: sample-limit
description: The first 100 billing transactions.

nodes:
  - id: transactions
    type: read
    source: crm-db
    asset: billing.transactions

  - id: first
    type: limit
    input: transactions
    rows: 100

  - id: out
    type: write
    input: first
    source: files
    path: samples/filter-and-route/first_transactions.csv
    mode: replace
