# Flow: one pipeline for each region, several at once (a Kilnmark sample).
# Runs sample-server-variable once for each of three regions, giving it the region as its
# parameter, so each run writes its own file (gold_customers_EMEA.csv and so on). Two run at once,
# and the third starts when one ends. A notice then says how many succeeded, if none failed.
# Why it matters: Banks and insurers often run the same load for each region, legal entity or
# branch, and utilities and public bodies for each area. One flow over a list keeps the loads alike,
# runs a few at once, and says which failed.
# Look for: the for-each node (items, as, max_parallel, and timeout: each region's run is stopped,
# and fails, after 30 minutes), the flow's own max_parallel, and the condition on regions.failed.
# Needs: sample-server-variable, so shop-db and files. Running it needs a steward or above.
kilnmark: flow/v1
name: sample-for-each-region
description: Gold customers, one file for each region.
max_parallel: 2

nodes:
  - id: regions
    type: for-each
    pipeline: sample-server-variable
    items: [EMEA, APAC, AMER]
    as: region
    max_parallel: 2
    timeout: 30m

  - id: done
    type: notify
    title: "Gold customers written for ${regions.succeeded} of ${regions.items} regions"

connections:
  - { from: regions, to: done, when: "regions.failed = 0" }
