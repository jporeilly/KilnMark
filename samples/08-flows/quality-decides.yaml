# Flow: quality decides what runs next (a Kilnmark sample).
# Runs the quarantine gate sample; carries on to the order totals only if under limit_share of the
# customers were set aside, else tells the stewards and stops. A failure also stops it.
# Look for: conditions on what a node measured (check.quarantined_share), notify and stop.
kilnmark: flow/v1
name: sample-quality-decides
description: Clean customers, then total the orders only if quality holds.

parameters:
  limit_share: { type: number, default: 0.05, description: The largest share of customers that may be set aside }

nodes:
  - id: check
    type: run-pipeline
    pipeline: sample-gate-quarantine

  - id: totals
    type: run-pipeline
    pipeline: sample-aggregate

  - id: tell
    type: notify
    severity: medium
    title: "Customers: ${check.quarantined_share} set aside, more than ${limit_share}"
    message: The order totals did not run.

  - id: halt
    type: stop
    status: failed
    message: Too many customers were set aside

connections:
  - { from: check, to: totals, when: "check.quarantined_share < limit_share" }
  - { from: check, to: tell, when: "check.quarantined_share >= limit_share" }
  - { from: tell, to: halt }
  - { from: check, to: halt, when: failure }
