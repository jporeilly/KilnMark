# Flow: quality decides what runs next (a Kilnmark sample).
# Runs the quarantine gate sample. If fewer than limit_share of the customers were set aside, it goes
# on to total the orders; otherwise it tells the stewards and stops as failed. If the gate's run
# fails, the flow stops too.
# Why it matters: A report is often only as good as its inputs: if too many customers fail their
# checks, the totals built on them should wait. A condition on quality lets the flow stop and tell
# the stewards instead.
# Look for: conditions on what a node measured (check.quarantined_share), the notify node and the
# stop node.
# Needs: sample-gate-quarantine and sample-aggregate, so crm-db, shop-db and files. Running it needs
# a steward or above.
kilnmark: flow/v1
name: sample-quality-decides
description: Clean customers, then total the orders only if quality holds.

parameters:
  limit_share: { type: number, default: 0.05, description: The largest share of customers that may be set aside }

nodes:
  - id: check
    type: run-pipeline
    pipeline: sample-gate-quarantine

  - id: totals
    type: run-pipeline
    pipeline: sample-aggregate

  - id: tell
    type: notify
    severity: medium
    title: "Too many customers set aside: see customers_aside.csv"
    message: More of the customers were set aside than the flow's limit_share allows, so the order totals did not run.

  - id: halt
    type: stop
    status: failed
    message: Too many customers were set aside

connections:
  - { from: check, to: totals, when: "check.quarantined_share < limit_share" }
  - { from: check, to: tell, when: "check.quarantined_share >= limit_share" }
  - { from: tell, to: halt }
  - { from: check, to: halt, when: failure }
