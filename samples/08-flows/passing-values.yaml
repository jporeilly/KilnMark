# Flow: values passed on (a Kilnmark sample).
# statuses is inherited by sample-orders-by-status (both declare it); label is given with with:,
# built from the flow's own parameter; a wait spaces the runs out; the notice reads what an earlier
# node reported.
# Look for: inheritance by name, with:, ${orders.rows_written}, wait and notify.
kilnmark: flow/v1
name: sample-passing-values
description: Pull the orders asked for, then say how many.

parameters:
  statuses: { type: text list, default: [shipped, delivered] }
  batch: { type: text, default: nightly }

nodes:
  - id: orders
    type: run-pipeline
    pipeline: sample-orders-by-status
    with: { label: "${batch}", min_fee: 0 }

  - id: pause
    type: wait
    for: 5s

  - id: done
    type: notify
    title: "${orders.rows_written} orders written for the ${batch} batch"

connections:
  - { from: orders, to: pause }
  - { from: pause, to: done }
