# Flow: values passed on (a Kilnmark sample).
# Runs sample-orders-by-status with values from the flow, waits five seconds, then sends a notice
# saying how many orders were written.
# Why it matters: A batch typically runs with values decided in one place, such as the business date
# or the batch name. Passing them on by name keeps every pipeline in the batch on the same values.
# Look for: statuses, which the pipeline inherits because both declare it; label, given with with:
# from the flow's own batch parameter; and ${orders.rows_written}, what an earlier node reported,
# in the notice.
# Needs: sample-orders-by-status, so shop-db and files. Running it needs a steward or above.
kilnmark: flow/v1
name: sample-passing-values
description: Pull the orders asked for, then say how many.

parameters:
  statuses: { type: text list, default: [shipped, delivered] }
  batch: { type: text, default: nightly }

nodes:
  - id: orders
    type: run-pipeline
    pipeline: sample-orders-by-status
    with: { label: "${batch}", min_fee: 0 }

  - id: pause
    type: wait
    for: 5s

  - id: done
    type: notify
    title: "${orders.rows_written} orders written for the ${batch} batch"

connections:
  - { from: orders, to: pause }
  - { from: pause, to: done }
