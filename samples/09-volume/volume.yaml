# Volume: four million rows, to see where a run's time goes (a Kilnmark sample).
# Reads four million made-up till sales from Kilnmark's sample data, works out each line's value,
# adds the product's category with a lookup, writes the large lines to a file of their own and
# totals the rest per category and channel. It runs for several seconds: long enough to watch.
# Look for: on the run's page, where each node spent its time, rows per second through the run
# and which node held the others up.
kilnmark: pipeline/v1
name: sample-volume
description: Four million till sales, totalled per category and channel.

nodes:
  - id: sales
    type: read
    source: sample-data
    asset: volume/sales.csv

  - id: products
    type: read
    source: sample-data
    asset: stock/products.csv

  - id: valued
    type: compute
    input: sales
    columns:
      line_value: "quantity * unit_price"

  - id: categorised
    type: lookup
    inputs: { main: valued, lookup: products }
    on: { sku: sku }
    keep: [category]

  - id: by_size
    type: route
    input: categorised
    routes:
      large: "line_value >= 750"

  - id: totals
    type: aggregate
    input: by_size
    group_by: [category, channel]
    values:
      lines: "count(*)"
      items: "sum(quantity)"
      takings: "sum(line_value)"

  - id: totals_out
    type: write
    input: totals
    source: files
    path: samples/volume/takings_by_category_and_channel.csv
    mode: replace

  - id: large_out
    type: write
    input: by_size.large
    source: files
    path: samples/volume/large_lines.csv
    mode: replace
