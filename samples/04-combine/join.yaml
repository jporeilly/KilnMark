# Join: rows of two inputs with equal keys (a Kilnmark sample).
# Puts every shop order beside its customer. It is a full join, so it also keeps the orders with no
# customer and the customers with no order, with the other side's columns empty.
# Why it matters: Reconciling two systems, for example a ledger against the system that feeds it,
# typically means finding what is on one side and missing on the other. A full join shows both gaps
# at once.
# Look for: inputs: left and right, and how: full. The right side's customer_id comes out as
# right_customer_id, so neither is lost.
# Needs: shop-db (the shop schema) and files.
kilnmark: pipeline/v1
name: sample-join
description: Shop orders and customers side by side, with those that have no partner.

nodes:
  - id: orders
    type: read
    source: shop-db
    asset: shop.orders

  - id: customers
    type: read
    source: shop-db
    asset: shop.customers
    columns: [customer_id, first_name, last_name, loyalty_tier]

  - id: joined
    type: join
    inputs: { left: orders, right: customers }
    on: { customer_id: customer_id }
    how: full

  - id: out
    type: write
    input: joined
    source: files
    path: samples/combine/orders_and_customers.csv
    mode: replace
