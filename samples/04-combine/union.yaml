# Union: rows of several inputs together (a Kilnmark sample).
# Appends the 2023 customer archive to today's CRM customers, matching columns by name, and marks
# where each row came from.
# Why it matters: Regulated firms and public bodies often keep records for years, and a review may
# need current and archived records together, for example in a remediation exercise. Marking where
# each row came from keeps that plain.
# Look for: input: [a, b], which takes several inputs on one port, and the came_from column each
# side adds before the union.
# Needs: crm-db (the crm schema) and files.
kilnmark: pipeline/v1
name: sample-union
description: Current and archived CRM customers in one file.

nodes:
  - id: current
    type: read
    source: crm-db
    asset: crm.customers

  - id: archived
    type: read
    source: crm-db
    asset: crm.customers_archive_2023

  - id: current_marked
    type: compute
    input: current
    columns:
      came_from: "'current'"

  - id: archived_marked
    type: compute
    input: archived
    columns:
      came_from: "'archive 2023'"

  - id: everyone
    type: union
    input: [current_marked, archived_marked]

  - id: out
    type: write
    input: everyone
    source: files
    path: samples/combine/customers_all.csv
    mode: replace
