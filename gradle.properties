# Kilnmark version: each release adds one to the last part, and each part counts from 0 to 9 like a digit, carrying into the part before it
# (0.0.9 -> 0.1.0, 0.1.9 -> 0.2.0, 0.9.9 -> 1.0.0). 0.0.10 counted as 0.1.0.
version=0.1.3
group=io.kilnmark

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
