se</text><text x="560" y="268" font-size="11.5" fill="#5c6168">cause, confidence, evidence</text><path d="M616 282 L616 364" fill="none" stroke="#1c9a3b" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a1c9a3b)"/><text x="624" y="300" font-size="11.5" fill="#1c9a3b" text-anchor="start">0.8 or more</text><path d="M616 294 L380 294 L380 364" fill="none" stroke="#c08217" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ac08217)"/><text x="388" y="312" font-size="11.5" fill="#c08217" text-anchor="start">below, or critical</text><rect x="24" y="336" width="712" height="96" rx="12" fill="#1c9a3b" fill-opacity="0.06"/><text x="40" y="355" font-size="10.5" fill="#1c9a3b" font-weight="700" letter-spacing="0.08em">THEN</text><rect x="512" y="366" width="208" height="56" rx="8" fill="#1c9a3b" fill-opacity="0.08" stroke="#1c9a3b" stroke-width="1.25"/><circle cx="538" cy="394" r="13" fill="#1c9a3b" fill-opacity="0.16" stroke="#1c9a3b" stroke-width="1.25"/><g fill="none" stroke="#1c9a3b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M533 386h6l5 5v11h-11z"/><path d="M539 386v5h5"/></g><text x="560" y="391" font-size="13" fill="#1d1f22" font-weight="600">Draft a work order</text><text x="560" y="408" font-size="11.5" fill="#5c6168">with the evidence</text><rect x="276" y="366" width="208" height="56" rx="8" fill="#c08217" fill-opacity="0.13" stroke="#c08217" stroke-width="2"/><circle cx="302" cy="394" r="13" fill="#c08217" fill-opacity="0.16" stroke="#c08217" stroke-width="1.25"/><g fill="none" stroke="#c08217" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="302" cy="390.5" r="3.5"/><path d="M296 402a6 5 0 0 1 12 0"/></g><text x="324" y="391" font-size="13" fill="#1d1f22" font-weight="600">An engineer checks</text><text x="324" y="408" font-size="11.5" fill="#5c6168">the cause and the records</text><path d="M276 394 L250 394" fill="none" stroke="#1c9a3b" stroke-width="1.5" stroke-linejoin="round" mar