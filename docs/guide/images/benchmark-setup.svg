<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 486" width="760" height="486" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="The benchmark machines"><title>The benchmark machines</title><defs><marker id="a2f72d8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f72d8"/></marker><marker id="a17a179" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17a179"/></marker><marker id="a7b55c7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7b55c7"/></marker></defs><rect x="0" y="0" width="760" height="486" rx="0" fill="#ffffff"/><text x="24" y="34" font-size="16" fill="#1d1f22" font-weight="650">The benchmark machines</text><text x="24" y="55" font-size="12" fill="#5c6168">Kilnmark on one machine, the data on another, the results kept with the setup</text><rect x="24" y="76" width="712" height="96" rx="12" fill="#2f72d8" fill-opacity="0.06"/><text x="40" y="95" font-size="10.5" fill="#2f72d8" font-weight="700" letter-spacing="0.08em">BENCH MACHINE</text><rect x="40" y="106" width="208" height="56" rx="8" fill="#2f72d8" fill-opacity="0.08" stroke="#2f72d8" stroke-width="1.25"/><circle cx="66" cy="134" r="13" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><g fill="none" stroke="#2f72d8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="66" cy="134" r="3"/><circle cx="66" cy="134" r="7" stroke-dasharray="3 2.5"/></g><text x="88" y="131" font-size="13" fill="#1d1f22" font-weight="600">Data generator</text><text x="88" y="148" font-size="11.5" fill="#5c6168">fixed seeds, 1M to 1B rows</text><rect x="276" y="106" width="208" height="56" rx="8" fill="#2f72d8" fill-opacity="0.08" stroke="#2f72d8" stroke-width="1.25"/><circle cx="302" cy="134" r="13" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><g fill="none" stroke="#2f72d8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M296 129l4 4l-4 4"/><path d="M303 138h6"/></g><text x="324" y="131" font-size="13" fill="#1d1f22" font-weight="600">lab bench</text><text x="324" y="148" font-size="11.5" fill="#5c6168">starts each run, five times</text><rect x="512" y="106" width="208" height="56" rx="8" fill="#2f72d8" fill-opacity="0.13" stroke="#2f72d8" stroke-width="2"/><circle cx="538" cy="134" r="13" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><g fill="none" stroke="#2f72d8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M534 128l10 6l-10 6z"/></g><text x="560" y="131" font-size="13" fill="#1d1f22" font-weight="600">Kilnmark</text><text x="560" y="148" font-size="11.5" fill="#5c6168">server and workers</text><path d="M484 134 L510 134" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><path d="M210 162 L210 228" fill="none" stroke="#17a179" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a17a179)"/><text x="218" y="182" font-size="11.5" fill="#17a179" text-anchor="start">makes the data once</text><path d="M616 162 L616 228" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><text x="624" y="182" font-size="11.5" fill="#2f72d8" text-anchor="start">reads and writes</text><rect x="24" y="200" width="712" height="96" rx="12" fill="#17a179" fill-opacity="0.06"/><text x="40" y="219" font-size="10.5" fill="#17a179" font-weight="700" letter-spacing="0.08em">DATABASE MACHINE</text><rect x="40" y="230" width="208" height="56" rx="8" fill="#17a179" fill-opacity="0.08" stroke="#17a179" stroke-width="1.25"/><circle cx="66" cy="258" r="13" fill="#17a179" fill-opacity="0.16" stroke="#17a179" stroke-width="1.25"/><g fill="none" stroke="#17a179" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="66" cy="253" rx="7" ry="3"/><path d="M59 253v10a7 3 0 0 0 14 0v-10"/><path d="M59 258a7 3 0 0 0 14 0"/></g><text x="88" y="255" font-size="13" fill="#1d1f22" font-weight="600">Source databases</text><text x="88" y="272" font-size="11.5" fill="#5c6168">PostgreSQL first, then others</text><rect x="276" y="230" width="208" height="56" rx="8" fill="#17a179" fill-opacity="0.08" stroke="#17a179" stroke-width="1.25"/><circle cx="302" cy="258" r="13" fill="#17a179" fill-opacity="0.16" stroke="#17a179" stroke-width="1.25"/><g fill="none" stroke="#17a179" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M297 250h6l5 5v11h-11z"/><path d="M303 250v5h5"/></g><text x="324" y="255" font-size="13" fill="#1d1f22" font-weight="600">Files</text><text x="324" y="272" font-size="11.5" fill="#5c6168">CSV and Parquet</text><rect x="512" y="230" width="208" height="56" rx="8" fill="#17a179" fill-opacity="0.08" stroke="#17a179" stroke-width="1.25"/><circle cx="538" cy="258" r="13" fill="#17a179" fill-opacity="0.16" stroke="#17a179" stroke-width="1.25"/><g fill="none" stroke="#17a179" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="538" cy="253" rx="7" ry="3"/><path d="M531 253v10a7 3 0 0 0 14 0v-10"/><path d="M531 258a7 3 0 0 0 14 0"/></g><text x="560" y="255" font-size="13" fill="#1d1f22" font-weight="600">Target databases</text><text x="560" y="272" font-size="11.5" fill="#5c6168">written by each run</text><rect x="24" y="324" width="712" height="96" rx="12" fill="#7b55c7" fill-opacity="0.06"/><text x="40" y="343" font-size="10.5" fill="#7b55c7" font-weight="700" letter-spacing="0.08em">RESULTS</text><rect x="40" y="354" width="208" height="56" rx="8" fill="#7b55c7" fill-opacity="0.08" stroke="#7b55c7" stroke-width="1.25"/><circle cx="66" cy="382" r="13" fill="#7b55c7" fill-opacity="0.16" stroke="#7b55c7" stroke-width="1.25"/><g fill="none" stroke="#7b55c7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M60 377h12M60 382h12M60 387h8"/></g><text x="88" y="379" font-size="13" fill="#1d1f22" font-weight="600">A CSV per benchmark</text><text x="88" y="396" font-size="11.5" fill="#5c6168">one row per run, with setup</text><rect x="276" y="354" width="208" height="56" rx="8" fill="#7b55c7" fill-opacity="0.08" stroke="#7b55c7" stroke-width="1.25"/><circle cx="302" cy="382" r="13" fill="#7b55c7" fill-opacity="0.16" stroke="#7b55c7" stroke-width="1.25"/><g fill="none" stroke="#7b55c7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M302 377c-2 -2 -6 -2 -8 -1v12c2 -1 6 -1 8 1c2 -2 6 -2 8 -1v-12c-2 -1 -6 -1 -8 1z"/><path d="M302 377v12"/></g><text x="324" y="379" font-size="13" fill="#1d1f22" font-weight="600">Charts, results note</text><text x="324" y="396" font-size="11.5" fill="#5c6168">every run, not the best</text><rect x="512" y="354" width="208" height="56" rx="8" fill="#7b55c7" fill-opacity="0.08" stroke="#7b55c7" stroke-width="1.25"/><circle cx="538" cy="382" r="13" fill="#7b55c7" fill-opacity="0.16" stroke="#7b55c7" stroke-width="1.25"/><g fill="none" stroke="#7b55c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M533 382l4 4l7 -8"/></g><text x="560" y="379" font-size="13" fill="#1d1f22" font-weight="600">Nightly check</text><text x="560" y="396" font-size="11.5" fill="#5c6168">fails if 15% slower</text><path d="M248 382 L274 382" fill="none" stroke="#7b55c7" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a7b55c7)"/><path d="M484 382 L510 382" fill="none" stroke="#7b55c7" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a7b55c7)"/><rect x="24" y="436" width="712" height="34" rx="8" fill="#efede7"/><g fill="none" stroke="#5c6168" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="44" cy="453" r="3"/><circle cx="44" cy="453" r="7" stroke-dasharray="3 2.5"/></g><text x="62" y="457.5" font-size="11.5" fill="#1d1f22">To start, one machine holds both: stop the CI runners first and keep the same memory shares every run.</text></svg>
