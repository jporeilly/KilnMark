<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 362" width="760" height="362" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="How a sort carries on on disk"><title>How a sort carries on on disk</title><defs><marker id="a2f72d8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f72d8"/></marker><marker id="ae8663d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e8663d"/></marker><marker id="a17a179" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17a179"/></marker></defs><rect x="0" y="0" width="760" height="362" rx="0" fill="#ffffff"/><text x="24" y="34" font-size="16" fill="#1d1f22" font-weight="650">How a sort carries on on disk</text><text x="24" y="55" font-size="12" fill="#5c6168">In memory while the rows fit; past the limit, sorted runs on disk, merged at the end</text><rect x="24" y="76" width="712" height="96" rx="12" fill="#2f72d8" fill-opacity="0.06"/><text x="40" y="95" font-size="10.5" fill="#2f72d8" font-weight="700" letter-spacing="0.08em">AS ROWS ARRIVE</text><rect x="40" y="106" width="208" height="56" rx="8" fill="#2f72d8" fill-opacity="0.08" stroke="#2f72d8" stroke-width="1.25"/><circle cx="66" cy="134" r="13" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><g fill="none" stroke="#2f72d8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M62 128l10 6l-10 6z"/></g><text x="88" y="131" font-size="13" fill="#1d1f22" font-weight="600">Rows arrive</text><text x="88" y="148" font-size="11.5" fill="#5c6168">a batch at a time</text><rect x="276" y="106" width="208" height="56" rx="8" fill="#2f72d8" fill-opacity="0.08" stroke="#2f72d8" stroke-width="1.25"/><circle cx="302" cy="134" r="13" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><g fill="none" stroke="#2f72d8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="296" y="128" width="12" height="12" rx="2"/><path d="M299 125v3M305 125v3M299 140v3M305 140v3"/></g><text x="324" y="131" font-size="13" fill="#1d1f22" font-weight="600">Held in memory</text><text x="324" y="148" font-size="11.5" fill="#5c6168">up to memory_limit_mb</text><rect x="512" y="106" width="208" height="56" rx="8" fill="#e8663d" fill-opacity="0.08" stroke="#e8663d" stroke-width="1.25"/><circle cx="538" cy="134" r="13" fill="#e8663d" fill-opacity="0.16" stroke="#e8663d" stroke-width="1.25"/><g fill="none" stroke="#e8663d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="531" y="132" width="14" height="10" rx="2"/><path d="M534 132v-3a4 4 0 0 1 8 0v3"/></g><text x="560" y="131" font-size="13" fill="#1d1f22" font-weight="600">Past the limit</text><text x="560" y="148" font-size="11.5" fill="#5c6168">sorted, written as a run</text><path d="M248 134 L274 134" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><path d="M484 134 L510 134" fill="none" stroke="#e8663d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ae8663d)"/><path d="M616 162 L616 228" fill="none" stroke="#e8663d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ae8663d)"/><text x="624" y="182" font-size="11.5" fill="#e8663d" text-anchor="start">each run a file</text><path d="M380 162 L380 228" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><text x="388" y="182" font-size="11.5" fill="#2f72d8" text-anchor="start">nothing spilled: sorted here</text><rect x="24" y="200" width="712" height="96" rx="12" fill="#17a179" fill-opacity="0.06"/><text x="40" y="219" font-size="10.5" fill="#17a179" font-weight="700" letter-spacing="0.08em">WHEN THE INPUT ENDS</text><rect x="512" y="230" width="208" height="56" rx="8" fill="#e8663d" fill-opacity="0.08" stroke="#e8663d" stroke-width="1.25"/><circle cx="538" cy="258" r="13" fill="#e8663d" fill-opacity="0.16" stroke="#e8663d" stroke-width="1.25"/><g fill="none" stroke="#e8663d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M533 250h6l5 5v11h-11z"/><path d="M539 250v5h5"/></g><text x="560" y="255" font-size="13" fill="#1d1f22" font-weight="600">Runs on disk</text><text x="560" y="272" font-size="11.5" fill="#5c6168">merged 64 at a time</text><rect x="276" y="230" width="208" height="56" rx="8" fill="#17a179" fill-opacity="0.08" stroke="#17a179" stroke-width="1.25"/><circle cx="302" cy="258" r="13" fill="#17a179" fill-opacity="0.16" stroke="#17a179" stroke-width="1.25"/><g fill="none" stroke="#17a179" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M297 258l4 4l7 -8"/></g><text x="324" y="255" font-size="13" fill="#1d1f22" font-weight="600">Rows in order</text><text x="324" y="272" font-size="11.5" fill="#5c6168">equal rows keep their order</text><rect x="40" y="230" width="208" height="56" rx="8" fill="#17a179" fill-opacity="0.13" stroke="#17a179" stroke-width="2"/><circle cx="66" cy="258" r="13" fill="#17a179" fill-opacity="0.16" stroke="#17a179" stroke-width="1.25"/><g fill="none" stroke="#17a179" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M62 252l10 6l-10 6z"/></g><text x="88" y="255" font-size="13" fill="#1d1f22" font-weight="600">The next node</text><text x="88" y="272" font-size="11.5" fill="#5c6168">8,192 rows a batch</text><path d="M510 258 L486 258" fill="none" stroke="#e8663d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ae8663d)"/><path d="M274 258 L250 258" fill="none" stroke="#17a179" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a17a179)"/><rect x="24" y="312" width="712" height="34" rx="8" fill="#efede7"/><g fill="none" stroke="#5c6168" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="37" y="327" width="14" height="10" rx="2"/><path d="M40 327v-3a4 4 0 0 1 8 0v3"/></g><text x="62" y="333.5" font-size="11.5" fill="#1d1f22">Runs are encrypted with a key only the node holds, in its own temporary folder, deleted when it ends, fails or stops.</text></svg>
