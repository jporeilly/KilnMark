<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" width="760" height="392" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="A retry with the same request key gets the same run"><title>A retry with the same request key gets the same run</title><defs><marker id="a2f72d8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f72d8"/></marker><marker id="ad23f3f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d23f3f"/></marker><marker id="a1c9a3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1c9a3b"/></marker></defs><rect x="0" y="0" width="760" height="392" rx="0" fill="#ffffff"/><text x="24" y="34" font-size="16" fill="#1d1f22" font-weight="650">A retry with the same request key gets the same run</text><text x="24" y="55" font-size="12" fill="#5c6168">The work never runs twice because a scheduler asked twice</text><rect x="24" y="80" width="236" height="56" rx="8" fill="#e8663d" fill-opacity="0.08" stroke="#e8663d" stroke-width="1.25"/><circle cx="50" cy="108" r="13" fill="#e8663d" fill-opacity="0.16" stroke="#e8663d" stroke-width="1.25"/><g fill="none" stroke="#e8663d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M44 103l4 4l-4 4"/><path d="M51 112h6"/></g><text x="72" y="105" font-size="13" fill="#1d1f22" font-weight="600">First try</text><text x="72" y="122" font-size="11.5" fill="#5c6168">key: daily-load-2026-11-06</text><path d="M260 108 L284 108" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><rect x="286" y="80" width="220" height="56" rx="8" fill="#2f72d8" fill-opacity="0.08" stroke="#2f72d8" stroke-width="1.25"/><circle cx="312" cy="108" r="13" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><g fill="none" stroke="#2f72d8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M308 102l10 6l-10 6z"/></g><text x="334" y="105" font-size="13" fill="#1d1f22" font-weight="600">Run 42 starts</text><text x="334" y="122" font-size="11.5" fill="#5c6168">kept with its key, together</text><path d="M506 108 L530 108" fill="none" stroke="#d23f3f" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#ad23f3f)"/><rect x="532" y="80" width="204" height="56" rx="8" fill="#d23f3f" fill-opacity="0.08" stroke="#d23f3f" stroke-width="1.25" stroke-dasharray="4 3"/><circle cx="558" cy="108" r="13" fill="#d23f3f" fill-opacity="0.16" stroke="#d23f3f" stroke-width="1.25"/><g fill="none" stroke="#d23f3f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M552 102l12 12M564 102l-12 12"/></g><text x="580" y="105" font-size="13" fill="#1d1f22" font-weight="600">The answer is lost</text><text x="580" y="122" font-size="11.5" fill="#5c6168">the network dropped it</text><rect x="24" y="172" width="236" height="56" rx="8" fill="#e8663d" fill-opacity="0.08" stroke="#e8663d" stroke-width="1.25"/><circle cx="50" cy="200" r="13" fill="#e8663d" fill-opacity="0.16" stroke="#e8663d" stroke-width="1.25"/><g fill="none" stroke="#e8663d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M44 195l4 4l-4 4"/><path d="M51 204h6"/></g><text x="72" y="197" font-size="13" fill="#1d1f22" font-weight="600">Retry, the same key</text><text x="72" y="214" font-size="11.5" fill="#5c6168">same token, same values</text><path d="M260 200 L284 200" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><rect x="286" y="172" width="220" height="56" rx="8" fill="#2f72d8" fill-opacity="0.08" stroke="#2f72d8" stroke-width="1.25"/><circle cx="312" cy="200" r="13" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><g fill="none" stroke="#2f72d8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="308" cy="200" r="5"/><path d="M313 200h9M319 200v4M322 200v3"/></g><text x="334" y="197" font-size="13" fill="#1d1f22" font-weight="600">Key found</text><text x="334" y="214" font-size="11.5" fill="#5c6168">no second run starts</text><path d="M506 200 L530 200" fill="none" stroke="#1c9a3b" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a1c9a3b)"/><rect x="532" y="172" width="204" height="56" rx="8" fill="#1c9a3b" fill-opacity="0.13" stroke="#1c9a3b" stroke-width="2"/><circle cx="558" cy="200" r="13" fill="#1c9a3b" fill-opacity="0.16" stroke="#1c9a3b" stroke-width="1.25"/><g fill="none" stroke="#1c9a3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M553 200l4 4l7 -8"/></g><text x="580" y="197" font-size="13" fill="#1d1f22" font-weight="600">Run 42, answer 200</text><text x="580" y="214" font-size="11.5" fill="#5c6168">Idempotent-Replayed: true</text><rect x="24" y="264" width="236" height="56" rx="8" fill="#e8663d" fill-opacity="0.08" stroke="#e8663d" stroke-width="1.25"/><circle cx="50" cy="292" r="13" fill="#e8663d" fill-opacity="0.16" stroke="#e8663d" stroke-width="1.25"/><g fill="none" stroke="#e8663d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M44 287l4 4l-4 4"/><path d="M51 296h6"/></g><text x="72" y="289" font-size="13" fill="#1d1f22" font-weight="600">The same key, other work</text><text x="72" y="306" font-size="11.5" fill="#5c6168">another pipeline, version or values</text><path d="M260 292 L530 292" fill="none" stroke="#d23f3f" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#ad23f3f)"/><rect x="532" y="264" width="204" height="56" rx="8" fill="#d23f3f" fill-opacity="0.08" stroke="#d23f3f" stroke-width="1.25"/><circle cx="558" cy="292" r="13" fill="#d23f3f" fill-opacity="0.16" stroke="#d23f3f" stroke-width="1.25"/><g fill="none" stroke="#d23f3f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M552 286l12 12M564 286l-12 12"/></g><text x="580" y="289" font-size="13" fill="#1d1f22" font-weight="600">Refused, 422</text><text x="580" y="306" font-size="11.5" fill="#5c6168">use a new key for it</text><rect x="24" y="342" width="712" height="34" rx="8" fill="#efede7"/><g fill="none" stroke="#5c6168" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M44 351l7 3v5c0 4 -3 7 -7 8c-4 -1 -7 -4 -7 -8v-5z"/></g><text x="62" y="363.5" font-size="11.5" fill="#1d1f22">A key lasts 24 hours, for one token or person. A request that could not start a run keeps no key.</text></svg>
