<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="How a schedule fires"><title>How a schedule fires</title><defs><marker id="a1f3d73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f3d73"/></marker><marker id="a2f72d8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f72d8"/></marker></defs><rect x="0" y="0" width="760" height="350" rx="0" fill="#ffffff"/><text x="24" y="34" font-size="16" fill="#1d1f22" font-weight="650">How a schedule fires</text><text x="24" y="55" font-size="12" fill="#5c6168">The claim commits before the run is queued, so each fire happens at most once</text><rect x="24" y="76" width="712" height="96" rx="12" fill="#1f3d73" fill-opacity="0.06"/><text x="40" y="95" font-size="10.5" fill="#1f3d73" font-weight="700" letter-spacing="0.08em">ONE SHORT TRANSACTION</text><rect x="40" y="106" width="208" height="56" rx="8" fill="#1f3d73" fill-opacity="0.08" stroke="#1f3d73" stroke-width="1.25"/><circle cx="64" cy="134" r="10" fill="#1f3d73" fill-opacity="0.16" stroke="#1f3d73" stroke-width="1.25"/><text x="64" y="138" font-size="11" fill="#1f3d73" font-weight="600" text-anchor="middle">1</text><text x="82" y="131" font-size="13" fill="#1d1f22" font-weight="600">Due schedules found</text><text x="82" y="148" font-size="11.5" fill="#5c6168">every 30 s, scheduler role</text><rect x="276" y="106" width="208" height="56" rx="8" fill="#1f3d73" fill-opacity="0.08" stroke="#1f3d73" stroke-width="1.25"/><circle cx="300" cy="134" r="10" fill="#1f3d73" fill-opacity="0.16" stroke="#1f3d73" stroke-width="1.25"/><text x="300" y="138" font-size="11" fill="#1f3d73" font-weight="600" text-anchor="middle">2</text><text x="318" y="131" font-size="13" fill="#1d1f22" font-weight="600">Each one locked</text><text x="318" y="148" font-size="11.5" fill="#5c6168">others are skipped</text><rect x="512" y="106" width="208" height="56" rx="8" fill="#1f3d73" fill-opacity="0.08" stroke="#1f3d73" stroke-width="1.25"/><circle cx="536" cy="134" r="10" fill="#1f3d73" fill-opacity="0.16" stroke="#1f3d73" stroke-width="1.25"/><text x="536" y="138" font-size="11" fill="#1f3d73" font-weight="600" text-anchor="middle">3</text><text x="554" y="131" font-size="13" fill="#1d1f22" font-weight="600">Next fire moved on</text><text x="554" y="148" font-size="11.5" fill="#5c6168">past now; then it commits</text><path d="M248 134 L274 134" fill="none" stroke="#1f3d73" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a1f3d73)"/><path d="M484 134 L510 134" fill="none" stroke="#1f3d73" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a1f3d73)"/><rect x="24" y="188" width="712" height="96" rx="12" fill="#2f72d8" fill-opacity="0.06"/><text x="40" y="207" font-size="10.5" fill="#2f72d8" font-weight="700" letter-spacing="0.08em">AFTER IT COMMITS</text><rect x="512" y="218" width="208" height="56" rx="8" fill="#2f72d8" fill-opacity="0.08" stroke="#2f72d8" stroke-width="1.25"/><circle cx="536" cy="246" r="10" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><text x="536" y="250" font-size="11" fill="#2f72d8" font-weight="600" text-anchor="middle">4</text><text x="554" y="243" font-size="13" fill="#1d1f22" font-weight="600">The run is queued</text><text x="554" y="260" font-size="11.5" fill="#5c6168">latest version, as Run now</text><rect x="276" y="218" width="208" height="56" rx="8" fill="#2f72d8" fill-opacity="0.08" stroke="#2f72d8" stroke-width="1.25"/><circle cx="300" cy="246" r="10" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><text x="300" y="250" font-size="11" fill="#2f72d8" font-weight="600" text-anchor="middle">5</text><text x="318" y="243" font-size="13" fill="#1d1f22" font-weight="600">Acts as the schedule</text><text x="318" y="260" font-size="11.5" fill="#5c6168">as steward or designer</text><rect x="40" y="218" width="208" height="56" rx="8" fill="#1c9a3b" fill-opacity="0.13" stroke="#1c9a3b" stroke-width="2"/><circle cx="66" cy="246" r="13" fill="#1c9a3b" fill-opacity="0.16" stroke="#1c9a3b" stroke-width="1.25"/><g fill="none" stroke="#1c9a3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M61 246l4 4l7 -8"/></g><text x="88" y="243" font-size="13" fill="#1d1f22" font-weight="600">Outcome recorded</text><text x="88" y="260" font-size="11.5" fill="#5c6168">started, skipped, failed</text><path d="M616 162 L616 216" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><path d="M512 246 L486 246" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><path d="M276 246 L250 246" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><rect x="24" y="300" width="712" height="34" rx="8" fill="#efede7"/><g fill="none" stroke="#5c6168" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M44 309l7 3v5c0 4 -3 7 -7 8c-4 -1 -7 -4 -7 -8v-5z"/></g><text x="62" y="321.5" font-size="11.5" fill="#1d1f22">Two schedulers never fire one schedule twice. A crash between claim and queue loses that fire, never doubles it.</text></svg>
