<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 482" width="760" height="482" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="What a node's timeout does"><title>What a node's timeout does</title><defs><marker id="ab4aea2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b4aea2"/></marker><marker id="a2f72d8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f72d8"/></marker><marker id="a1c9a3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1c9a3b"/></marker><marker id="ad23f3f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d23f3f"/></marker></defs><rect x="0" y="0" width="760" height="482" rx="0" fill="#ffffff"/><text x="24" y="34" font-size="16" fill="#1d1f22" font-weight="650">What a node's timeout does</text><text x="24" y="55" font-size="12" fill="#5c6168">On run-pipeline, for-each and sql nodes: the time counts only while the work runs</text><rect x="24" y="76" width="712" height="96" rx="12" fill="#5c6168" fill-opacity="0.06"/><text x="40" y="95" font-size="10.5" fill="#5c6168" font-weight="700" letter-spacing="0.08em">NOT COUNTED</text><rect x="40" y="106" width="208" height="56" rx="8" fill="#efede7" fill-opacity="1" stroke="#b4aea2" stroke-width="1.25"/><circle cx="64" cy="134" r="10" fill="#5c6168" fill-opacity="0.16" stroke="#5c6168" stroke-width="1.25"/><text x="64" y="138" font-size="11" fill="#5c6168" font-weight="600" text-anchor="middle">1</text><text x="82" y="131" font-size="13" fill="#1d1f22" font-weight="600">Node ready</text><text x="82" y="148" font-size="11.5" fill="#5c6168">its connections allow it</text><rect x="276" y="106" width="208" height="56" rx="8" fill="#efede7" fill-opacity="1" stroke="#b4aea2" stroke-width="1.25"/><circle cx="300" cy="134" r="10" fill="#5c6168" fill-opacity="0.16" stroke="#5c6168" stroke-width="1.25"/><text x="300" y="138" font-size="11" fill="#5c6168" font-weight="600" text-anchor="middle">2</text><text x="318" y="131" font-size="13" fill="#1d1f22" font-weight="600">Waits its turn</text><text x="318" y="148" font-size="11.5" fill="#5c6168">for a worker or a source</text><rect x="512" y="106" width="208" height="56" rx="8" fill="#2f72d8" fill-opacity="0.08" stroke="#2f72d8" stroke-width="1.25"/><circle cx="536" cy="134" r="10" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><text x="536" y="138" font-size="11" fill="#2f72d8" font-weight="600" text-anchor="middle">3</text><text x="554" y="131" font-size="13" fill="#1d1f22" font-weight="600">A worker takes it</text><text x="554" y="148" font-size="11.5" fill="#5c6168">the timeout starts now</text><path d="M248 134 L274 134" fill="none" stroke="#b4aea2" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ab4aea2)"/><path d="M484 134 L510 134" fill="none" stroke="#b4aea2" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ab4aea2)"/><rect x="24" y="188" width="712" height="96" rx="12" fill="#2f72d8" fill-opacity="0.06"/><text x="40" y="207" font-size="10.5" fill="#2f72d8" font-weight="700" letter-spacing="0.08em">COUNTED: TIMEOUT: 2H</text><rect x="512" y="218" width="208" height="56" rx="8" fill="#2f72d8" fill-opacity="0.08" stroke="#2f72d8" stroke-width="1.25"/><circle cx="538" cy="246" r="13" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><g fill="none" stroke="#2f72d8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M534 240l10 6l-10 6z"/></g><text x="560" y="243" font-size="13" fill="#1d1f22" font-weight="600">Runs</text><text x="560" y="260" font-size="11.5" fill="#5c6168">its pipeline run, or its SQL</text><path d="M616 162 L616 216" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><path d="M512 246 L472 246" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><polygon points="290,246 380,210 470,246 380,282" fill="#efede7" stroke="#b4aea2" stroke-width="1.25"/><text x="380" y="242" font-size="12.5" fill="#1d1f22" font-weight="600" text-anchor="middle">Ended within</text><text x="380" y="258" font-size="12.5" fill="#1d1f22" font-weight="600" text-anchor="middle">its timeout?</text><path d="M290 246 L250 246" fill="none" stroke="#1c9a3b" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a1c9a3b)"/><text x="276" y="238" font-size="11.5" fill="#1c9a3b" text-anchor="end">yes</text><rect x="40" y="218" width="208" height="56" rx="8" fill="#1c9a3b" fill-opacity="0.13" stroke="#1c9a3b" stroke-width="2"/><circle cx="66" cy="246" r="13" fill="#1c9a3b" fill-opacity="0.16" stroke="#1c9a3b" stroke-width="1.25"/><g fill="none" stroke="#1c9a3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M61 246l4 4l7 -8"/></g><text x="88" y="243" font-size="13" fill="#1d1f22" font-weight="600">Ends as it ended</text><text x="88" y="260" font-size="11.5" fill="#5c6168">succeeded or failed</text><rect x="24" y="300" width="712" height="96" rx="12" fill="#d23f3f" fill-opacity="0.06"/><text x="40" y="319" font-size="10.5" fill="#d23f3f" font-weight="700" letter-spacing="0.08em">PAST IT</text><path d="M380 282 L380 328" fill="none" stroke="#d23f3f" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#ad23f3f)"/><text x="388" y="298" font-size="11.5" fill="#d23f3f" text-anchor="start">no</text><rect x="276" y="330" width="208" height="56" rx="8" fill="#d23f3f" fill-opacity="0.08" stroke="#d23f3f" stroke-width="1.25" stroke-dasharray="4 3"/><circle cx="302" cy="358" r="13" fill="#d23f3f" fill-opacity="0.16" stroke="#d23f3f" stroke-width="1.25"/><g fill="none" stroke="#d23f3f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="302" cy="358" r="7"/><path d="M302 354v4l3 2"/></g><text x="324" y="355" font-size="13" fill="#1d1f22" font-weight="600">Stopped</text><text x="324" y="372" font-size="11.5" fill="#5c6168">run cancelled, or rolled back</text><path d="M484 358 L510 358" fill="none" stroke="#d23f3f" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ad23f3f)"/><rect x="512" y="330" width="208" height="56" rx="8" fill="#d23f3f" fill-opacity="0.08" stroke="#d23f3f" stroke-width="1.25"/><circle cx="538" cy="358" r="13" fill="#d23f3f" fill-opacity="0.16" stroke="#d23f3f" stroke-width="1.25"/><g fill="none" stroke="#d23f3f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M532 352l12 12M544 352l-12 12"/></g><text x="560" y="355" font-size="13" fill="#1d1f22" font-weight="600">Node fails</text><text x="560" y="372" font-size="11.5" fill="#5c6168">&quot;Took longer than 2h&quot;</text><path d="M616 386 L616 412 L144 412 L144 388" fill="none" stroke="#d23f3f" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ad23f3f)"/><rect x="40" y="330" width="208" height="56" rx="8" fill="#d23f3f" fill-opacity="0.08" stroke="#d23f3f" stroke-width="1.25"/><circle cx="66" cy="358" r="13" fill="#d23f3f" fill-opacity="0.16" stroke="#d23f3f" stroke-width="1.25"/><g fill="none" stroke="#d23f3f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M60 362v-4a6 6 0 0 1 12 0v4l2 2h-16z"/><path d="M64 366a2 2 0 0 0 4 0"/></g><text x="88" y="355" font-size="13" fill="#1d1f22" font-weight="600">failure connection</text><text x="88" y="372" font-size="11.5" fill="#5c6168">taken: notify, or stop</text><rect x="24" y="428" width="712" height="34" rx="8" fill="#efede7"/><g fill="none" stroke="#5c6168" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="44" cy="445" r="3"/><circle cx="44" cy="445" r="7" stroke-dasharray="3 2.5"/></g><text x="62" y="449.5" font-size="11.5" fill="#1d1f22">A for-each node gives each item's run the whole timeout; an item stopped for it counts as failed.</text></svg>
