<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="How a wait-for node waits"><title>How a wait-for node waits</title><defs><marker id="a2f72d8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f72d8"/></marker><marker id="a1c9a3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1c9a3b"/></marker><marker id="ad23f3f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d23f3f"/></marker></defs><rect x="0" y="0" width="760" height="310" rx="0" fill="#ffffff"/><text x="24" y="34" font-size="16" fill="#1d1f22" font-weight="650">How a wait-for node waits</text><text x="24" y="55" font-size="12" fill="#5c6168">It looks at once, then every so often, until it is ready or its timeout passes</text><rect x="40" y="68" width="200" height="56" rx="8" fill="#2f72d8" fill-opacity="0.08" stroke="#2f72d8" stroke-width="1.25"/><circle cx="64" cy="96" r="10" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><text x="64" y="100" font-size="11" fill="#2f72d8" font-weight="600" text-anchor="middle">1</text><text x="82" y="93" font-size="13" fill="#1d1f22" font-weight="600">Look</text><text x="82" y="110" font-size="11.5" fill="#5c6168">the files, or the query</text><path d="M240 96 L298 96" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><polygon points="300,96 380,62 460,96 380,130" fill="#efede7" stroke="#b4aea2" stroke-width="1.25"/><text x="380" y="100" font-size="12.5" fill="#1d1f22" font-weight="600" text-anchor="middle">Ready?</text><path d="M460 96 L552 96" fill="none" stroke="#1c9a3b" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a1c9a3b)"/><text x="506" y="88" font-size="11.5" fill="#1c9a3b" text-anchor="middle">yes</text><rect x="554" y="68" width="182" height="56" rx="8" fill="#1c9a3b" fill-opacity="0.13" stroke="#1c9a3b" stroke-width="2"/><circle cx="580" cy="96" r="13" fill="#1c9a3b" fill-opacity="0.16" stroke="#1c9a3b" stroke-width="1.25"/><g fill="none" stroke="#1c9a3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M575 96l4 4l7 -8"/></g><text x="602" y="93" font-size="13" fill="#1d1f22" font-weight="600">Succeeds</text><text x="602" y="110" font-size="11.5" fill="#5c6168">found, waited_s</text><path d="M380 130 L380 176" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><text x="390" y="152" font-size="11.5" fill="#5c6168" text-anchor="start">no</text><rect x="270" y="178" width="220" height="56" rx="8" fill="#2f72d8" fill-opacity="0.08" stroke="#2f72d8" stroke-width="1.25"/><circle cx="296" cy="206" r="13" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><g fill="none" stroke="#2f72d8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="289" y="204" width="14" height="10" rx="2"/><path d="M292 204v-3a4 4 0 0 1 8 0v3"/></g><text x="318" y="203" font-size="13" fill="#1d1f22" font-weight="600">Wait its every</text><text x="318" y="220" font-size="11.5" fill="#5c6168">no worker, no connection</text><path d="M270 206 L140 206 L140 126" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><text x="150" y="198" font-size="11.5" fill="#2f72d8" text-anchor="start">look again</text><path d="M490 206 L552 206" fill="none" stroke="#d23f3f" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#ad23f3f)"/><rect x="554" y="178" width="182" height="56" rx="8" fill="#d23f3f" fill-opacity="0.08" stroke="#d23f3f" stroke-width="1.25"/><circle cx="580" cy="206" r="13" fill="#d23f3f" fill-opacity="0.16" stroke="#d23f3f" stroke-width="1.25"/><g fill="none" stroke="#d23f3f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M574 200l12 12M586 200l-12 12"/></g><text x="602" y="203" font-size="13" fill="#1d1f22" font-weight="600">Gives up</text><text x="602" y="220" font-size="11.5" fill="#5c6168">past its timeout</text><rect x="24" y="258" width="712" height="34" rx="8" fill="#efede7"/><g fill="none" stroke="#5c6168" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M44 267l7 3v5c0 4 -3 7 -7 8c-4 -1 -7 -4 -7 -8v-5z"/></g><text x="62" y="279.5" font-size="11.5" fill="#1d1f22">A query only reads, for at most 30 seconds, and what it returns is never kept or shown.</text></svg>
