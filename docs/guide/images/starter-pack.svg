<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" width="760" height="490" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="What the Starter Pack adds"><title>What the Starter Pack adds</title><defs><marker id="a1c9a3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1c9a3b"/></marker><marker id="ad23f3f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d23f3f"/></marker><marker id="a7b55c7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7b55c7"/></marker></defs><rect x="0" y="0" width="760" height="490" rx="0" fill="#ffffff"/><text x="24" y="34" font-size="16" fill="#1d1f22" font-weight="650">What the Starter Pack adds</text><text x="24" y="55" font-size="12" fill="#5c6168">Example data in a database of its own, files in a folder of its own, and example people where allowed</text><rect x="24" y="76" width="712" height="124" rx="12" fill="#1f3d73" fill-opacity="0.06"/><text x="40" y="95" font-size="10.5" fill="#1f3d73" font-weight="700" letter-spacing="0.08em">KILNMARK'S POSTGRESQL SERVER</text><rect x="40" y="106" width="208" height="56" rx="8" fill="#2f72d8" fill-opacity="0.13" stroke="#2f72d8" stroke-width="2"/><circle cx="66" cy="134" r="13" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><g fill="none" stroke="#2f72d8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="66" cy="129" rx="7" ry="3"/><path d="M59 129v10a7 3 0 0 0 14 0v-10"/><path d="M59 134a7 3 0 0 0 14 0"/></g><text x="88" y="131" font-size="13" fill="#1d1f22" font-weight="600">kilnmark</text><text x="88" y="148" font-size="11.5" fill="#5c6168">Kilnmark's own; backed up</text><rect x="276" y="106" width="208" height="56" rx="8" fill="#e8663d" fill-opacity="0.08" stroke="#e8663d" stroke-width="1.25"/><circle cx="302" cy="134" r="13" fill="#e8663d" fill-opacity="0.16" stroke="#e8663d" stroke-width="1.25"/><g fill="none" stroke="#e8663d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="298" cy="134" r="5"/><path d="M303 134h9M309 134v4M312 134v3"/></g><text x="324" y="131" font-size="13" fill="#1d1f22" font-weight="600">Login kilnmark_samples</text><text x="324" y="148" font-size="11.5" fill="#5c6168">its own password, in .env</text><rect x="512" y="106" width="208" height="56" rx="8" fill="#e8663d" fill-opacity="0.13" stroke="#e8663d" stroke-width="2"/><circle cx="538" cy="134" r="13" fill="#e8663d" fill-opacity="0.16" stroke="#e8663d" stroke-width="1.25"/><g fill="none" stroke="#e8663d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="538" cy="129" rx="7" ry="3"/><path d="M531 129v10a7 3 0 0 0 14 0v-10"/><path d="M531 134a7 3 0 0 0 14 0"/></g><text x="560" y="131" font-size="13" fill="#1d1f22" font-weight="600">kilnmark_samples</text><text x="560" y="148" font-size="11.5" fill="#5c6168">the sample tables only</text><path d="M484 134 L510 134" fill="none" stroke="#1c9a3b" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a1c9a3b)"/><text x="498" y="176" font-size="11.5" fill="#1c9a3b" text-anchor="middle">connects, over TLS</text><path d="M276 134 L250 134" fill="none" stroke="#d23f3f" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#ad23f3f)"/><text x="262" y="176" font-size="11.5" fill="#d23f3f" text-anchor="middle">cannot even connect</text><rect x="24" y="216" width="712" height="96" rx="12" fill="#17a179" fill-opacity="0.06"/><text x="40" y="235" font-size="10.5" fill="#17a179" font-weight="700" letter-spacing="0.08em">THE FILES FOLDER</text><rect x="40" y="246" width="208" height="56" rx="8" fill="#17a179" fill-opacity="0.08" stroke="#17a179" stroke-width="1.25"/><circle cx="66" cy="274" r="13" fill="#17a179" fill-opacity="0.16" stroke="#17a179" stroke-width="1.25"/><g fill="none" stroke="#17a179" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M61 266h6l5 5v11h-11z"/><path d="M67 266v5h5"/></g><text x="88" y="271" font-size="13" fill="#1d1f22" font-weight="600">/srv/files</text><text x="88" y="288" font-size="11.5" fill="#5c6168">a volume, or your own folder</text><rect x="276" y="246" width="444" height="56" rx="8" fill="#17a179" fill-opacity="0.13" stroke="#17a179" stroke-width="2"/><circle cx="302" cy="274" r="13" fill="#17a179" fill-opacity="0.16" stroke="#17a179" stroke-width="1.25"/><g fill="none" stroke="#17a179" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M297 266h6l5 5v11h-11z"/><path d="M303 266v5h5"/></g><text x="324" y="271" font-size="13" fill="#1d1f22" font-weight="600">starter-pack/</text><text x="324" y="288" font-size="11.5" fill="#5c6168">the samples write here, and only here</text><rect x="24" y="328" width="712" height="96" rx="12" fill="#7b55c7" fill-opacity="0.06"/><text x="40" y="347" font-size="10.5" fill="#7b55c7" font-weight="700" letter-spacing="0.08em">KEYCLOAK, WHERE .ENV ALLOWS IT</text><rect x="40" y="358" width="208" height="56" rx="8" fill="#7b55c7" fill-opacity="0.08" stroke="#7b55c7" stroke-width="1.25"/><circle cx="66" cy="386" r="13" fill="#7b55c7" fill-opacity="0.16" stroke="#7b55c7" stroke-width="1.25"/><g fill="none" stroke="#7b55c7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M66 378l7 3v5c0 4 -3 7 -7 8c-4 -1 -7 -4 -7 -8v-5z"/></g><text x="88" y="383" font-size="13" fill="#1d1f22" font-weight="600">kilnmark-starter</text><text x="88" y="400" font-size="11.5" fill="#5c6168">people and groups only</text><rect x="276" y="358" width="444" height="56" rx="8" fill="#7b55c7" fill-opacity="0.13" stroke="#7b55c7" stroke-width="2"/><circle cx="302" cy="386" r="13" fill="#7b55c7" fill-opacity="0.16" stroke="#7b55c7" stroke-width="1.25"/><g fill="none" stroke="#7b55c7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="302" cy="382.5" r="3.5"/><path d="M296 394a6 5 0 0 1 12 0"/></g><text x="324" y="383" font-size="13" fill="#1d1f22" font-weight="600">Five example people</text><text x="324" y="400" font-size="11.5" fill="#5c6168">kilnmark.com, one per role, marked as the pack's</text><path d="M248 386 L274 386" fill="none" stroke="#7b55c7" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a7b55c7)"/><rect x="24" y="440" width="712" height="34" rx="8" fill="#efede7"/><g fill="none" stroke="#5c6168" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="37" y="455" width="14" height="10" rx="2"/><path d="M40 455v-3a4 4 0 0 1 8 0v3"/></g><text x="62" y="461.5" font-size="11.5" fill="#1d1f22">An admin turns it on and off under Settings; a banner shows while it is on. Backups hold kilnmark only.</text></svg>
