<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 476" width="760" height="476" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="From building a pipeline to a finished run"><title>From building a pipeline to a finished run</title><defs><marker id="a17a179" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17a179"/></marker><marker id="a2f72d8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f72d8"/></marker><marker id="a1c9a3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1c9a3b"/></marker><marker id="ad23f3f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d23f3f"/></marker></defs><rect x="0" y="0" width="760" height="476" rx="0" fill="#ffffff"/><text x="24" y="34" font-size="16" fill="#1d1f22" font-weight="650">From building a pipeline to a finished run</text><text x="24" y="55" font-size="12" fill="#5c6168">What happens after Run now, and what you see at each step</text><rect x="24" y="76" width="712" height="96" rx="12" fill="#17a179" fill-opacity="0.06"/><text x="40" y="95" font-size="10.5" fill="#17a179" font-weight="700" letter-spacing="0.08em">BUILD</text><rect x="40" y="106" width="208" height="56" rx="8" fill="#17a179" fill-opacity="0.08" stroke="#17a179" stroke-width="1.25"/><circle cx="64" cy="134" r="10" fill="#17a179" fill-opacity="0.16" stroke="#17a179" stroke-width="1.25"/><text x="64" y="138" font-size="11" fill="#17a179" font-weight="600" text-anchor="middle">1</text><text x="82" y="131" font-size="13" fill="#1d1f22" font-weight="600">Build it</text><text x="82" y="148" font-size="11.5" fill="#5c6168">on the canvas or in YAML</text><rect x="276" y="106" width="208" height="56" rx="8" fill="#17a179" fill-opacity="0.08" stroke="#17a179" stroke-width="1.25"/><circle cx="300" cy="134" r="10" fill="#17a179" fill-opacity="0.16" stroke="#17a179" stroke-width="1.25"/><text x="300" y="138" font-size="11" fill="#17a179" font-weight="600" text-anchor="middle">2</text><text x="318" y="131" font-size="13" fill="#1d1f22" font-weight="600">Checked as you type</text><text x="318" y="148" font-size="11.5" fill="#5c6168">problems listed by line</text><rect x="512" y="106" width="208" height="56" rx="8" fill="#17a179" fill-opacity="0.08" stroke="#17a179" stroke-width="1.25"/><circle cx="536" cy="134" r="10" fill="#17a179" fill-opacity="0.16" stroke="#17a179" stroke-width="1.25"/><text x="536" y="138" font-size="11" fill="#17a179" font-weight="600" text-anchor="middle">3</text><text x="554" y="131" font-size="13" fill="#1d1f22" font-weight="600">Save a version</text><text x="554" y="148" font-size="11.5" fill="#5c6168">a draft if it has problems</text><path d="M248 134 L274 134" fill="none" stroke="#17a179" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a17a179)"/><path d="M484 134 L510 134" fill="none" stroke="#17a179" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a17a179)"/><rect x="24" y="188" width="712" height="96" rx="12" fill="#2f72d8" fill-opacity="0.06"/><text x="40" y="207" font-size="10.5" fill="#2f72d8" font-weight="700" letter-spacing="0.08em">RUN</text><rect x="512" y="218" width="208" height="56" rx="8" fill="#2f72d8" fill-opacity="0.08" stroke="#2f72d8" stroke-width="1.25"/><circle cx="536" cy="246" r="10" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><text x="536" y="250" font-size="11" fill="#2f72d8" font-weight="600" text-anchor="middle">4</text><text x="554" y="243" font-size="13" fill="#1d1f22" font-weight="600">Run now</text><text x="554" y="260" font-size="11.5" fill="#5c6168">checked again and queued</text><rect x="276" y="218" width="208" height="56" rx="8" fill="#2f72d8" fill-opacity="0.08" stroke="#2f72d8" stroke-width="1.25"/><circle cx="300" cy="246" r="10" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><text x="300" y="250" font-size="11" fill="#2f72d8" font-weight="600" text-anchor="middle">5</text><text x="318" y="243" font-size="13" fill="#1d1f22" font-weight="600">A worker takes it</text><text x="318" y="260" font-size="11.5" fill="#5c6168">when it has a free slot</text><rect x="40" y="218" width="208" height="56" rx="8" fill="#2f72d8" fill-opacity="0.08" stroke="#2f72d8" stroke-width="1.25"/><circle cx="64" cy="246" r="10" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><text x="64" y="250" font-size="11" fill="#2f72d8" font-weight="600" text-anchor="middle">6</text><text x="82" y="243" font-size="13" fill="#1d1f22" font-weight="600">Writes locked</text><text x="82" y="260" font-size="11.5" fill="#5c6168">no other run writes them</text><path d="M616 162 L616 216" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><path d="M512 246 L486 246" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><path d="M276 246 L250 246" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><rect x="24" y="300" width="712" height="152" rx="12" fill="#5c6168" fill-opacity="0.06"/><text x="40" y="319" font-size="10.5" fill="#5c6168" font-weight="700" letter-spacing="0.08em">FINISH</text><rect x="40" y="358" width="208" height="56" rx="8" fill="#2f72d8" fill-opacity="0.08" stroke="#2f72d8" stroke-width="1.25"/><circle cx="64" cy="386" r="10" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><text x="64" y="390" font-size="11" fill="#2f72d8" font-weight="600" text-anchor="middle">7</text><text x="82" y="383" font-size="13" fill="#1d1f22" font-weight="600">Nodes run</text><text x="82" y="400" font-size="11.5" fill="#5c6168">every row in one pass</text><path d="M144 274 L144 356" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><rect x="306" y="328" width="222" height="56" rx="8" fill="#1c9a3b" fill-opacity="0.13" stroke="#1c9a3b" stroke-width="2"/><circle cx="332" cy="356" r="13" fill="#1c9a3b" fill-opacity="0.16" stroke="#1c9a3b" stroke-width="1.25"/><g fill="none" stroke="#1c9a3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M327 356l4 4l7 -8"/></g><text x="354" y="353" font-size="13" fill="#1d1f22" font-weight="600">Succeeded</text><text x="354" y="370" font-size="11.5" fill="#5c6168">writes commit, then catalogued</text><rect x="306" y="392" width="222" height="56" rx="8" fill="#d23f3f" fill-opacity="0.08" stroke="#d23f3f" stroke-width="1.25"/><circle cx="332" cy="420" r="13" fill="#d23f3f" fill-opacity="0.16" stroke="#d23f3f" stroke-width="1.25"/><g fill="none" stroke="#d23f3f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M326 414l12 12M338 414l-12 12"/></g><text x="354" y="417" font-size="13" fill="#1d1f22" font-weight="600">Failed or cancelled</text><text x="354" y="434" font-size="11.5" fill="#5c6168">the run's page says why</text><path d="M248 378 L282 378 L282 356 L304 356" fill="none" stroke="#1c9a3b" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a1c9a3b)"/><path d="M248 394 L282 394 L282 420 L304 420" fill="none" stroke="#d23f3f" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ad23f3f)"/><text x="582" y="360" font-size="11.5" fill="#5c6168" text-anchor="start">A stop gate, an error or</text><text x="582" y="376" font-size="11.5" fill="#5c6168" text-anchor="start">Cancel run ends a run.</text><text x="582" y="400" font-size="11.5" fill="#5c6168" text-anchor="start">Rows already written</text><text x="582" y="416" font-size="11.5" fill="#5c6168" text-anchor="start">stay written.</text></svg>
