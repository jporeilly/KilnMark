<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 568" width="760" height="568" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="A restore never leaves you without a working database"><title>A restore never leaves you without a working database</title><defs><marker id="a2f72d8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f72d8"/></marker><marker id="ad23f3f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d23f3f"/></marker><marker id="a1f3d73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f3d73"/></marker></defs><rect x="0" y="0" width="760" height="568" rx="0" fill="#ffffff"/><text x="24" y="34" font-size="16" fill="#1d1f22" font-weight="650">A restore never leaves you without a working database</text><text x="24" y="55" font-size="12" fill="#5c6168">What restore.sh does, in order: your old database and keys are kept until you remove them</text><rect x="24" y="72" width="712" height="240" rx="12" fill="#2f72d8" fill-opacity="0.06"/><text x="40" y="91" font-size="10.5" fill="#2f72d8" font-weight="700" letter-spacing="0.08em">WHILE KILNMARK KEEPS RUNNING</text><rect x="40" y="100" width="330" height="56" rx="8" fill="#2f72d8" fill-opacity="0.08" stroke="#2f72d8" stroke-width="1.25"/><circle cx="64" cy="128" r="10" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><text x="64" y="132" font-size="11" fill="#2f72d8" font-weight="600" text-anchor="middle">1</text><text x="82" y="125" font-size="13" fill="#1d1f22" font-weight="600">Files checked</text><text x="82" y="142" font-size="11.5" fill="#5c6168">each against SHA256SUMS</text><rect x="40" y="166" width="330" height="56" rx="8" fill="#2f72d8" fill-opacity="0.08" stroke="#2f72d8" stroke-width="1.25"/><circle cx="64" cy="194" r="10" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><text x="64" y="198" font-size="11" fill="#2f72d8" font-weight="600" text-anchor="middle">2</text><text x="82" y="191" font-size="13" fill="#1d1f22" font-weight="600">Says what it will do</text><text x="82" y="208" font-size="11.5" fill="#5c6168">run it again with --yes</text><rect x="406" y="100" width="330" height="56" rx="8" fill="#2f72d8" fill-opacity="0.08" stroke="#2f72d8" stroke-width="1.25"/><circle cx="430" cy="128" r="10" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><text x="430" y="132" font-size="11" fill="#2f72d8" font-weight="600" text-anchor="middle">3</text><text x="448" y="125" font-size="13" fill="#1d1f22" font-weight="600">Restored into kilnmark_restoring</text><text x="448" y="142" font-size="11.5" fill="#5c6168">a database of its own, beside yours</text><path d="M205 156 L205 164" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><path d="M370 194 L388 194 L388 128 L404 128" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><polygon points="406,226 481,196 556,226 481,256" fill="#efede7" stroke="#b4aea2" stroke-width="1.25"/><text x="481" y="230" font-size="12.5" fill="#1d1f22" font-weight="600" text-anchor="middle">Restored?</text><path d="M481 156 L481 194" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><path d="M556 226 L594 226" fill="none" stroke="#d23f3f" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#ad23f3f)"/><text x="566" y="218" font-size="11.5" fill="#d23f3f" text-anchor="start">no</text><rect x="596" y="200" width="140" height="52" rx="8" fill="#1c9a3b" fill-opacity="0.08" stroke="#1c9a3b" stroke-width="1.25"/><text x="610" y="223" font-size="13" fill="#1d1f22" font-weight="600">Nothing changed</text><text x="610" y="240" font-size="11.5" fill="#5c6168">runs as before</text><path d="M481 256 L481 356" fill="none" stroke="#1f3d73" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a1f3d73)"/><text x="491" y="290" font-size="11.5" fill="#1f3d73" text-anchor="start">yes</text><rect x="24" y="330" width="712" height="172" rx="12" fill="#1f3d73" fill-opacity="0.06"/><text x="40" y="349" font-size="10.5" fill="#1f3d73" font-weight="700" letter-spacing="0.08em">KILNMARK STOPPED FOR THE SWAP</text><rect x="406" y="358" width="330" height="56" rx="8" fill="#1f3d73" fill-opacity="0.08" stroke="#1f3d73" stroke-width="1.25"/><circle cx="430" cy="386" r="10" fill="#1f3d73" fill-opacity="0.16" stroke="#1f3d73" stroke-width="1.25"/><text x="430" y="390" font-size="11" fill="#1f3d73" font-weight="600" text-anchor="middle">4</text><text x="448" y="383" font-size="13" fill="#1d1f22" font-weight="600">Your database kept</text><text x="448" y="400" font-size="11.5" fill="#5c6168">as kilnmark_before_&lt;time&gt;</text><rect x="406" y="424" width="330" height="56" rx="8" fill="#1f3d73" fill-opacity="0.08" stroke="#1f3d73" stroke-width="1.25"/><circle cx="430" cy="452" r="10" fill="#1f3d73" fill-opacity="0.16" stroke="#1f3d73" stroke-width="1.25"/><text x="430" y="456" font-size="11" fill="#1f3d73" font-weight="600" text-anchor="middle">5</text><text x="448" y="449" font-size="13" fill="#1d1f22" font-weight="600">Restored database put in place</text><text x="448" y="466" font-size="11.5" fill="#5c6168">as kilnmark</text><rect x="40" y="358" width="330" height="56" rx="8" fill="#1f3d73" fill-opacity="0.08" stroke="#1f3d73" stroke-width="1.25"/><circle cx="64" cy="386" r="10" fill="#1f3d73" fill-opacity="0.16" stroke="#1f3d73" stroke-width="1.25"/><text x="64" y="390" font-size="11" fill="#1f3d73" font-weight="600" text-anchor="middle">6</text><text x="82" y="383" font-size="13" fill="#1d1f22" font-weight="600">Keys swapped</text><text x="82" y="400" font-size="11.5" fill="#5c6168">the old ones kept in before-restore-&lt;time&gt;</text><rect x="40" y="424" width="330" height="56" rx="8" fill="#1f3d73" fill-opacity="0.08" stroke="#1f3d73" stroke-width="1.25"/><circle cx="64" cy="452" r="10" fill="#1f3d73" fill-opacity="0.16" stroke="#1f3d73" stroke-width="1.25"/><text x="64" y="456" font-size="11" fill="#1f3d73" font-weight="600" text-anchor="middle">7</text><text x="82" y="449" font-size="13" fill="#1d1f22" font-weight="600">Started, and waits until ready</text><text x="82" y="466" font-size="11.5" fill="#5c6168">then the audit log says Database restored</text><path d="M571 414 L571 422" fill="none" stroke="#1f3d73" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a1f3d73)"/><path d="M406 452 L388 452 L388 386 L372 386" fill="none" stroke="#1f3d73" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a1f3d73)"/><path d="M205 414 L205 422" fill="none" stroke="#1f3d73" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a1f3d73)"/><rect x="24" y="518" width="712" height="34" rx="8" fill="#efede7"/><g fill="none" stroke="#5c6168" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M44 527l7 3v5c0 4 -3 7 -7 8c-4 -1 -7 -4 -7 -8v-5z"/></g><text x="62" y="539.5" font-size="11.5" fill="#1d1f22">Afterwards, redo security changes made since the backup: revoked tokens work again.</text></svg>
