<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 302" width="760" height="302" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Every security-relevant change is recorded twice"><title>Every security-relevant change is recorded twice</title><defs><marker id="a1f3d73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f3d73"/></marker><marker id="a2f72d8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f72d8"/></marker><marker id="a7b55c7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7b55c7"/></marker></defs><rect x="0" y="0" width="760" height="302" rx="0" fill="#ffffff"/><text x="24" y="34" font-size="16" fill="#1d1f22" font-weight="650">Every security-relevant change is recorded twice</text><text x="24" y="55" font-size="12" fill="#5c6168">Once in Kilnmark, where it cannot be changed, and once for your SIEM</text><rect x="24" y="92" width="230" height="56" rx="8" fill="#1f3d73" fill-opacity="0.08" stroke="#1f3d73" stroke-width="1.25"/><circle cx="50" cy="120" r="13" fill="#1f3d73" fill-opacity="0.16" stroke="#1f3d73" stroke-width="1.25"/><g fill="none" stroke="#1f3d73" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M50 112l7 3v5c0 4 -3 7 -7 8c-4 -1 -7 -4 -7 -8v-5z"/></g><text x="72" y="117" font-size="13" fill="#1d1f22" font-weight="600">A security-relevant change</text><text x="72" y="134" font-size="11.5" fill="#5c6168">sign-in, token, source, grant…</text><path d="M254 120 L286 120 L286 104 L318 104" fill="none" stroke="#1f3d73" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a1f3d73)"/><path d="M254 120 L286 120 L286 200 L318 200" fill="none" stroke="#1f3d73" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a1f3d73)"/><rect x="320" y="76" width="210" height="56" rx="8" fill="#2f72d8" fill-opacity="0.13" stroke="#2f72d8" stroke-width="2"/><circle cx="346" cy="104" r="13" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><g fill="none" stroke="#2f72d8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="346" cy="99" rx="7" ry="3"/><path d="M339 99v10a7 3 0 0 0 14 0v-10"/><path d="M339 104a7 3 0 0 0 14 0"/></g><text x="368" y="101" font-size="13" fill="#1d1f22" font-weight="600">The audit log</text><text x="368" y="118" font-size="11.5" fill="#5c6168">rows only ever added</text><rect x="320" y="172" width="210" height="56" rx="8" fill="#7b55c7" fill-opacity="0.08" stroke="#7b55c7" stroke-width="1.25"/><circle cx="346" cy="200" r="13" fill="#7b55c7" fill-opacity="0.16" stroke="#7b55c7" stroke-width="1.25"/><g fill="none" stroke="#7b55c7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M340 195h12M340 200h12M340 205h8"/></g><text x="368" y="197" font-size="13" fill="#1d1f22" font-weight="600">A JSON line</text><text x="368" y="214" font-size="11.5" fill="#5c6168">log category kilnmark.audit</text><path d="M530 104 L566 104" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><path d="M530 200 L566 200" fill="none" stroke="#7b55c7" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a7b55c7)"/><rect x="568" y="76" width="168" height="56" rx="8" fill="#2f72d8" fill-opacity="0.08" stroke="#2f72d8" stroke-width="1.25"/><circle cx="594" cy="104" r="13" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><g fill="none" stroke="#2f72d8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="594" cy="104" r="3"/><circle cx="594" cy="104" r="7" stroke-dasharray="3 2.5"/></g><text x="616" y="101" font-size="13" fill="#1d1f22" font-weight="600">Audit log page</text><text x="616" y="118" font-size="11.5" fill="#5c6168">Settings, for admins</text><rect x="568" y="172" width="168" height="56" rx="8" fill="#7b55c7" fill-opacity="0.08" stroke="#7b55c7" stroke-width="1.25"/><circle cx="594" cy="200" r="13" fill="#7b55c7" fill-opacity="0.16" stroke="#7b55c7" stroke-width="1.25"/><g fill="none" stroke="#7b55c7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M594 192l7 3v5c0 4 -3 7 -7 8c-4 -1 -7 -4 -7 -8v-5z"/></g><text x="616" y="197" font-size="13" fill="#1d1f22" font-weight="600">Your SIEM</text><text x="616" y="214" font-size="11.5" fill="#5c6168">syslog or container logs</text><rect x="24" y="252" width="712" height="34" rx="8" fill="#efede7"/><g fill="none" stroke="#5c6168" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="37" y="267" width="14" height="10" rx="2"/><path d="M40 267v-3a4 4 0 0 1 8 0v3"/></g><text x="62" y="273.5" font-size="11.5" fill="#1d1f22">No one can change or delete an event, not even an admin: the database refuses it.</text></svg>
