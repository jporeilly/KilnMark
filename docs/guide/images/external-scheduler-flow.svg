<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 486" width="760" height="486" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="A scheduler job that waits for the run to end"><title>A scheduler job that waits for the run to end</title><defs><marker id="ae8663d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e8663d"/></marker><marker id="a7b55c7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7b55c7"/></marker><marker id="a2f72d8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f72d8"/></marker></defs><rect x="0" y="0" width="760" height="486" rx="0" fill="#ffffff"/><text x="24" y="34" font-size="16" fill="#1d1f22" font-weight="650">A scheduler job that waits for the run to end</text><text x="24" y="55" font-size="12" fill="#5c6168">kilnmark-run starts the run, waits in steps the server allows, and exits with what happened</text><rect x="24" y="76" width="712" height="96" rx="12" fill="#e8663d" fill-opacity="0.06"/><text x="40" y="95" font-size="10.5" fill="#e8663d" font-weight="700" letter-spacing="0.08em">YOUR SCHEDULER</text><rect x="40" y="106" width="208" height="56" rx="8" fill="#e8663d" fill-opacity="0.08" stroke="#e8663d" stroke-width="1.25"/><circle cx="66" cy="134" r="13" fill="#e8663d" fill-opacity="0.16" stroke="#e8663d" stroke-width="1.25"/><g fill="none" stroke="#e8663d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="66" cy="134" r="7"/><path d="M66 130v4l3 2"/></g><text x="88" y="131" font-size="13" fill="#1d1f22" font-weight="600">The job starts</text><text x="88" y="148" font-size="11.5" fill="#5c6168">Control-M, AutoSys, cron…</text><rect x="512" y="106" width="208" height="56" rx="8" fill="#e8663d" fill-opacity="0.13" stroke="#e8663d" stroke-width="2"/><circle cx="538" cy="134" r="13" fill="#e8663d" fill-opacity="0.16" stroke="#e8663d" stroke-width="1.25"/><g fill="none" stroke="#e8663d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M533 134l4 4l7 -8"/></g><text x="560" y="131" font-size="13" fill="#1d1f22" font-weight="600">Acts on the exit code</text><text x="560" y="148" font-size="11.5" fill="#5c6168">go on, alert, or retry</text><path d="M144 162 L144 228" fill="none" stroke="#e8663d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ae8663d)"/><text x="152" y="182" font-size="11.5" fill="#e8663d" text-anchor="start">kilnmark-run pipeline daily-load</text><rect x="24" y="200" width="712" height="96" rx="12" fill="#7b55c7" fill-opacity="0.06"/><text x="40" y="219" font-size="10.5" fill="#7b55c7" font-weight="700" letter-spacing="0.08em">KILNMARK-RUN</text><rect x="40" y="230" width="208" height="56" rx="8" fill="#7b55c7" fill-opacity="0.08" stroke="#7b55c7" stroke-width="1.25"/><circle cx="64" cy="258" r="10" fill="#7b55c7" fill-opacity="0.16" stroke="#7b55c7" stroke-width="1.25"/><text x="64" y="262" font-size="11" fill="#7b55c7" font-weight="600" text-anchor="middle">1</text><text x="82" y="255" font-size="13" fill="#1d1f22" font-weight="600">Start, with a request key</text><text x="82" y="272" font-size="11.5" fill="#5c6168">and wait up to 15 minutes</text><rect x="276" y="230" width="208" height="56" rx="8" fill="#7b55c7" fill-opacity="0.08" stroke="#7b55c7" stroke-width="1.25"/><circle cx="300" cy="258" r="10" fill="#7b55c7" fill-opacity="0.16" stroke="#7b55c7" stroke-width="1.25"/><text x="300" y="262" font-size="11" fill="#7b55c7" font-weight="600" text-anchor="middle">2</text><text x="318" y="255" font-size="13" fill="#1d1f22" font-weight="600">Wait again</text><text x="318" y="272" font-size="11.5" fill="#5c6168">as often as it takes</text><rect x="512" y="230" width="208" height="56" rx="8" fill="#7b55c7" fill-opacity="0.08" stroke="#7b55c7" stroke-width="1.25"/><circle cx="536" cy="258" r="10" fill="#7b55c7" fill-opacity="0.16" stroke="#7b55c7" stroke-width="1.25"/><text x="536" y="262" font-size="11" fill="#7b55c7" font-weight="600" text-anchor="middle">3</text><text x="554" y="255" font-size="13" fill="#1d1f22" font-weight="600">Exit with a code</text><text x="554" y="272" font-size="11.5" fill="#5c6168">0 succeeded … 5 unreachable</text><path d="M248 258 L274 258" fill="none" stroke="#7b55c7" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a7b55c7)"/><text x="262" y="250" font-size="11.5" fill="#7b55c7" text-anchor="middle">202</text><path d="M484 258 L510 258" fill="none" stroke="#7b55c7" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a7b55c7)"/><text x="498" y="250" font-size="11.5" fill="#7b55c7" text-anchor="middle">200</text><path d="M616 228 L616 164" fill="none" stroke="#7b55c7" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a7b55c7)"/><path d="M144 286 L144 352" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><text x="152" y="306" font-size="11.5" fill="#2f72d8" text-anchor="start">POST …/runs?wait=900</text><path d="M380 286 L380 352" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><text x="388" y="306" font-size="11.5" fill="#2f72d8" text-anchor="start">GET …/pipeline-runs/42?wait=900</text><rect x="24" y="324" width="712" height="96" rx="12" fill="#2f72d8" fill-opacity="0.06"/><text x="40" y="343" font-size="10.5" fill="#2f72d8" font-weight="700" letter-spacing="0.08em">KILNMARK</text><rect x="40" y="354" width="444" height="56" rx="8" fill="#2f72d8" fill-opacity="0.13" stroke="#2f72d8" stroke-width="2"/><circle cx="66" cy="382" r="13" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><g fill="none" stroke="#2f72d8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M62 376l10 6l-10 6z"/></g><text x="88" y="379" font-size="13" fill="#1d1f22" font-weight="600">Queues the run once per key, then answers</text><text x="88" y="396" font-size="11.5" fill="#5c6168">when the run ends (200), or when the wait is up and it is still going (202)</text><rect x="512" y="354" width="208" height="56" rx="8" fill="#2f72d8" fill-opacity="0.08" stroke="#2f72d8" stroke-width="1.25"/><circle cx="538" cy="382" r="13" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><g fill="none" stroke="#2f72d8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M530 382q8 -8 16 0q-8 8 -16 0"/><circle cx="538" cy="382" r="2.5"/></g><text x="560" y="379" font-size="13" fill="#1d1f22" font-weight="600">The run's page</text><text x="560" y="396" font-size="11.5" fill="#5c6168">#/pipeline-runs/42</text><rect x="24" y="436" width="712" height="34" rx="8" fill="#efede7"/><g fill="none" stroke="#5c6168" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="37" y="451" width="14" height="10" rx="2"/><path d="M40 451v-3a4 4 0 0 1 8 0v3"/></g><text x="62" y="457.5" font-size="11.5" fill="#1d1f22">The API token is read from a file: never on the command line, in the environment or in the job's log.</text></svg>
