<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 302" width="760" height="302" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="No one person can give access to sensitive values"><title>No one person can give access to sensitive values</title><defs><marker id="ab4aea2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b4aea2"/></marker></defs><rect x="0" y="0" width="760" height="302" rx="0" fill="#ffffff"/><text x="24" y="34" font-size="16" fill="#1d1f22" font-weight="650">No one person can give access to sensitive values</text><text x="24" y="55" font-size="12" fill="#5c6168">With KILNMARK_UNMASK_APPROVAL on: both people sign in with your identity provider</text><rect x="24" y="80" width="160" height="56" rx="8" fill="#17a179" fill-opacity="0.08" stroke="#17a179" stroke-width="1.25"/><circle cx="50" cy="108" r="13" fill="#17a179" fill-opacity="0.16" stroke="#17a179" stroke-width="1.25"/><g fill="none" stroke="#17a179" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="104.5" r="3.5"/><path d="M44 116a6 5 0 0 1 12 0"/></g><text x="72" y="105" font-size="13" fill="#1d1f22" font-weight="600">Alice asks</text><text x="72" y="122" font-size="11.5" fill="#5c6168">via your provider</text><rect x="208" y="80" width="196" height="56" rx="8" fill="#efede7" fill-opacity="1" stroke="#b4aea2" stroke-width="1.25"/><circle cx="234" cy="108" r="13" fill="#5c6168" fill-opacity="0.16" stroke="#5c6168" stroke-width="1.25"/><g fill="none" stroke="#5c6168" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="227" y="106" width="14" height="10" rx="2"/><path d="M230 106v-3a4 4 0 0 1 8 0v3"/></g><text x="256" y="105" font-size="13" fill="#1d1f22" font-weight="600">Designer token made</text><text x="256" y="122" font-size="11.5" fill="#5c6168">values masked meanwhile</text><rect x="428" y="80" width="168" height="56" rx="8" fill="#d24578" fill-opacity="0.08" stroke="#d24578" stroke-width="1.25"/><circle cx="454" cy="108" r="13" fill="#d24578" fill-opacity="0.16" stroke="#d24578" stroke-width="1.25"/><g fill="none" stroke="#d24578" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="454" cy="104.5" r="3.5"/><path d="M448 116a6 5 0 0 1 12 0"/></g><text x="476" y="105" font-size="13" fill="#1d1f22" font-weight="600">Bob approves</text><text x="476" y="122" font-size="11.5" fill="#5c6168">a different person</text><rect x="620" y="80" width="116" height="56" rx="8" fill="#2f72d8" fill-opacity="0.13" stroke="#2f72d8" stroke-width="2"/><circle cx="646" cy="108" r="13" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><g fill="none" stroke="#2f72d8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M638 108q8 -8 16 0q-8 8 -16 0"/><circle cx="646" cy="108" r="2.5"/></g><text x="668" y="112.5" font-size="13" fill="#1d1f22" font-weight="600">Unmasked</text><path d="M184 108 L206 108" fill="none" stroke="#b4aea2" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ab4aea2)"/><path d="M404 108 L426 108" fill="none" stroke="#b4aea2" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ab4aea2)"/><path d="M596 108 L618 108" fill="none" stroke="#b4aea2" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ab4aea2)"/><path d="M512 136V180" fill="none" stroke="#d23f3f" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="324" y="180" width="376" height="52" rx="8" fill="#d23f3f" fill-opacity="0.07" stroke="#d23f3f" stroke-width="1.25"/><g fill="none" stroke="#d23f3f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M342 200l12 12M354 200l-12 12"/></g><text x="524" y="202" font-size="13" fill="#1d1f22" font-weight="600" text-anchor="middle">Cannot take Bob's place</text><text x="524" y="220" font-size="11.5" fill="#5c6168" text-anchor="middle">Alice herself, under any name · any API token</text><rect x="24" y="252" width="712" height="34" rx="8" fill="#efede7"/><g fill="none" stroke="#5c6168" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M38 264h12M38 269h12M38 274h8"/></g><text x="62" y="273.5" font-size="11.5" fill="#1d1f22">Each step is in the audit log; the access review shows who approved each grant.</text></svg>
