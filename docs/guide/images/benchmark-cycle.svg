<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 486" width="760" height="486" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="A benchmark's cycle"><title>A benchmark's cycle</title><defs><marker id="a2f72d8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f72d8"/></marker><marker id="ae8663d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e8663d"/></marker></defs><rect x="0" y="0" width="760" height="486" rx="0" fill="#ffffff"/><text x="24" y="34" font-size="16" fill="#1d1f22" font-weight="650">A benchmark's cycle</text><text x="24" y="55" font-size="12" fill="#5c6168">Generate once, warm up, run five times, measure each run, compare, report every run</text><rect x="24" y="76" width="712" height="96" rx="12" fill="#2f72d8" fill-opacity="0.06"/><text x="40" y="95" font-size="10.5" fill="#2f72d8" font-weight="700" letter-spacing="0.08em">EACH BENCHMARK</text><rect x="40" y="106" width="208" height="56" rx="8" fill="#2f72d8" fill-opacity="0.08" stroke="#2f72d8" stroke-width="1.25"/><circle cx="64" cy="134" r="10" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><text x="64" y="138" font-size="11" fill="#2f72d8" font-weight="600" text-anchor="middle">1</text><text x="82" y="131" font-size="13" fill="#1d1f22" font-weight="600">Generate the data</text><text x="82" y="148" font-size="11.5" fill="#5c6168">once, at a fixed size</text><rect x="276" y="106" width="208" height="56" rx="8" fill="#2f72d8" fill-opacity="0.08" stroke="#2f72d8" stroke-width="1.25"/><circle cx="300" cy="134" r="10" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><text x="300" y="138" font-size="11" fill="#2f72d8" font-weight="600" text-anchor="middle">2</text><text x="318" y="131" font-size="13" fill="#1d1f22" font-weight="600">Warm up</text><text x="318" y="148" font-size="11.5" fill="#5c6168">one run, thrown away</text><rect x="512" y="106" width="208" height="56" rx="8" fill="#2f72d8" fill-opacity="0.08" stroke="#2f72d8" stroke-width="1.25"/><circle cx="536" cy="134" r="10" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><text x="536" y="138" font-size="11" fill="#2f72d8" font-weight="600" text-anchor="middle">3</text><text x="554" y="131" font-size="13" fill="#1d1f22" font-weight="600">Run it five times</text><text x="554" y="148" font-size="11.5" fill="#5c6168">nothing else running</text><path d="M248 134 L274 134" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><path d="M484 134 L510 134" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><path d="M616 162 L616 184 L210 184 L210 228" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><rect x="24" y="200" width="712" height="96" rx="12" fill="#e8663d" fill-opacity="0.06"/><text x="40" y="219" font-size="10.5" fill="#e8663d" font-weight="700" letter-spacing="0.08em">EVERY RUN</text><rect x="40" y="230" width="208" height="56" rx="8" fill="#e8663d" fill-opacity="0.08" stroke="#e8663d" stroke-width="1.25"/><circle cx="64" cy="258" r="10" fill="#e8663d" fill-opacity="0.16" stroke="#e8663d" stroke-width="1.25"/><text x="64" y="262" font-size="11" fill="#e8663d" font-weight="600" text-anchor="middle">4</text><text x="82" y="255" font-size="13" fill="#1d1f22" font-weight="600">Measure</text><text x="82" y="272" font-size="11.5" fill="#5c6168">rows/s, MB/s, memory, CPU</text><rect x="276" y="230" width="208" height="56" rx="8" fill="#e8663d" fill-opacity="0.08" stroke="#e8663d" stroke-width="1.25"/><circle cx="300" cy="258" r="10" fill="#e8663d" fill-opacity="0.16" stroke="#e8663d" stroke-width="1.25"/><text x="300" y="262" font-size="11" fill="#e8663d" font-weight="600" text-anchor="middle">5</text><text x="318" y="255" font-size="13" fill="#1d1f22" font-weight="600">Compare</text><text x="318" y="272" font-size="11.5" fill="#5c6168">median and slowest run</text><rect x="512" y="230" width="208" height="56" rx="8" fill="#e8663d" fill-opacity="0.13" stroke="#e8663d" stroke-width="2"/><circle cx="536" cy="258" r="10" fill="#e8663d" fill-opacity="0.16" stroke="#e8663d" stroke-width="1.25"/><text x="536" y="262" font-size="11" fill="#e8663d" font-weight="600" text-anchor="middle">6</text><text x="554" y="255" font-size="13" fill="#1d1f22" font-weight="600">Report</text><text x="554" y="272" font-size="11.5" fill="#5c6168">CSV, chart and the setup</text><path d="M248 258 L274 258" fill="none" stroke="#e8663d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ae8663d)"/><path d="M484 258 L510 258" fill="none" stroke="#e8663d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ae8663d)"/><path d="M380 286 L380 352" fill="none" stroke="#e8663d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ae8663d)"/><text x="388" y="306" font-size="11.5" fill="#e8663d" text-anchor="start">with</text><rect x="24" y="324" width="712" height="96" rx="12" fill="#17a179" fill-opacity="0.06"/><text x="40" y="343" font-size="10.5" fill="#17a179" font-weight="700" letter-spacing="0.08em">COMPARED WITH</text><rect x="40" y="354" width="208" height="56" rx="8" fill="#17a179" fill-opacity="0.08" stroke="#17a179" stroke-width="1.25"/><circle cx="66" cy="382" r="13" fill="#17a179" fill-opacity="0.16" stroke="#17a179" stroke-width="1.25"/><g fill="none" stroke="#17a179" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="66" cy="377" rx="7" ry="3"/><path d="M59 377v10a7 3 0 0 0 14 0v-10"/><path d="M59 382a7 3 0 0 0 14 0"/></g><text x="88" y="379" font-size="13" fill="#1d1f22" font-weight="600">The ceiling</text><text x="88" y="396" font-size="11.5" fill="#5c6168">the database's bulk tools</text><rect x="276" y="354" width="208" height="56" rx="8" fill="#17a179" fill-opacity="0.08" stroke="#17a179" stroke-width="1.25"/><circle cx="302" cy="382" r="13" fill="#17a179" fill-opacity="0.16" stroke="#17a179" stroke-width="1.25"/><g fill="none" stroke="#17a179" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="302" cy="382" r="7"/><path d="M302 378v4l3 2"/></g><text x="324" y="379" font-size="13" fill="#1d1f22" font-weight="600">The last release</text><text x="324" y="396" font-size="11.5" fill="#5c6168">15% slower fails</text><rect x="512" y="354" width="208" height="56" rx="8" fill="#17a179" fill-opacity="0.08" stroke="#17a179" stroke-width="1.25"/><circle cx="538" cy="382" r="13" fill="#17a179" fill-opacity="0.16" stroke="#17a179" stroke-width="1.25"/><g fill="none" stroke="#17a179" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M538 377c-2 -2 -6 -2 -8 -1v12c2 -1 6 -1 8 1c2 -2 6 -2 8 -1v-12c-2 -1 -6 -1 -8 1z"/><path d="M538 377v12"/></g><text x="560" y="379" font-size="13" fill="#1d1f22" font-weight="600">Today's tool</text><text x="560" y="396" font-size="11.5" fill="#5c6168">same data, built well</text><rect x="24" y="436" width="712" height="34" rx="8" fill="#efede7"/><g fill="none" stroke="#5c6168" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M39 453l4 4l7 -8"/></g><text x="62" y="457.5" font-size="11.5" fill="#1d1f22">A run that writes the wrong number of rows has failed, however fast it was.</text></svg>
