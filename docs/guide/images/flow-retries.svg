<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 376" width="760" height="376" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="How a node is tried again"><title>How a node is tried again</title><defs><marker id="a2f72d8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f72d8"/></marker><marker id="a1c9a3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1c9a3b"/></marker><marker id="ad23f3f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d23f3f"/></marker><marker id="a8a8f96" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8f96"/></marker></defs><rect x="0" y="0" width="760" height="376" rx="0" fill="#ffffff"/><text x="24" y="34" font-size="16" fill="#1d1f22" font-weight="650">How a node is tried again</text><text x="24" y="55" font-size="12" fill="#5c6168">With retries: 2 and retry_delay: 1m, it has three tries, waiting 1m, then 2m, between them</text><g transform="translate(0 46)"><rect x="40" y="70" width="190" height="56" rx="8" fill="#2f72d8" fill-opacity="0.08" stroke="#2f72d8" stroke-width="1.25"/><circle cx="66" cy="98" r="13" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><g fill="none" stroke="#2f72d8" stroke-width="1.8" stroke-linejoin="round"><path d="M62 92L72 98L62 104z"/></g><text x="88" y="95" font-size="13" fill="#1d1f22" font-weight="600">Try</text><text x="88" y="112" font-size="11.5" fill="#5c6168">a pipeline run of its own</text><path d="M230 98 L298 98" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><polygon points="300,98 375,66 450,98 375,130" fill="#efede7" stroke="#b4aea2" stroke-width="1.25"/><text x="375" y="102" font-size="12.5" fill="#1d1f22" font-weight="600" text-anchor="middle">How did it end?</text><path d="M450 98 L552 98" fill="none" stroke="#1c9a3b" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a1c9a3b)"/><text x="501" y="90" font-size="11.5" fill="#1c9a3b" text-anchor="middle">succeeded</text><rect x="554" y="70" width="182" height="56" rx="8" fill="#1c9a3b" fill-opacity="0.13" stroke="#1c9a3b" stroke-width="2"/><circle cx="580" cy="98" r="13" fill="#1c9a3b" fill-opacity="0.16" stroke="#1c9a3b" stroke-width="1.25"/><g fill="none" stroke="#1c9a3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M575 98l4 4l7 -8"/></g><text x="602" y="95" font-size="13" fill="#1d1f22" font-weight="600">Succeeds</text><text x="602" y="112" font-size="11.5" fill="#5c6168">at try 2 of 3, say</text><path d="M375 66 L375 40 L552 40" fill="none" stroke="#8a8f96" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a8a8f96)"/><text x="470" y="34" font-size="11.5" fill="#8a8f96" text-anchor="middle">cancelled by a person or the flow</text><text x="560" y="44" font-size="12" fill="#1d1f22" font-weight="600">Cancelled: never tried again</text><path d="M375 130 L375 168" fill="none" stroke="#d23f3f" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ad23f3f)"/><text x="385" y="154" font-size="11.5" fill="#d23f3f" text-anchor="start">failed or timed out</text><polygon points="280,202 375,170 470,202 375,234" fill="#efede7" stroke="#b4aea2" stroke-width="1.25"/><text x="375" y="206" font-size="12.5" fill="#1d1f22" font-weight="600" text-anchor="middle">Tries left, and safe?</text><path d="M470 202 L552 202" fill="none" stroke="#d23f3f" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#ad23f3f)"/><text x="511" y="194" font-size="11.5" fill="#d23f3f" text-anchor="middle">no</text><rect x="554" y="174" width="182" height="56" rx="8" fill="#d23f3f" fill-opacity="0.08" stroke="#d23f3f" stroke-width="1.25"/><circle cx="580" cy="202" r="13" fill="#d23f3f" fill-opacity="0.16" stroke="#d23f3f" stroke-width="1.25"/><g fill="none" stroke="#d23f3f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M574 196l12 12M586 196l-12 12"/></g><text x="602" y="199" font-size="13" fill="#1d1f22" font-weight="600">Fails</text><text x="602" y="216" font-size="11.5" fill="#5c6168">"after 3 tries"</text><path d="M280 202 L232 202" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><text x="256" y="194" font-size="11.5" fill="#2f72d8" text-anchor="middle">yes</text><rect x="40" y="174" width="190" height="56" rx="8" fill="#2f72d8" fill-opacity="0.08" stroke="#2f72d8" stroke-width="1.25"/><circle cx="66" cy="202" r="13" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><g fill="none" stroke="#2f72d8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="66" cy="202" r="7"/><path d="M66 198v4l3 2"/></g><text x="88" y="199" font-size="13" fill="#1d1f22" font-weight="600">Wait retry_delay</text><text x="88" y="216" font-size="11.5" fill="#5c6168">doubled before each try</text><path d="M135 174 L135 128" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><text x="145" y="156" font-size="11.5" fill="#2f72d8" text-anchor="start">next try</text><rect x="24" y="252" width="712" height="60" rx="8" fill="#efede7"/><g fill="none" stroke="#5c6168" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M44 263l7 3v5c0 4 -3 7 -7 8c-4 -1 -7 -4 -7 -8v-5z"/></g><text x="62" y="275" font-size="11.5" fill="#1d1f22">Safe: a sql node whose statements failed, as they were rolled back. A pipeline only if its writes replace or upsert,</text><text x="62" y="293" font-size="11.5" fill="#1d1f22">so writing again gives the same rows. A sql commit that failed is not: it may have committed.</text></g></svg>