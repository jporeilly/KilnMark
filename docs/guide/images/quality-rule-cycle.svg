<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 398" width="760" height="398" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="A rule runs after every scan and says what failed"><title>A rule runs after every scan and says what failed</title><defs><marker id="a17a179" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17a179"/></marker><marker id="a2f72d8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f72d8"/></marker><marker id="a1c9a3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1c9a3b"/></marker><marker id="ad23f3f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d23f3f"/></marker></defs><rect x="0" y="0" width="760" height="398" rx="0" fill="#ffffff"/><text x="24" y="34" font-size="16" fill="#1d1f22" font-weight="650">A rule runs after every scan and says what failed</text><text x="24" y="55" font-size="12" fill="#5c6168">From a suggestion to a result, and what a failure sets off</text><rect x="24" y="84" width="220" height="56" rx="8" fill="#17a179" fill-opacity="0.08" stroke="#17a179" stroke-width="1.25"/><circle cx="48" cy="112" r="10" fill="#17a179" fill-opacity="0.16" stroke="#17a179" stroke-width="1.25"/><text x="48" y="116" font-size="11" fill="#17a179" font-weight="600" text-anchor="middle">1</text><text x="66" y="109" font-size="13" fill="#1d1f22" font-weight="600">Suggested, or written</text><text x="66" y="126" font-size="11.5" fill="#5c6168">from the profile, or by you</text><rect x="270" y="84" width="220" height="56" rx="8" fill="#17a179" fill-opacity="0.08" stroke="#17a179" stroke-width="1.25"/><circle cx="294" cy="112" r="10" fill="#17a179" fill-opacity="0.16" stroke="#17a179" stroke-width="1.25"/><text x="294" y="116" font-size="11" fill="#17a179" font-weight="600" text-anchor="middle">2</text><text x="312" y="109" font-size="13" fill="#1d1f22" font-weight="600">Tried before saving</text><text x="312" y="126" font-size="11.5" fill="#5c6168">see the failing rows</text><rect x="516" y="84" width="220" height="56" rx="8" fill="#17a179" fill-opacity="0.08" stroke="#17a179" stroke-width="1.25"/><circle cx="540" cy="112" r="10" fill="#17a179" fill-opacity="0.16" stroke="#17a179" stroke-width="1.25"/><text x="540" y="116" font-size="11" fill="#17a179" font-weight="600" text-anchor="middle">3</text><text x="558" y="109" font-size="13" fill="#1d1f22" font-weight="600">Saved, with thresholds</text><text x="558" y="126" font-size="11.5" fill="#5c6168">Warn above, Fail above</text><path d="M244 112 L268 112" fill="none" stroke="#17a179" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a17a179)"/><path d="M490 112 L514 112" fill="none" stroke="#17a179" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a17a179)"/><path d="M626 140 L626 172" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><rect x="458" y="174" width="278" height="56" rx="8" fill="#2f72d8" fill-opacity="0.13" stroke="#2f72d8" stroke-width="2"/><circle cx="484" cy="202" r="13" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><g fill="none" stroke="#2f72d8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M480 196l10 6l-10 6z"/></g><text x="506" y="199" font-size="13" fill="#1d1f22" font-weight="600">Runs after every scan</text><text x="506" y="216" font-size="11.5" fill="#5c6168">or with Run rules now</text><path d="M458 202 L424 202" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><polygon points="292,202 358,170 424,202 358,234" fill="#efede7" stroke="#b4aea2" stroke-width="1.25"/><text x="358" y="206" font-size="12.5" fill="#1d1f22" font-weight="600" text-anchor="middle">Result</text><path d="M292 202 L246 202" fill="none" stroke="#1c9a3b" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a1c9a3b)"/><text x="280" y="192" font-size="11.5" fill="#1c9a3b" text-anchor="end">Pass</text><rect x="24" y="174" width="220" height="56" rx="8" fill="#1c9a3b" fill-opacity="0.08" stroke="#1c9a3b" stroke-width="1.25"/><circle cx="50" cy="202" r="13" fill="#1c9a3b" fill-opacity="0.16" stroke="#1c9a3b" stroke-width="1.25"/><g fill="none" stroke="#1c9a3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M45 202l4 4l7 -8"/></g><text x="72" y="199" font-size="13" fill="#1d1f22" font-weight="600">Sets the score</text><text x="72" y="216" font-size="11.5" fill="#5c6168">share of rows that passed</text><path d="M358 234 L358 270" fill="none" stroke="#d23f3f" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#ad23f3f)"/><text x="368" y="258" font-size="11.5" fill="#d23f3f" text-anchor="start">Warning, Fail or Could not run</text><rect x="176" y="272" width="364" height="56" rx="8" fill="#d23f3f" fill-opacity="0.08" stroke="#d23f3f" stroke-width="1.25"/><circle cx="202" cy="300" r="13" fill="#d23f3f" fill-opacity="0.16" stroke="#d23f3f" stroke-width="1.25"/><g fill="none" stroke="#d23f3f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M196 304v-4a6 6 0 0 1 12 0v4l2 2h-16z"/><path d="M200 308a2 2 0 0 0 4 0"/></g><text x="224" y="297" font-size="13" fill="#1d1f22" font-weight="600">A task, a notification, a webhook</text><text x="224" y="314" font-size="11.5" fill="#5c6168">the task closes by itself once the rule passes</text><rect x="24" y="348" width="712" height="34" rx="8" fill="#efede7"/><g fill="none" stroke="#5c6168" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M38 360h12M38 365h12M38 370h8"/></g><text x="62" y="369.5" font-size="11.5" fill="#1d1f22">Each result keeps its failing-row count; database rules give the query for the failing rows.</text></svg>
