<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 328" width="760" height="328" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="The Ask panel sends your question and the guides, never your data"><title>The Ask panel sends your question and the guides, never your data</title><defs><marker id="a7b55c7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7b55c7"/></marker><marker id="a5c6168" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5c6168"/></marker></defs><rect x="0" y="0" width="760" height="328" rx="0" fill="#ffffff"/><text x="24" y="34" font-size="16" fill="#1d1f22" font-weight="650">The Ask panel sends your question and the guides, never your data</text><text x="24" y="55" font-size="12" fill="#5c6168">What leaves Kilnmark when you ask a question</text><rect x="24" y="80" width="210" height="56" rx="8" fill="#7b55c7" fill-opacity="0.08" stroke="#7b55c7" stroke-width="1.25"/><circle cx="50" cy="108" r="13" fill="#7b55c7" fill-opacity="0.16" stroke="#7b55c7" stroke-width="1.25"/><g fill="none" stroke="#7b55c7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M42 102h16v10h-9l-4 4v-4h-3z"/></g><text x="72" y="105" font-size="13" fill="#1d1f22" font-weight="600">Your question</text><text x="72" y="122" font-size="11.5" fill="#5c6168">and the page you are on</text><path d="M234 108 L266 108" fill="none" stroke="#7b55c7" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a7b55c7)"/><rect x="268" y="80" width="220" height="56" rx="8" fill="#7b55c7" fill-opacity="0.08" stroke="#7b55c7" stroke-width="1.25"/><circle cx="294" cy="108" r="13" fill="#7b55c7" fill-opacity="0.16" stroke="#7b55c7" stroke-width="1.25"/><g fill="none" stroke="#7b55c7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M294 103c-2 -2 -6 -2 -8 -1v12c2 -1 6 -1 8 1c2 -2 6 -2 8 -1v-12c-2 -1 -6 -1 -8 1z"/><path d="M294 103v12"/></g><text x="316" y="105" font-size="13" fill="#1d1f22" font-weight="600">Matching guide sections</text><text x="316" y="122" font-size="11.5" fill="#5c6168">from these guides only</text><path d="M488 108 L520 108" fill="none" stroke="#7b55c7" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a7b55c7)"/><polygon points="522,108 628,72 734,108 628,144" fill="#efede7" stroke="#b4aea2" stroke-width="1.25"/><text x="628" y="104" font-size="12.5" fill="#1d1f22" font-weight="600" text-anchor="middle">Hosted models</text><text x="628" y="120" font-size="12.5" fill="#1d1f22" font-weight="600" text-anchor="middle">allowed?</text><path d="M628 144 L628 176 L500 176 L500 196" fill="none" stroke="#7b55c7" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a7b55c7)"/><text x="636" y="166" font-size="11.5" fill="#7b55c7" text-anchor="start">yes</text><path d="M628 176 L656 176 L656 196" fill="none" stroke="#5c6168" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#a5c6168)"/><rect x="268" y="198" width="292" height="56" rx="8" fill="#7b55c7" fill-opacity="0.13" stroke="#7b55c7" stroke-width="2"/><circle cx="294" cy="226" r="13" fill="#7b55c7" fill-opacity="0.16" stroke="#7b55c7" stroke-width="1.25"/><g fill="none" stroke="#7b55c7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="288" y="220" width="12" height="12" rx="2"/><path d="M291 217v3M297 217v3M291 232v3M297 232v3"/></g><text x="316" y="223" font-size="13" fill="#1d1f22" font-weight="600">A hosted model gets only these</text><text x="316" y="240" font-size="11.5" fill="#5c6168">nothing from your catalogue</text><rect x="576" y="198" width="160" height="56" rx="8" fill="#efede7" fill-opacity="1" stroke="#b4aea2" stroke-width="1.25"/><circle cx="602" cy="226" r="13" fill="#5c6168" fill-opacity="0.16" stroke="#5c6168" stroke-width="1.25"/><g fill="none" stroke="#5c6168" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="596" y="220" width="12" height="12" rx="2"/><path d="M599 217v3M605 217v3M599 232v3M605 232v3"/></g><text x="624" y="223" font-size="13" fill="#1d1f22" font-weight="600">A local model</text><text x="624" y="240" font-size="11.5" fill="#5c6168">or the sections listed</text><text x="664" y="188" font-size="11.5" fill="#5c6168" text-anchor="start">no</text><rect x="24" y="198" width="220" height="56" rx="8" fill="#1c9a3b" fill-opacity="0.08" stroke="#1c9a3b" stroke-width="1.25"/><circle cx="50" cy="226" r="13" fill="#1c9a3b" fill-opacity="0.16" stroke="#1c9a3b" stroke-width="1.25"/><g fill="none" stroke="#1c9a3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M45 226l4 4l7 -8"/></g><text x="72" y="223" font-size="13" fill="#1d1f22" font-weight="600">An answer</text><text x="72" y="240" font-size="11.5" fill="#5c6168">with links to the sections</text><path d="M268 226 L246 226" fill="none" stroke="#7b55c7" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a7b55c7)"/><rect x="24" y="278" width="712" height="34" rx="8" fill="#efede7"/><g fill="none" stroke="#5c6168" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M38 290h12M38 295h12M38 300h8"/></g><text x="62" y="299.5" font-size="11.5" fill="#1d1f22">Every call to a model is recorded under AI usage. Never paste passwords or personal data.</text></svg>
