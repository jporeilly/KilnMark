<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="What deleting a flow does"><title>What deleting a flow does</title><defs></defs><rect x="0" y="0" width="760" height="350" rx="0" fill="#ffffff"/><text x="24" y="34" font-size="16" fill="#1d1f22" font-weight="650">What deleting a flow does</text><text x="24" y="55" font-size="12" fill="#5c6168">Designers and admins delete a flow; what its pipeline runs did stays</text><rect x="24" y="76" width="712" height="96" rx="12" fill="#d23f3f" fill-opacity="0.06"/><text x="40" y="95" font-size="10.5" fill="#d23f3f" font-weight="700" letter-spacing="0.08em">DELETED WITH THE FLOW</text><rect x="40" y="106" width="208" height="56" rx="8" fill="#d23f3f" fill-opacity="0.08" stroke="#d23f3f" stroke-width="1.25" stroke-dasharray="4 3"/><circle cx="66" cy="134" r="13" fill="#d23f3f" fill-opacity="0.16" stroke="#d23f3f" stroke-width="1.25"/><g fill="none" stroke="#d23f3f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M61 126h6l5 5v11h-11z"/><path d="M67 126v5h5"/></g><text x="88" y="131" font-size="13" fill="#1d1f22" font-weight="600">The flow</text><text x="88" y="148" font-size="11.5" fill="#5c6168">and every version of it</text><rect x="276" y="106" width="208" height="56" rx="8" fill="#d23f3f" fill-opacity="0.08" stroke="#d23f3f" stroke-width="1.25" stroke-dasharray="4 3"/><circle cx="302" cy="134" r="13" fill="#d23f3f" fill-opacity="0.16" stroke="#d23f3f" stroke-width="1.25"/><g fill="none" stroke="#d23f3f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M298 128l10 6l-10 6z"/></g><text x="324" y="131" font-size="13" fill="#1d1f22" font-weight="600">Its runs</text><text x="324" y="148" font-size="11.5" fill="#5c6168">with what each node did</text><rect x="512" y="106" width="208" height="56" rx="8" fill="#d23f3f" fill-opacity="0.08" stroke="#d23f3f" stroke-width="1.25" stroke-dasharray="4 3"/><circle cx="538" cy="134" r="13" fill="#d23f3f" fill-opacity="0.16" stroke="#d23f3f" stroke-width="1.25"/><g fill="none" stroke="#d23f3f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="538" cy="134" r="7"/><path d="M538 130v4l3 2"/></g><text x="560" y="131" font-size="13" fill="#1d1f22" font-weight="600">Its schedules</text><text x="560" y="148" font-size="11.5" fill="#5c6168">each one in the audit log</text><rect x="24" y="188" width="712" height="96" rx="12" fill="#1c9a3b" fill-opacity="0.06"/><text x="40" y="207" font-size="10.5" fill="#1c9a3b" font-weight="700" letter-spacing="0.08em">KEPT</text><rect x="40" y="218" width="208" height="56" rx="8" fill="#1c9a3b" fill-opacity="0.13" stroke="#1c9a3b" stroke-width="2"/><circle cx="66" cy="246" r="13" fill="#1c9a3b" fill-opacity="0.16" stroke="#1c9a3b" stroke-width="1.25"/><g fill="none" stroke="#1c9a3b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M62 240l10 6l-10 6z"/></g><text x="88" y="243" font-size="13" fill="#1d1f22" font-weight="600">Its pipeline runs</text><text x="88" y="260" font-size="11.5" fill="#5c6168">in their pipelines' history</text><rect x="276" y="218" width="208" height="56" rx="8" fill="#1c9a3b" fill-opacity="0.13" stroke="#1c9a3b" stroke-width="2"/><circle cx="302" cy="246" r="13" fill="#1c9a3b" fill-opacity="0.16" stroke="#1c9a3b" stroke-width="1.25"/><g fill="none" stroke="#1c9a3b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="302" cy="241" rx="7" ry="3"/><path d="M295 241v10a7 3 0 0 0 14 0v-10"/><path d="M295 246a7 3 0 0 0 14 0"/></g><text x="324" y="243" font-size="13" fill="#1d1f22" font-weight="600">What they wrote</text><text x="324" y="260" font-size="11.5" fill="#5c6168">tables and files stay</text><rect x="512" y="218" width="208" height="56" rx="8" fill="#1c9a3b" fill-opacity="0.13" stroke="#1c9a3b" stroke-width="2"/><circle cx="538" cy="246" r="13" fill="#1c9a3b" fill-opacity="0.16" stroke="#1c9a3b" stroke-width="1.25"/><g fill="none" stroke="#1c9a3b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M532 241h12M532 246h12M532 251h8"/></g><text x="560" y="243" font-size="13" fill="#1d1f22" font-weight="600">Lineage and quality</text><text x="560" y="260" font-size="11.5" fill="#5c6168">in the catalogue</text><rect x="24" y="300" width="712" height="34" rx="8" fill="#efede7"/><g fill="none" stroke="#5c6168" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="37" y="315" width="14" height="10" rx="2"/><path d="M40 315v-3a4 4 0 0 1 8 0v3"/></g><text x="62" y="321.5" font-size="11.5" fill="#1d1f22">Refused while a run of the flow is queued or running: cancel it, or let it finish, then delete.</text></svg>
