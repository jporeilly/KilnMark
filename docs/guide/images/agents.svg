<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 478" width="760" height="478" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="How an agent works"><title>How an agent works</title><defs><marker id="a7b55c7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7b55c7"/></marker><marker id="a1c9a3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1c9a3b"/></marker><marker id="a5c6168" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5c6168"/></marker></defs><rect x="0" y="0" width="760" height="478" rx="0" fill="#ffffff"/><text x="24" y="34" font-size="16" fill="#1d1f22" font-weight="650">How an agent works</text><text x="24" y="55" font-size="12" fill="#5c6168">An agent proposes and a person decides; some things are never an agent's</text><rect x="24" y="76" width="712" height="96" rx="12" fill="#7b55c7" fill-opacity="0.06"/><text x="40" y="95" font-size="10.5" fill="#7b55c7" font-weight="700" letter-spacing="0.08em">THE AGENT WORKS</text><rect x="40" y="106" width="208" height="56" rx="8" fill="#7b55c7" fill-opacity="0.08" stroke="#7b55c7" stroke-width="1.25"/><circle cx="66" cy="134" r="13" fill="#7b55c7" fill-opacity="0.16" stroke="#7b55c7" stroke-width="1.25"/><g fill="none" stroke="#7b55c7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M62 128l10 6l-10 6z"/></g><text x="88" y="131" font-size="13" fill="#1d1f22" font-weight="600">A task starts</text><text x="88" y="148" font-size="11.5" fill="#5c6168">by a person or an event</text><path d="M248 134 L274 134" fill="none" stroke="#7b55c7" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a7b55c7)"/><rect x="276" y="106" width="208" height="56" rx="8" fill="#7b55c7" fill-opacity="0.08" stroke="#7b55c7" stroke-width="1.25"/><circle cx="302" cy="134" r="13" fill="#7b55c7" fill-opacity="0.16" stroke="#7b55c7" stroke-width="1.25"/><g fill="none" stroke="#7b55c7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="296" y="128" width="12" height="12" rx="2"/><path d="M299 125v3M305 125v3M299 140v3M305 140v3"/></g><text x="324" y="131" font-size="13" fill="#1d1f22" font-weight="600">It reads and tries</text><text x="324" y="148" font-size="11.5" fill="#5c6168">with its own token's role</text><path d="M484 134 L510 134" fill="none" stroke="#7b55c7" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a7b55c7)"/><rect x="512" y="106" width="208" height="56" rx="8" fill="#7b55c7" fill-opacity="0.13" stroke="#7b55c7" stroke-width="2"/><circle cx="538" cy="134" r="13" fill="#7b55c7" fill-opacity="0.16" stroke="#7b55c7" stroke-width="1.25"/><g fill="none" stroke="#7b55c7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M532 140l1 -4l8 -8l3 3l-8 8z"/></g><text x="560" y="131" font-size="13" fill="#1d1f22" font-weight="600">A proposal</text><text x="560" y="148" font-size="11.5" fill="#5c6168">a diff with its reasons</text><path d="M616 162 L616 216" fill="none" stroke="#7b55c7" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a7b55c7)"/><rect x="24" y="188" width="712" height="110" rx="12" fill="#1c9a3b" fill-opacity="0.06"/><text x="40" y="207" font-size="10.5" fill="#1c9a3b" font-weight="700" letter-spacing="0.08em">A PERSON DECIDES</text><rect x="512" y="218" width="208" height="56" rx="8" fill="#1c9a3b" fill-opacity="0.13" stroke="#1c9a3b" stroke-width="2"/><circle cx="538" cy="246" r="13" fill="#1c9a3b" fill-opacity="0.16" stroke="#1c9a3b" stroke-width="1.25"/><g fill="none" stroke="#1c9a3b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="538" cy="242.5" r="3.5"/><path d="M532 254a6 5 0 0 1 12 0"/></g><text x="560" y="243" font-size="13" fill="#1d1f22" font-weight="600">A person reviews</text><text x="560" y="260" font-size="11.5" fill="#5c6168">in the proposals inbox</text><path d="M512 246 L486 246" fill="none" stroke="#1c9a3b" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a1c9a3b)"/><rect x="276" y="218" width="208" height="56" rx="8" fill="#1c9a3b" fill-opacity="0.08" stroke="#1c9a3b" stroke-width="1.25"/><circle cx="302" cy="246" r="13" fill="#1c9a3b" fill-opacity="0.16" stroke="#1c9a3b" stroke-width="1.25"/><g fill="none" stroke="#1c9a3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M297 246l4 4l7 -8"/></g><text x="324" y="243" font-size="13" fill="#1d1f22" font-weight="600">Approved</text><text x="324" y="260" font-size="11.5" fill="#5c6168">made as that person</text><path d="M616 274 L616 286 L144 286 L144 276" fill="none" stroke="#5c6168" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#a5c6168)"/><rect x="40" y="218" width="208" height="56" rx="8" fill="#efede7" fill-opacity="1" stroke="#b4aea2" stroke-width="1.25"/><circle cx="66" cy="246" r="13" fill="#5c6168" fill-opacity="0.16" stroke="#5c6168" stroke-width="1.25"/><g fill="none" stroke="#5c6168" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M60 240l12 12M72 240l-12 12"/></g><text x="88" y="243" font-size="13" fill="#1d1f22" font-weight="600">Rejected or edited</text><text x="88" y="260" font-size="11.5" fill="#5c6168">the reason kept with it</text><rect x="24" y="316" width="712" height="96" rx="12" fill="#d23f3f" fill-opacity="0.06"/><text x="40" y="335" font-size="10.5" fill="#d23f3f" font-weight="700" letter-spacing="0.08em">NEVER AN AGENT'S</text><rect x="40" y="346" width="208" height="56" rx="8" fill="#d23f3f" fill-opacity="0.08" stroke="#d23f3f" stroke-width="1.25" stroke-dasharray="4 3"/><circle cx="66" cy="374" r="13" fill="#d23f3f" fill-opacity="0.16" stroke="#d23f3f" stroke-width="1.25"/><g fill="none" stroke="#d23f3f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M58 374q8 -8 16 0q-8 8 -16 0"/><circle cx="66" cy="374" r="2.5"/></g><text x="88" y="371" font-size="13" fill="#1d1f22" font-weight="600">Unmasked values</text><text x="88" y="388" font-size="11.5" fill="#5c6168">a model never sees them</text><rect x="276" y="346" width="208" height="56" rx="8" fill="#d23f3f" fill-opacity="0.08" stroke="#d23f3f" stroke-width="1.25" stroke-dasharray="4 3"/><circle cx="302" cy="374" r="13" fill="#d23f3f" fill-opacity="0.16" stroke="#d23f3f" stroke-width="1.25"/><g fill="none" stroke="#d23f3f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="295" y="372" width="14" height="10" rx="2"/><path d="M298 372v-3a4 4 0 0 1 8 0v3"/></g><text x="324" y="371" font-size="13" fill="#1d1f22" font-weight="600">Admin powers</text><text x="324" y="388" font-size="11.5" fill="#5c6168">no unmask, SQL or DB tools</text><rect x="512" y="346" width="208" height="56" rx="8" fill="#d23f3f" fill-opacity="0.08" stroke="#d23f3f" stroke-width="1.25" stroke-dasharray="4 3"/><circle cx="538" cy="374" r="13" fill="#d23f3f" fill-opacity="0.16" stroke="#d23f3f" stroke-width="1.25"/><g fill="none" stroke="#d23f3f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M538 366l7 3v5c0 4 -3 7 -7 8c-4 -1 -7 -4 -7 -8v-5z"/></g><text x="560" y="371" font-size="13" fill="#1d1f22" font-weight="600">Orders found in data</text><text x="560" y="388" font-size="11.5" fill="#5c6168">read as data, not obeyed</text><rect x="24" y="428" width="712" height="34" rx="8" fill="#efede7"/><g fill="none" stroke="#5c6168" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M38 440h12M38 445h12M38 450h8"/></g><text x="62" y="449.5" font-size="11.5" fill="#1d1f22">Every step and model call is kept; a task stops at its limits; an admin can switch any agent off.</text></svg>
