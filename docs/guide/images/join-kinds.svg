<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" width="760" height="452" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="The four kinds of join"><title>The four kinds of join</title><defs></defs><rect x="0" y="0" width="760" height="452" rx="0" fill="#ffffff"/><text x="24" y="34" font-size="16" fill="#1d1f22" font-weight="650">The four kinds of join</text><text x="24" y="55" font-size="12" fill="#5c6168">Which rows a join keeps: the pairs whose keys are equal, and the rows of either side with no match</text><rect x="40" y="76" width="160" height="190" rx="8" fill="#efede7" stroke="#b4aea2" stroke-width="1.25"/><defs><clipPath id="j0l"><circle cx="98" cy="150" r="34"/></clipPath><clipPath id="j0r"><circle cx="142" cy="150" r="34"/></clipPath></defs><circle cx="142" cy="150" r="34" fill="#17a179" fill-opacity="0.55" clip-path="url(#j0l)"/><circle cx="98" cy="150" r="34" fill="none" stroke="#2f72d8" stroke-width="1.5"/><circle cx="142" cy="150" r="34" fill="none" stroke="#e8663d" stroke-width="1.5"/><text x="78" y="154" font-size="12" fill="#2f72d8" font-weight="700" text-anchor="middle">L</text><text x="162" y="154" font-size="12" fill="#e8663d" font-weight="700" text-anchor="middle">R</text><text x="120" y="216" font-size="13" fill="#1d1f22" font-weight="600" text-anchor="middle">how: inner</text><text x="120" y="236" font-size="11.5" fill="#5c6168" text-anchor="middle">Pairs that match</text><rect x="214" y="76" width="160" height="190" rx="8" fill="#efede7" stroke="#b4aea2" stroke-width="1.25"/><defs><clipPath id="j1l"><circle cx="272" cy="150" r="34"/></clipPath><clipPath id="j1r"><circle cx="316" cy="150" r="34"/></clipPath></defs><circle cx="272" cy="150" r="34" fill="#2f72d8" fill-opacity="0.35"/><circle cx="316" cy="150" r="34" fill="#efede7" clip-path="url(#j1l)"/><circle cx="316" cy="150" r="34" fill="#17a179" fill-opacity="0.55" clip-path="url(#j1l)"/><circle cx="272" cy="150" r="34" fill="none" stroke="#2f72d8" stroke-width="1.5"/><circle cx="316" cy="150" r="34" fill="none" stroke="#e8663d" stroke-width="1.5"/><text x="252" y="154" font-size="12" fill="#2f72d8" font-weight="700" text-anchor="middle">L</text><text x="336" y="154" font-size="12" fill="#e8663d" font-weight="700" text-anchor="middle">R</text><text x="294" y="216" font-size="13" fill="#1d1f22" font-weight="600" text-anchor="middle">how: left</text><text x="294" y="236" font-size="11.5" fill="#5c6168" text-anchor="middle">Plus left rows with none</text><rect x="388" y="76" width="160" height="190" rx="8" fill="#efede7" stroke="#b4aea2" stroke-width="1.25"/><defs><clipPath id="j2l"><circle cx="446" cy="150" r="34"/></clipPath><clipPath id="j2r"><circle cx="490" cy="150" r="34"/></clipPath></defs><circle cx="490" cy="150" r="34" fill="#e8663d" fill-opacity="0.35"/><circle cx="446" cy="150" r="34" fill="#efede7" clip-path="url(#j2r)"/><circle cx="490" cy="150" r="34" fill="#17a179" fill-opacity="0.55" clip-path="url(#j2l)"/><circle cx="446" cy="150" r="34" fill="none" stroke="#2f72d8" stroke-width="1.5"/><circle cx="490" cy="150" r="34" fill="none" stroke="#e8663d" stroke-width="1.5"/><text x="426" y="154" font-size="12" fill="#2f72d8" font-weight="700" text-anchor="middle">L</text><text x="510" y="154" font-size="12" fill="#e8663d" font-weight="700" text-anchor="middle">R</text><text x="468" y="216" font-size="13" fill="#1d1f22" font-weight="600" text-anchor="middle">how: right</text><text x="468" y="236" font-size="11.5" fill="#5c6168" text-anchor="middle">Plus right rows with none</text><rect x="562" y="76" width="160" height="190" rx="8" fill="#efede7" stroke="#b4aea2" stroke-width="1.25"/><defs><clipPath id="j3l"><circle cx="620" cy="150" r="34"/></clipPath><clipPath id="j3r"><circle cx="664" cy="150" r="34"/></clipPath></defs><circle cx="620" cy="150" r="34" fill="#2f72d8" fill-opacity="0.35"/><circle cx="664" cy="150" r="34" fill="#efede7" clip-path="url(#j3l)"/><circle cx="664" cy="150" r="34" fill="#e8663d" fill-opacity="0.35"/><circle cx="620" cy="150" r="34" fill="#efede7" clip-path="url(#j3r)"/><circle cx="664" cy="150" r="34" fill="#17a179" fill-opacity="0.55" clip-path="url(#j3l)"/><circle cx="620" cy="150" r="34" fill="none" stroke="#2f72d8" stroke-width="1.5"/><circle cx="664" cy="150" r="34" fill="none" stroke="#e8663d" stroke-width="1.5"/><text x="600" y="154" font-size="12" fill="#2f72d8" font-weight="700" text-anchor="middle">L</text><text x="684" y="154" font-size="12" fill="#e8663d" font-weight="700" text-anchor="middle">R</text><text x="642" y="216" font-size="13" fill="#1d1f22" font-weight="600" text-anchor="middle">how: full</text><text x="642" y="236" font-size="11.5" fill="#5c6168" text-anchor="middle">Every row of both</text><rect x="24" y="290" width="712" height="96" rx="12" fill="#1f3d73" fill-opacity="0.06"/><text x="40" y="309" font-size="10.5" fill="#1f3d73" font-weight="700" letter-spacing="0.08em">WHERE THERE IS NO MATCH</text><rect x="40" y="320" width="330" height="56" rx="8" fill="#1f3d73" fill-opacity="0.08" stroke="#1f3d73" stroke-width="1.25"/><circle cx="66" cy="348" r="13" fill="#1f3d73" fill-opacity="0.16" stroke="#1f3d73" stroke-width="1.25"/><g fill="none" stroke="#1f3d73" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M60 343h12M60 348h12M60 353h8"/></g><text x="88" y="345" font-size="13" fill="#1d1f22" font-weight="600">The other side's columns are empty</text><text x="88" y="362" font-size="11.5" fill="#5c6168">and every column keeps its type</text><rect x="392" y="320" width="330" height="56" rx="8" fill="#1f3d73" fill-opacity="0.08" stroke="#1f3d73" stroke-width="1.25"/><circle cx="418" cy="348" r="13" fill="#1f3d73" fill-opacity="0.16" stroke="#1f3d73" stroke-width="1.25"/><g fill="none" stroke="#1f3d73" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="414" cy="348" r="5"/><path d="M419 348h9M425 348v4M428 348v3"/></g><text x="440" y="345" font-size="13" fill="#1d1f22" font-weight="600">An empty key matches nothing</text><text x="440" y="362" font-size="11.5" fill="#5c6168">not even another empty key</text><rect x="24" y="402" width="712" height="34" rx="8" fill="#efede7"/><g fill="none" stroke="#5c6168" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M39 411h6l5 5v11h-11z"/><path d="M45 411v5h5"/></g><text x="62" y="423.5" font-size="11.5" fill="#1d1f22">Rows come out in order of their keys; a key on 3 left rows and 2 right rows gives 6 pairs.</text></svg>
