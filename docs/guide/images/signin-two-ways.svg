<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Two ways in, one set of roles"><title>Two ways in, one set of roles</title><defs><marker id="ae8663d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e8663d"/></marker><marker id="a17a179" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17a179"/></marker></defs><rect x="0" y="0" width="760" height="330" rx="0" fill="#ffffff"/><text x="24" y="34" font-size="16" fill="#1d1f22" font-weight="650">Two ways in, one set of roles</text><text x="24" y="55" font-size="12" fill="#5c6168">Scripts use API tokens; people can sign in with your organisation's login</text><rect x="24" y="88" width="572" height="80" rx="12" fill="#e8663d" fill-opacity="0.06"/><rect x="40" y="100" width="150" height="56" rx="8" fill="#e8663d" fill-opacity="0.08" stroke="#e8663d" stroke-width="1.25"/><circle cx="66" cy="128" r="13" fill="#e8663d" fill-opacity="0.16" stroke="#e8663d" stroke-width="1.25"/><g fill="none" stroke="#e8663d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M60 123l4 4l-4 4"/><path d="M67 132h6"/></g><text x="88" y="125" font-size="13" fill="#1d1f22" font-weight="600">Script or CI</text><text x="88" y="142" font-size="11.5" fill="#5c6168">a program</text><rect x="214" y="100" width="176" height="56" rx="8" fill="#e8663d" fill-opacity="0.08" stroke="#e8663d" stroke-width="1.25"/><text x="228" y="125" font-size="13" fill="#1d1f22" font-weight="600">Sends its API token</text><text x="228" y="142" font-size="11.5" fill="#5c6168">km_… with every request</text><rect x="414" y="100" width="166" height="56" rx="8" fill="#e8663d" fill-opacity="0.08" stroke="#e8663d" stroke-width="1.25"/><text x="428" y="125" font-size="13" fill="#1d1f22" font-weight="600">Kilnmark checks it</text><text x="428" y="142" font-size="11.5" fill="#5c6168">not revoked or expired</text><path d="M190 128 L212 128" fill="none" stroke="#e8663d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ae8663d)"/><path d="M390 128 L412 128" fill="none" stroke="#e8663d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ae8663d)"/><path d="M580 128 L614 128" fill="none" stroke="#e8663d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ae8663d)"/><rect x="24" y="184" width="572" height="80" rx="12" fill="#17a179" fill-opacity="0.06"/><rect x="40" y="196" width="150" height="56" rx="8" fill="#17a179" fill-opacity="0.08" stroke="#17a179" stroke-width="1.25"/><circle cx="66" cy="224" r="13" fill="#17a179" fill-opacity="0.16" stroke="#17a179" stroke-width="1.25"/><g fill="none" stroke="#17a179" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="66" cy="220.5" r="3.5"/><path d="M60 232a6 5 0 0 1 12 0"/></g><text x="88" y="221" font-size="13" fill="#1d1f22" font-weight="600">A person</text><text x="88" y="238" font-size="11.5" fill="#5c6168">in a browser</text><rect x="214" y="196" width="176" height="56" rx="8" fill="#17a179" fill-opacity="0.08" stroke="#17a179" stroke-width="1.25"/><text x="228" y="221" font-size="13" fill="#1d1f22" font-weight="600">Organisation login</text><text x="228" y="238" font-size="11.5" fill="#5c6168">your provider, with MFA</text><rect x="414" y="196" width="166" height="56" rx="8" fill="#17a179" fill-opacity="0.08" stroke="#17a179" stroke-width="1.25"/><text x="428" y="221" font-size="13" fill="#1d1f22" font-weight="600">Kilnmark checks</text><text x="428" y="238" font-size="11.5" fill="#5c6168">groups, MFA, when</text><path d="M190 224 L212 224" fill="none" stroke="#17a179" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a17a179)"/><path d="M390 224 L412 224" fill="none" stroke="#17a179" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a17a179)"/><path d="M580 224 L614 224" fill="none" stroke="#17a179" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a17a179)"/><rect x="616" y="88" width="120" height="176" rx="10" fill="#2f72d8" fill-opacity="0.1" stroke="#2f72d8" stroke-width="2"/><text x="676" y="110" font-size="13" fill="#1d1f22" font-weight="600" text-anchor="middle">Role + grant</text><rect x="630" y="120" width="92" height="22" rx="11" fill="#2f72d8" fill-opacity="0.2" stroke="#2f72d8" stroke-width="1.25"/><text x="676" y="135" font-size="11.5" fill="#1d1f22" font-weight="600" text-anchor="middle">Admin</text><rect x="630" y="146" width="92" height="22" rx="11" fill="#2f72d8" fill-opacity="0.2" stroke="#2f72d8" stroke-width="1.25"/><text x="676" y="161" font-size="11.5" fill="#1d1f22" font-weight="600" text-anchor="middle">Designer</text><rect x="630" y="172" width="92" height="22" rx="11" fill="#2f72d8" fill-opacity="0.2" stroke="#2f72d8" stroke-width="1.25"/><text x="676" y="187" font-size="11.5" fill="#1d1f22" font-weight="600" text-anchor="middle">Steward</text><rect x="630" y="198" width="92" height="22" rx="11" fill="#2f72d8" fill-opacity="0.2" stroke="#2f72d8" stroke-width="1.25"/><text x="676" y="213" font-size="11.5" fill="#1d1f22" font-weight="600" text-anchor="middle">Viewer</text><rect x="630" y="230" width="92" height="22" rx="11" fill="none" stroke="#1f3d73" stroke-width="1.25" stroke-dasharray="4 3"/><text x="676" y="245" font-size="11.5" fill="#1d1f22" text-anchor="middle">+ unmask grant</text><rect x="24" y="280" width="712" height="34" rx="8" fill="#efede7"/><g fill="none" stroke="#5c6168" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M38 292h12M38 297h12M38 302h8"/></g><text x="62" y="301.5" font-size="11.5" fill="#1d1f22">Every sign-in, refusal and change is written to the audit log, which is never changed or deleted.</text></svg>
