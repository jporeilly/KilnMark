<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 498" width="760" height="498" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="How a run is tried again"><title>How a run is tried again</title><defs><marker id="a2f72d8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f72d8"/></marker><marker id="a1c9a3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1c9a3b"/></marker><marker id="ad23f3f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d23f3f"/></marker><marker id="a5c6168" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5c6168"/></marker></defs><rect x="0" y="0" width="760" height="498" rx="0" fill="#ffffff"/><text x="24" y="34" font-size="16" fill="#1d1f22" font-weight="650">How a run is tried again</text><text x="24" y="55" font-size="12" fill="#5c6168">A failed try of a pipeline or flow run, tried again only when it may be; a flow carries on from where it failed</text><rect x="24" y="76" width="712" height="96" rx="12" fill="#2f72d8" fill-opacity="0.06"/><text x="40" y="95" font-size="10.5" fill="#2f72d8" font-weight="700" letter-spacing="0.08em">A TRY ENDS</text><rect x="40" y="106" width="208" height="56" rx="8" fill="#2f72d8" fill-opacity="0.08" stroke="#2f72d8" stroke-width="1.25"/><circle cx="66" cy="134" r="13" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><g fill="none" stroke="#2f72d8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M62 128l10 6l-10 6z"/></g><text x="88" y="131" font-size="13" fill="#1d1f22" font-weight="600">A try runs</text><text x="88" y="148" font-size="11.5" fill="#5c6168">its timeout is per try</text><path d="M248 134 L274 134" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><rect x="276" y="106" width="208" height="56" rx="8" fill="#d23f3f" fill-opacity="0.08" stroke="#d23f3f" stroke-width="1.25"/><circle cx="302" cy="134" r="13" fill="#d23f3f" fill-opacity="0.16" stroke="#d23f3f" stroke-width="1.25"/><g fill="none" stroke="#d23f3f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M296 128l12 12M308 128l-12 12"/></g><text x="324" y="131" font-size="13" fill="#1d1f22" font-weight="600">It fails, or is lost</text><text x="324" y="148" font-size="11.5" fill="#5c6168">its worker stopped</text><path d="M484 134 L510 134" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><rect x="512" y="106" width="208" height="56" rx="8" fill="#c08217" fill-opacity="0.13" stroke="#c08217" stroke-width="2"/><circle cx="538" cy="134" r="13" fill="#c08217" fill-opacity="0.16" stroke="#c08217" stroke-width="1.25"/><g fill="none" stroke="#c08217" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M538 126l7 3v5c0 4 -3 7 -7 8c-4 -1 -7 -4 -7 -8v-5z"/></g><text x="560" y="131" font-size="13" fill="#1d1f22" font-weight="600">May it try again?</text><text x="560" y="148" font-size="11.5" fill="#5c6168">tries left, safe, before next fire</text><path d="M616 162 L616 224" fill="none" stroke="#1c9a3b" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a1c9a3b)"/><text x="624" y="180" font-size="11.5" fill="#1c9a3b" text-anchor="start">yes</text><path d="M720 134 L728 134 L728 394 L722 394" fill="none" stroke="#d23f3f" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#ad23f3f)"/><text x="722" y="180" font-size="11.5" fill="#d23f3f" text-anchor="end">no</text><rect x="24" y="196" width="712" height="110" rx="12" fill="#1c9a3b" fill-opacity="0.06"/><text x="40" y="215" font-size="10.5" fill="#1c9a3b" font-weight="700" letter-spacing="0.08em">THE SAME RUN, A NEW TRY</text><rect x="512" y="226" width="208" height="56" rx="8" fill="#1c9a3b" fill-opacity="0.08" stroke="#1c9a3b" stroke-width="1.25"/><circle cx="538" cy="254" r="13" fill="#1c9a3b" fill-opacity="0.16" stroke="#1c9a3b" stroke-width="1.25"/><g fill="none" stroke="#1c9a3b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="538" cy="254" r="7"/><path d="M538 250v4l3 2"/></g><text x="560" y="251" font-size="13" fill="#1d1f22" font-weight="600">Queued, waiting</text><text x="560" y="268" font-size="11.5" fill="#5c6168">the delay doubled, at most 1h</text><path d="M512 254 L486 254" fill="none" stroke="#1c9a3b" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a1c9a3b)"/><rect x="276" y="226" width="208" height="56" rx="8" fill="#1c9a3b" fill-opacity="0.13" stroke="#1c9a3b" stroke-width="2"/><circle cx="302" cy="254" r="13" fill="#1c9a3b" fill-opacity="0.16" stroke="#1c9a3b" stroke-width="1.25"/><g fill="none" stroke="#1c9a3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M297 254l4 4l7 -8"/></g><text x="324" y="251" font-size="13" fill="#1d1f22" font-weight="600">A flow carries on</text><text x="324" y="268" font-size="11.5" fill="#5c6168">succeeded nodes kept</text><path d="M276 254 L250 254" fill="none" stroke="#1c9a3b" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a1c9a3b)"/><rect x="40" y="226" width="208" height="56" rx="8" fill="#1c9a3b" fill-opacity="0.08" stroke="#1c9a3b" stroke-width="1.25"/><circle cx="66" cy="254" r="13" fill="#1c9a3b" fill-opacity="0.16" stroke="#1c9a3b" stroke-width="1.25"/><g fill="none" stroke="#1c9a3b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M62 248l10 6l-10 6z"/></g><text x="88" y="251" font-size="13" fill="#1d1f22" font-weight="600">The next try</text><text x="88" y="268" font-size="11.5" fill="#5c6168">nobody is told</text><path d="M226 226 L226 164" fill="none" stroke="#5c6168" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#a5c6168)"/><rect x="24" y="336" width="712" height="96" rx="12" fill="#d23f3f" fill-opacity="0.06"/><text x="40" y="355" font-size="10.5" fill="#d23f3f" font-weight="700" letter-spacing="0.08em">AFTER THE LAST TRY</text><rect x="512" y="366" width="208" height="56" rx="8" fill="#d23f3f" fill-opacity="0.13" stroke="#d23f3f" stroke-width="2"/><circle cx="538" cy="394" r="13" fill="#d23f3f" fill-opacity="0.16" stroke="#d23f3f" stroke-width="1.25"/><g fill="none" stroke="#d23f3f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M532 398v-4a6 6 0 0 1 12 0v4l2 2h-16z"/><path d="M536 402a2 2 0 0 0 4 0"/></g><text x="560" y="391" font-size="13" fill="#1d1f22" font-weight="600">One notice</text><text x="560" y="408" font-size="11.5" fill="#5c6168">to the owners, with the tries</text><path d="M512 394 L486 394" fill="none" stroke="#5c6168" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a5c6168)"/><rect x="276" y="366" width="208" height="56" rx="8" fill="#7b55c7" fill-opacity="0.08" stroke="#7b55c7" stroke-width="1.25"/><circle cx="302" cy="394" r="13" fill="#7b55c7" fill-opacity="0.16" stroke="#7b55c7" stroke-width="1.25"/><g fill="none" stroke="#7b55c7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="302" cy="390.5" r="3.5"/><path d="M296 402a6 5 0 0 1 12 0"/></g><text x="324" y="391" font-size="13" fill="#1d1f22" font-weight="600">Run again by hand</text><text x="324" y="408" font-size="11.5" fill="#5c6168">a flow, from the failure</text><path d="M276 394 L250 394" fill="none" stroke="#5c6168" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a5c6168)"/><rect x="40" y="366" width="208" height="56" rx="8" fill="#1c9a3b" fill-opacity="0.08" stroke="#1c9a3b" stroke-width="1.25"/><circle cx="66" cy="394" r="13" fill="#1c9a3b" fill-opacity="0.16" stroke="#1c9a3b" stroke-width="1.25"/><g fill="none" stroke="#1c9a3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M61 394l4 4l7 -8"/></g><text x="88" y="391" font-size="13" fill="#1d1f22" font-weight="600">A later success</text><text x="88" y="408" font-size="11.5" fill="#5c6168">told as recovered</text><rect x="24" y="448" width="712" height="34" rx="8" fill="#efede7"/><g fill="none" stroke="#5c6168" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="44" cy="465" r="3"/><circle cx="44" cy="465" r="7" stroke-dasharray="3 2.5"/></g><text x="62" y="469.5" font-size="11.5" fill="#1d1f22">Never tried again: a cancel, a refusal, a gate, writes that repeat. Node retries replace the run's.</text></svg>
