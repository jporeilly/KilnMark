<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 542" width="760" height="542" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="What happens when a schedule is due"><title>What happens when a schedule is due</title><defs><marker id="a2f72d8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f72d8"/></marker><marker id="ac08217" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c08217"/></marker><marker id="a1c9a3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1c9a3b"/></marker><marker id="ad23f3f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d23f3f"/></marker></defs><rect x="0" y="0" width="760" height="542" rx="0" fill="#ffffff"/><text x="24" y="34" font-size="16" fill="#1d1f22" font-weight="650">What happens when a schedule is due</text><text x="24" y="55" font-size="12" fill="#5c6168">Each fire ends in one of five outcomes, shown on the schedule</text><rect x="24" y="84" width="200" height="56" rx="8" fill="#2f72d8" fill-opacity="0.08" stroke="#2f72d8" stroke-width="1.25"/><circle cx="50" cy="112" r="13" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><g fill="none" stroke="#2f72d8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="112" r="7"/><path d="M50 108v4l3 2"/></g><text x="72" y="109" font-size="13" fill="#1d1f22" font-weight="600">A fire is due</text><text x="72" y="126" font-size="11.5" fill="#5c6168">found by the scheduler</text><path d="M224 112 L246 112" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><polygon points="248,112 330,78 412,112 330,146" fill="#efede7" stroke="#b4aea2" stroke-width="1.25"/><text x="330" y="108" font-size="12.5" fill="#1d1f22" font-weight="600" text-anchor="middle">Due more than</text><text x="330" y="124" font-size="12.5" fill="#1d1f22" font-weight="600" text-anchor="middle">an hour ago?</text><path d="M412 112 L520 112" fill="none" stroke="#c08217" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#ac08217)"/><text x="422" y="102" font-size="11.5" fill="#c08217" text-anchor="start">yes</text><rect x="522" y="84" width="214" height="56" rx="8" fill="#c08217" fill-opacity="0.08" stroke="#c08217" stroke-width="1.25" stroke-dasharray="4 3"/><circle cx="548" cy="112" r="13" fill="#c08217" fill-opacity="0.16" stroke="#c08217" stroke-width="1.25"/><g fill="none" stroke="#c08217" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="548" cy="112" r="7"/><path d="M548 108v4l3 2"/></g><text x="570" y="109" font-size="13" fill="#1d1f22" font-weight="600">missed</text><text x="570" y="126" font-size="11.5" fill="#5c6168">the server was not running</text><path d="M330 146 L330 184" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><text x="338" y="166" font-size="11.5" fill="#5c6168" text-anchor="start">no</text><polygon points="248,220 330,186 412,220 330,254" fill="#efede7" stroke="#b4aea2" stroke-width="1.25"/><text x="330" y="216" font-size="12.5" fill="#1d1f22" font-weight="600" text-anchor="middle">Its setter still</text><text x="330" y="232" font-size="12.5" fill="#1d1f22" font-weight="600" text-anchor="middle">has the role?</text><path d="M412 220 L520 220" fill="none" stroke="#c08217" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#ac08217)"/><text x="422" y="210" font-size="11.5" fill="#c08217" text-anchor="start">no</text><rect x="522" y="192" width="214" height="56" rx="8" fill="#c08217" fill-opacity="0.08" stroke="#c08217" stroke-width="1.25" stroke-dasharray="4 3"/><circle cx="548" cy="220" r="13" fill="#c08217" fill-opacity="0.16" stroke="#c08217" stroke-width="1.25"/><g fill="none" stroke="#c08217" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="541" y="218" width="14" height="10" rx="2"/><path d="M544 218v-3a4 4 0 0 1 8 0v3"/></g><text x="570" y="217" font-size="13" fill="#1d1f22" font-weight="600">paused</text><text x="570" y="234" font-size="11.5" fill="#5c6168">and in the audit log</text><path d="M330 254 L330 292" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><text x="338" y="274" font-size="11.5" fill="#5c6168" text-anchor="start">yes</text><polygon points="248,328 330,294 412,328 330,362" fill="#efede7" stroke="#b4aea2" stroke-width="1.25"/><text x="330" y="324" font-size="12.5" fill="#1d1f22" font-weight="600" text-anchor="middle">A run of it</text><text x="330" y="340" font-size="12.5" fill="#1d1f22" font-weight="600" text-anchor="middle">still going?</text><path d="M412 328 L520 328" fill="none" stroke="#c08217" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#ac08217)"/><text x="422" y="318" font-size="11.5" fill="#c08217" text-anchor="start">yes</text><rect x="522" y="300" width="214" height="56" rx="8" fill="#c08217" fill-opacity="0.08" stroke="#c08217" stroke-width="1.25" stroke-dasharray="4 3"/><circle cx="548" cy="328" r="13" fill="#c08217" fill-opacity="0.16" stroke="#c08217" stroke-width="1.25"/><g fill="none" stroke="#c08217" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M544 322l10 6l-10 6z"/></g><text x="570" y="325" font-size="13" fill="#1d1f22" font-weight="600">skipped</text><text x="570" y="342" font-size="11.5" fill="#5c6168">a run was still going</text><path d="M330 362 L330 400" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><text x="338" y="382" font-size="11.5" fill="#5c6168" text-anchor="start">no</text><polygon points="248,436 330,402 412,436 330,470" fill="#efede7" stroke="#b4aea2" stroke-width="1.25"/><text x="330" y="432" font-size="12.5" fill="#1d1f22" font-weight="600" text-anchor="middle">Can the latest</text><text x="330" y="448" font-size="12.5" fill="#1d1f22" font-weight="600" text-anchor="middle">version run?</text><path d="M412 436 L520 436" fill="none" stroke="#1c9a3b" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a1c9a3b)"/><text x="422" y="426" font-size="11.5" fill="#1c9a3b" text-anchor="start">yes</text><rect x="522" y="408" width="214" height="56" rx="8" fill="#1c9a3b" fill-opacity="0.13" stroke="#1c9a3b" stroke-width="2"/><circle cx="548" cy="436" r="13" fill="#1c9a3b" fill-opacity="0.16" stroke="#1c9a3b" stroke-width="1.25"/><g fill="none" stroke="#1c9a3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M543 436l4 4l7 -8"/></g><text x="570" y="433" font-size="13" fill="#1d1f22" font-weight="600">started</text><text x="570" y="450" font-size="11.5" fill="#5c6168">the run is queued</text><path d="M248 436 L206 436" fill="none" stroke="#d23f3f" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#ad23f3f)"/><text x="227" y="426" font-size="11.5" fill="#d23f3f" text-anchor="middle">no</text><rect x="24" y="408" width="180" height="56" rx="8" fill="#d23f3f" fill-opacity="0.08" stroke="#d23f3f" stroke-width="1.25"/><circle cx="50" cy="436" r="13" fill="#d23f3f" fill-opacity="0.16" stroke="#d23f3f" stroke-width="1.25"/><g fill="none" stroke="#d23f3f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M44 430l12 12M56 430l-12 12"/></g><text x="72" y="433" font-size="13" fill="#1d1f22" font-weight="600">failed</text><text x="72" y="450" font-size="11.5" fill="#5c6168">the server's reason</text><rect x="24" y="492" width="712" height="34" rx="8" fill="#efede7"/><g fill="none" stroke="#5c6168" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="44" cy="509" r="3"/><circle cx="44" cy="509" r="7" stroke-dasharray="3 2.5"/></g><text x="62" y="513.5" font-size="11.5" fill="#1d1f22">A paused schedule waits for a designer or admin to resume it. Missed and skipped times are not made up.</text></svg>
