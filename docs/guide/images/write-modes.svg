<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Choosing a write mode"><title>Choosing a write mode</title><defs><marker id="a17a179" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17a179"/></marker><marker id="a2f72d8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f72d8"/></marker></defs><rect x="0" y="0" width="760" height="430" rx="0" fill="#ffffff"/><text x="24" y="34" font-size="16" fill="#1d1f22" font-weight="650">Choosing a write mode</text><text x="24" y="55" font-size="12" fill="#5c6168">A write node's mode says what happens to the rows already in the table</text><polygon points="196,110 296,72 396,110 296,148" fill="#efede7" stroke="#b4aea2" stroke-width="1.25"/><text x="296" y="106" font-size="12.5" fill="#1d1f22" font-weight="600" text-anchor="middle">Does the table</text><text x="296" y="122" font-size="12.5" fill="#1d1f22" font-weight="600" text-anchor="middle">exist yet?</text><path d="M196 110 L140 110 L140 178" fill="none" stroke="#17a179" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a17a179)"/><text x="150" y="100" font-size="11.5" fill="#17a179" text-anchor="start">no</text><rect x="40" y="180" width="200" height="56" rx="8" fill="#17a179" fill-opacity="0.08" stroke="#17a179" stroke-width="1.25"/><circle cx="66" cy="208" r="13" fill="#17a179" fill-opacity="0.16" stroke="#17a179" stroke-width="1.25"/><g fill="none" stroke="#17a179" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="59" y="201" width="14" height="14" rx="2"/><path d="M62 201v4h8v-4M62 215v-5h8v5"/></g><text x="88" y="205" font-size="13" fill="#1d1f22" font-weight="600">create</text><text x="88" y="222" font-size="11.5" fill="#5c6168">made from the input, filled</text><path d="M396 110 L520 110 L520 178" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><text x="410" y="100" font-size="11.5" fill="#2f72d8" text-anchor="start">yes, or it may</text><polygon points="420,214 520,180 620,214 520,248" fill="#efede7" stroke="#b4aea2" stroke-width="1.25"/><text x="520" y="210" font-size="12.5" fill="#1d1f22" font-weight="600" text-anchor="middle">Its rows should…</text><text x="520" y="226" font-size="12" fill="#1d1f22"></text><path d="M520 248 L520 268 L128 268 L128 300" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><path d="M520 268 L376 268 L376 300" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><path d="M520 268 L624 268 L624 300" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><text x="136" y="290" font-size="11.5" fill="#5c6168" text-anchor="start">stay; add these</text><text x="384" y="290" font-size="11.5" fill="#5c6168" text-anchor="start">all be swapped for these</text><text x="632" y="290" font-size="11.5" fill="#5c6168" text-anchor="start">be matched by key</text><rect x="24" y="302" width="216" height="56" rx="8" fill="#2f72d8" fill-opacity="0.08" stroke="#2f72d8" stroke-width="1.25"/><circle cx="50" cy="330" r="13" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><g fill="none" stroke="#2f72d8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M44 336l1 -4l8 -8l3 3l-8 8z"/></g><text x="72" y="327" font-size="13" fill="#1d1f22" font-weight="600">append</text><text x="72" y="344" font-size="11.5" fill="#5c6168">rows added; columns must fit</text><rect x="266" y="302" width="222" height="56" rx="8" fill="#2f72d8" fill-opacity="0.08" stroke="#2f72d8" stroke-width="1.25"/><circle cx="292" cy="330" r="13" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><g fill="none" stroke="#2f72d8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="285" y="323" width="14" height="14" rx="2"/><path d="M288 323v4h8v-4M288 337v-5h8v5"/></g><text x="314" y="327" font-size="13" fill="#1d1f22" font-weight="600">replace</text><text x="314" y="344" font-size="11.5" fill="#5c6168">filled aside, swapped in at once</text><rect x="514" y="302" width="222" height="56" rx="8" fill="#2f72d8" fill-opacity="0.08" stroke="#2f72d8" stroke-width="1.25"/><circle cx="540" cy="330" r="13" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><g fill="none" stroke="#2f72d8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="536" cy="330" r="5"/><path d="M541 330h9M547 330v4M550 330v3"/></g><text x="562" y="327" font-size="13" fill="#1d1f22" font-weight="600">upsert</text><text x="562" y="344" font-size="11.5" fill="#5c6168">update by key, insert the rest</text><rect x="24" y="380" width="712" height="34" rx="8" fill="#efede7"/><g fill="none" stroke="#5c6168" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M44 389l7 3v5c0 4 -3 7 -7 8c-4 -1 -7 -4 -7 -8v-5z"/></g><text x="62" y="401.5" font-size="11.5" fill="#1d1f22">Every mode takes a lock on the table first, so no other run writes it at the same time.</text></svg>
