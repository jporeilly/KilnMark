<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" width="760" height="352" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Each role includes the one below; only designers can hold the grant"><title>Each role includes the one below; only designers can hold the grant</title><defs><marker id="a5c6168" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5c6168"/></marker></defs><rect x="0" y="0" width="760" height="352" rx="0" fill="#ffffff"/><text x="24" y="34" font-size="16" fill="#1d1f22" font-weight="650">Each role includes the one below; only designers can hold the grant</text><rect x="24" y="236" width="164" height="64" rx="10" fill="#2f72d8" fill-opacity="0.07" stroke="#2f72d8" stroke-width="1.25"/><circle cx="40" cy="252" r="3.5" fill="#2f72d8"/><text x="40" y="276" font-size="14" fill="#1d1f22" font-weight="600">Viewer</text><text x="40" y="292" font-size="11.5" fill="#5c6168">reads the catalogue</text><rect x="198" y="200" width="164" height="100" rx="10" fill="#2f72d8" fill-opacity="0.11" stroke="#2f72d8" stroke-width="1.25"/><circle cx="214" cy="216" r="3.5" fill="#2f72d8"/><circle cx="225" cy="216" r="3.5" fill="#2f72d8"/><text x="214" y="240" font-size="14" fill="#1d1f22" font-weight="600">Steward</text><text x="214" y="256" font-size="11.5" fill="#5c6168">also runs and scans</text><rect x="372" y="164" width="164" height="136" rx="10" fill="#2f72d8" fill-opacity="0.15" stroke="#2f72d8" stroke-width="1.25"/><circle cx="388" cy="180" r="3.5" fill="#2f72d8"/><circle cx="399" cy="180" r="3.5" fill="#2f72d8"/><circle cx="410" cy="180" r="3.5" fill="#2f72d8"/><text x="388" y="204" font-size="14" fill="#1d1f22" font-weight="600">Designer</text><text x="388" y="220" font-size="11.5" fill="#5c6168">also builds and adds</text><rect x="546" y="128" width="164" height="172" rx="10" fill="#2f72d8" fill-opacity="0.19" stroke="#2f72d8" stroke-width="1.25"/><circle cx="562" cy="144" r="3.5" fill="#2f72d8"/><circle cx="573" cy="144" r="3.5" fill="#2f72d8"/><circle cx="584" cy="144" r="3.5" fill="#2f72d8"/><circle cx="595" cy="144" r="3.5" fill="#2f72d8"/><text x="562" y="168" font-size="14" fill="#1d1f22" font-weight="600">Admin</text><text x="562" y="184" font-size="11.5" fill="#5c6168">also tokens, Settings</text><g fill="none" stroke="#5c6168" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M562 204q8 -8 16 0q-8 8 -16 0"/><path d="M562 211l16 -14"/></g><text x="586" y="208" font-size="11.5" fill="#5c6168">sees values masked</text><path d="M454 118V164" fill="none" stroke="#1f3d73" stroke-width="2" stroke-dasharray="5 4"/><circle cx="454" cy="164" r="4" fill="#1f3d73"/><rect x="352" y="66" width="204" height="52" rx="10" fill="#1f3d73" fill-opacity="0.1" stroke="#1f3d73" stroke-width="2"/><g fill="none" stroke="#1f3d73" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="376" cy="92" r="5"/><path d="M381 92h9M387 92v4M390 92v3"/></g><text x="408" y="88" font-size="13" fill="#1d1f22" font-weight="600">Unmask grant</text><text x="408" y="105" font-size="11.5" fill="#1d1f22">sees sensitive values</text><path d="M24 322 L708 322" fill="none" stroke="#5c6168" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#a5c6168)"/><text x="710" y="342" font-size="11.5" fill="#5c6168" text-anchor="end">more each role can do</text></svg>
