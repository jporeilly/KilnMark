<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 462" width="760" height="462" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="The Library keeps samples apart from your own work"><title>The Library keeps samples apart from your own work</title><defs><marker id="ae8663d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e8663d"/></marker><marker id="a17a179" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17a179"/></marker><marker id="a2f72d8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f72d8"/></marker></defs><rect x="0" y="0" width="760" height="462" rx="0" fill="#ffffff"/><text x="24" y="34" font-size="16" fill="#1d1f22" font-weight="650">The Library keeps samples apart from your own work</text><text x="24" y="55" font-size="12" fill="#5c6168">Samples stay in the Library; a template, once saved, becomes one of your own</text><rect x="24" y="76" width="712" height="96" rx="12" fill="#e8663d" fill-opacity="0.06"/><text x="40" y="95" font-size="10.5" fill="#e8663d" font-weight="700" letter-spacing="0.08em">SAMPLES</text><rect x="40" y="106" width="208" height="56" rx="8" fill="#e8663d" fill-opacity="0.08" stroke="#e8663d" stroke-width="1.25"/><circle cx="64" cy="134" r="10" fill="#e8663d" fill-opacity="0.16" stroke="#e8663d" stroke-width="1.25"/><text x="64" y="138" font-size="11" fill="#e8663d" font-weight="600" text-anchor="middle">1</text><text x="82" y="131" font-size="13" fill="#1d1f22" font-weight="600">Add samples</text><text x="82" y="148" font-size="11.5" fill="#5c6168">in the Library, Samples tab</text><rect x="276" y="106" width="208" height="56" rx="8" fill="#e8663d" fill-opacity="0.08" stroke="#e8663d" stroke-width="1.25"/><circle cx="300" cy="134" r="10" fill="#e8663d" fill-opacity="0.16" stroke="#e8663d" stroke-width="1.25"/><text x="300" y="138" font-size="11" fill="#e8663d" font-weight="600" text-anchor="middle">2</text><text x="318" y="131" font-size="13" fill="#1d1f22" font-weight="600">Marked as samples</text><text x="318" y="148" font-size="11.5" fill="#5c6168">they run like any other</text><rect x="512" y="106" width="208" height="56" rx="8" fill="#e8663d" fill-opacity="0.13" stroke="#e8663d" stroke-width="2"/><circle cx="538" cy="134" r="13" fill="#e8663d" fill-opacity="0.16" stroke="#e8663d" stroke-width="1.25"/><g fill="none" stroke="#e8663d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M538 129c-2 -2 -6 -2 -8 -1v12c2 -1 6 -1 8 1c2 -2 6 -2 8 -1v-12c-2 -1 -6 -1 -8 1z"/><path d="M538 129v12"/></g><text x="560" y="131" font-size="13" fill="#1d1f22" font-weight="600">Listed in the Library</text><text x="560" y="148" font-size="11.5" fill="#5c6168">with their last runs</text><path d="M248 134 L274 134" fill="none" stroke="#e8663d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ae8663d)"/><path d="M484 134 L510 134" fill="none" stroke="#e8663d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ae8663d)"/><rect x="24" y="188" width="712" height="96" rx="12" fill="#17a179" fill-opacity="0.06"/><text x="40" y="207" font-size="10.5" fill="#17a179" font-weight="700" letter-spacing="0.08em">TEMPLATES</text><rect x="40" y="218" width="208" height="56" rx="8" fill="#17a179" fill-opacity="0.08" stroke="#17a179" stroke-width="1.25"/><circle cx="64" cy="246" r="10" fill="#17a179" fill-opacity="0.16" stroke="#17a179" stroke-width="1.25"/><text x="64" y="250" font-size="11" fill="#17a179" font-weight="600" text-anchor="middle">1</text><text x="82" y="243" font-size="13" fill="#1d1f22" font-weight="600">Use this template</text><text x="82" y="260" font-size="11.5" fill="#5c6168">in the Library, Templates tab</text><rect x="276" y="218" width="208" height="56" rx="8" fill="#17a179" fill-opacity="0.08" stroke="#17a179" stroke-width="1.25"/><circle cx="300" cy="246" r="10" fill="#17a179" fill-opacity="0.16" stroke="#17a179" stroke-width="1.25"/><text x="300" y="250" font-size="11" fill="#17a179" font-weight="600" text-anchor="middle">2</text><text x="318" y="243" font-size="13" fill="#1d1f22" font-weight="600">Opens in the editor</text><text x="318" y="260" font-size="11.5" fill="#5c6168">name it; fill in each &lt;…&gt;</text><rect x="512" y="218" width="208" height="56" rx="8" fill="#17a179" fill-opacity="0.08" stroke="#17a179" stroke-width="1.25"/><circle cx="536" cy="246" r="10" fill="#17a179" fill-opacity="0.16" stroke="#17a179" stroke-width="1.25"/><text x="536" y="250" font-size="11" fill="#17a179" font-weight="600" text-anchor="middle">3</text><text x="554" y="243" font-size="13" fill="#1d1f22" font-weight="600">Save it</text><text x="554" y="260" font-size="11.5" fill="#5c6168">now yours, not marked</text><path d="M248 246 L274 246" fill="none" stroke="#17a179" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a17a179)"/><path d="M484 246 L510 246" fill="none" stroke="#17a179" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a17a179)"/><rect x="24" y="300" width="712" height="96" rx="12" fill="#2f72d8" fill-opacity="0.06"/><text x="40" y="319" font-size="10.5" fill="#2f72d8" font-weight="700" letter-spacing="0.08em">YOUR OWN WORK</text><rect x="276" y="330" width="444" height="56" rx="8" fill="#2f72d8" fill-opacity="0.13" stroke="#2f72d8" stroke-width="2"/><circle cx="302" cy="358" r="13" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><g fill="none" stroke="#2f72d8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M298 352l10 6l-10 6z"/></g><text x="324" y="355" font-size="13" fill="#1d1f22" font-weight="600">The Pipelines and Flows pages</text><text x="324" y="372" font-size="11.5" fill="#5c6168">only your team's own development and production work</text><path d="M616 274 L616 328" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><rect x="24" y="412" width="712" height="34" rx="8" fill="#efede7"/><g fill="none" stroke="#5c6168" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M44 424c-2 -2 -6 -2 -8 -1v12c2 -1 6 -1 8 1c2 -2 6 -2 8 -1v-12c-2 -1 -6 -1 -8 1z"/><path d="M44 424v12"/></g><text x="62" y="433.5" font-size="11.5" fill="#1d1f22">A sample never shows on the Pipelines or Flows page, and using a template never changes it.</text></svg>
