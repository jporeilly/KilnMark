<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Told once per problem, in Kilnmark and by email"><title>Told once per problem, in Kilnmark and by email</title><defs><marker id="ae8663d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e8663d"/></marker><marker id="a5c6168" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5c6168"/></marker></defs><rect x="0" y="0" width="760" height="380" rx="0" fill="#ffffff"/><text x="24" y="34" font-size="16" fill="#1d1f22" font-weight="650">Told once per problem, in Kilnmark and by email</text><text x="24" y="55" font-size="12" fill="#5c6168">You hear again only if it gets worse, and once more when it recovers</text><rect x="24" y="80" width="250" height="56" rx="8" fill="#e8663d" fill-opacity="0.08" stroke="#e8663d" stroke-width="1.25"/><circle cx="50" cy="108" r="13" fill="#e8663d" fill-opacity="0.16" stroke="#e8663d" stroke-width="1.25"/><g fill="none" stroke="#e8663d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M44 112v-4a6 6 0 0 1 12 0v4l2 2h-16z"/><path d="M48 116a2 2 0 0 0 4 0"/></g><text x="72" y="105" font-size="13" fill="#1d1f22" font-weight="600">Something happens</text><text x="72" y="122" font-size="11.5" fill="#5c6168">a rule fails, a run fails, drift…</text><path d="M274 108 L306 108" fill="none" stroke="#e8663d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ae8663d)"/><polygon points="308,108 388,72 468,108 388,144" fill="#efede7" stroke="#b4aea2" stroke-width="1.25"/><text x="388" y="104" font-size="12.5" fill="#1d1f22" font-weight="600" text-anchor="middle">New, or worse</text><text x="388" y="120" font-size="12.5" fill="#1d1f22" font-weight="600" text-anchor="middle">than before?</text><path d="M468 108 L530 108" fill="none" stroke="#5c6168" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#a5c6168)"/><text x="476" y="98" font-size="11.5" fill="#5c6168" text-anchor="start">no</text><rect x="532" y="84" width="204" height="48" rx="8" fill="#efede7" fill-opacity="1" stroke="#b4aea2" stroke-width="1.25"/><circle cx="558" cy="108" r="13" fill="#5c6168" fill-opacity="0.16" stroke="#5c6168" stroke-width="1.25"/><g fill="none" stroke="#5c6168" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M553 108l4 4l7 -8"/></g><text x="580" y="105" font-size="13" fill="#1d1f22" font-weight="600">Nothing new sent</text><text x="580" y="122" font-size="11.5" fill="#5c6168">told once per problem</text><path d="M388 144 L388 182" fill="none" stroke="#e8663d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ae8663d)"/><text x="396" y="168" font-size="11.5" fill="#e8663d" text-anchor="start">yes</text><rect x="240" y="184" width="296" height="56" rx="8" fill="#e8663d" fill-opacity="0.08" stroke="#e8663d" stroke-width="1.25"/><circle cx="266" cy="212" r="13" fill="#e8663d" fill-opacity="0.16" stroke="#e8663d" stroke-width="1.25"/><g fill="none" stroke="#e8663d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="266" cy="208.5" r="3.5"/><path d="M260 220a6 5 0 0 1 12 0"/></g><text x="288" y="209" font-size="13" fill="#1d1f22" font-weight="600">Everyone it concerns</text><text x="288" y="226" font-size="11.5" fill="#5c6168">whose choices include this kind and source</text><path d="M320 240 L320 256 L140 256 L140 282" fill="none" stroke="#e8663d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ae8663d)"/><path d="M456 240 L456 256 L612 256 L612 282" fill="none" stroke="#e8663d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ae8663d)"/><rect x="40" y="284" width="220" height="56" rx="8" fill="#e8663d" fill-opacity="0.13" stroke="#e8663d" stroke-width="2"/><circle cx="66" cy="312" r="13" fill="#e8663d" fill-opacity="0.16" stroke="#e8663d" stroke-width="1.25"/><g fill="none" stroke="#e8663d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M60 316v-4a6 6 0 0 1 12 0v4l2 2h-16z"/><path d="M64 320a2 2 0 0 0 4 0"/></g><text x="88" y="309" font-size="13" fill="#1d1f22" font-weight="600">In Kilnmark</text><text x="88" y="326" font-size="11.5" fill="#5c6168">Settings › Notifications</text><rect x="470" y="284" width="266" height="56" rx="8" fill="#2f72d8" fill-opacity="0.08" stroke="#2f72d8" stroke-width="1.25"/><circle cx="496" cy="312" r="13" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><g fill="none" stroke="#2f72d8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="488" y="306" width="16" height="12" rx="2"/><path d="M488 307l8 6l8 -6"/></g><text x="518" y="309" font-size="13" fill="#1d1f22" font-weight="600">By email, when it is on</text><text x="518" y="326" font-size="11.5" fill="#5c6168">confirmed, kind ticked, severity reached</text><text x="612" y="362" font-size="11.5" fill="#5c6168" text-anchor="middle">at once, or in the daily digest</text></svg>
