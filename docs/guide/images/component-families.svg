<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 574" width="760" height="574" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="The components a pipeline or flow is built from"><title>The components a pipeline or flow is built from</title><defs><marker id="a2f72d8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f72d8"/></marker><marker id="a1f3d73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f3d73"/></marker><marker id="a17a179" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17a179"/></marker><marker id="a7b55c7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7b55c7"/></marker></defs><rect x="0" y="0" width="760" height="574" rx="0" fill="#ffffff"/><text x="24" y="34" font-size="16" fill="#1d1f22" font-weight="650">The components a pipeline or flow is built from</text><text x="24" y="55" font-size="12" fill="#5c6168">Connectors reach the data, nodes do the work, expressions and rules check it, flow nodes order it</text><rect x="24" y="76" width="712" height="96" rx="12" fill="#1f3d73" fill-opacity="0.06"/><text x="40" y="95" font-size="10.5" fill="#1f3d73" font-weight="700" letter-spacing="0.08em">CONNECTORS</text><rect x="40" y="106" width="682" height="56" rx="8" fill="#1f3d73" fill-opacity="0.08" stroke="#1f3d73" stroke-width="1.25"/><circle cx="66" cy="134" r="13" fill="#1f3d73" fill-opacity="0.16" stroke="#1f3d73" stroke-width="1.25"/><g fill="none" stroke="#1f3d73" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="66" cy="129" rx="7" ry="3"/><path d="M59 129v10a7 3 0 0 0 14 0v-10"/><path d="M59 134a7 3 0 0 0 14 0"/></g><text x="88" y="131" font-size="13" fill="#1d1f22" font-weight="600">One per kind of source</text><text x="88" y="148" font-size="11.5" fill="#5c6168">databases, folders, object storage and the sample data: what each can scan, read, write and explore</text><rect x="24" y="188" width="712" height="96" rx="12" fill="#2f72d8" fill-opacity="0.06"/><text x="40" y="207" font-size="10.5" fill="#2f72d8" font-weight="700" letter-spacing="0.08em">PIPELINE NODES</text><rect x="40" y="218" width="160" height="56" rx="8" fill="#2f72d8" fill-opacity="0.08" stroke="#2f72d8" stroke-width="1.25"/><circle cx="66" cy="246" r="13" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><g fill="none" stroke="#2f72d8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="66" cy="241" rx="7" ry="3"/><path d="M59 241v10a7 3 0 0 0 14 0v-10"/><path d="M59 246a7 3 0 0 0 14 0"/></g><text x="88" y="243" font-size="13" fill="#1d1f22" font-weight="600">Source</text><text x="88" y="260" font-size="11.5" fill="#5c6168">read</text><rect x="214" y="218" width="160" height="56" rx="8" fill="#2f72d8" fill-opacity="0.08" stroke="#2f72d8" stroke-width="1.25"/><circle cx="240" cy="246" r="13" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><g fill="none" stroke="#2f72d8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="240" cy="246" r="3"/><circle cx="240" cy="246" r="7" stroke-dasharray="3 2.5"/></g><text x="262" y="243" font-size="13" fill="#1d1f22" font-weight="600">Transforms</text><text x="262" y="260" font-size="11.5" fill="#5c6168">filter, compute, ...</text><rect x="388" y="218" width="160" height="56" rx="8" fill="#2f72d8" fill-opacity="0.08" stroke="#2f72d8" stroke-width="1.25"/><circle cx="414" cy="246" r="13" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><g fill="none" stroke="#2f72d8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M414 238l7 3v5c0 4 -3 7 -7 8c-4 -1 -7 -4 -7 -8v-5z"/></g><text x="436" y="243" font-size="13" fill="#1d1f22" font-weight="600">Gate</text><text x="436" y="260" font-size="11.5" fill="#5c6168">checks rows</text><rect x="562" y="218" width="160" height="56" rx="8" fill="#2f72d8" fill-opacity="0.08" stroke="#2f72d8" stroke-width="1.25"/><circle cx="588" cy="246" r="13" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><g fill="none" stroke="#2f72d8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="581" y="239" width="14" height="14" rx="2"/><path d="M584 239v4h8v-4M584 253v-5h8v5"/></g><text x="610" y="243" font-size="13" fill="#1d1f22" font-weight="600">Sink</text><text x="610" y="260" font-size="11.5" fill="#5c6168">write</text><path d="M200 246 L212 246" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><path d="M374 246 L386 246" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><path d="M548 246 L560 246" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><path d="M170 162 L170 216" fill="none" stroke="#1f3d73" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a1f3d73)"/><text x="178" y="181" font-size="11.5" fill="#1f3d73" text-anchor="start">reads</text><path d="M642 216 L642 164" fill="none" stroke="#1f3d73" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a1f3d73)"/><text x="650" y="181" font-size="11.5" fill="#1f3d73" text-anchor="start">writes</text><rect x="24" y="300" width="712" height="96" rx="12" fill="#17a179" fill-opacity="0.06"/><text x="40" y="319" font-size="10.5" fill="#17a179" font-weight="700" letter-spacing="0.08em">WHAT NODES CHECK WITH</text><rect x="214" y="330" width="160" height="56" rx="8" fill="#17a179" fill-opacity="0.08" stroke="#17a179" stroke-width="1.25"/><circle cx="240" cy="358" r="13" fill="#17a179" fill-opacity="0.16" stroke="#17a179" stroke-width="1.25"/><g fill="none" stroke="#17a179" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M234 364l1 -4l8 -8l3 3l-8 8z"/></g><text x="262" y="355" font-size="13" fill="#1d1f22" font-weight="600">Expressions</text><text x="262" y="372" font-size="11.5" fill="#5c6168">conditions, values</text><rect x="388" y="330" width="160" height="56" rx="8" fill="#17a179" fill-opacity="0.08" stroke="#17a179" stroke-width="1.25"/><circle cx="414" cy="358" r="13" fill="#17a179" fill-opacity="0.16" stroke="#17a179" stroke-width="1.25"/><g fill="none" stroke="#17a179" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M409 358l4 4l7 -8"/></g><text x="436" y="355" font-size="13" fill="#1d1f22" font-weight="600">Quality rules</text><text x="436" y="372" font-size="11.5" fill="#5c6168">what must hold</text><path d="M294 328 L294 276" fill="none" stroke="#17a179" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a17a179)"/><path d="M468 328 L468 276" fill="none" stroke="#17a179" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a17a179)"/><rect x="24" y="412" width="712" height="96" rx="12" fill="#7b55c7" fill-opacity="0.06"/><text x="40" y="431" font-size="10.5" fill="#7b55c7" font-weight="700" letter-spacing="0.08em">FLOW NODES</text><rect x="40" y="442" width="208" height="56" rx="8" fill="#7b55c7" fill-opacity="0.08" stroke="#7b55c7" stroke-width="1.25"/><circle cx="66" cy="470" r="13" fill="#7b55c7" fill-opacity="0.16" stroke="#7b55c7" stroke-width="1.25"/><g fill="none" stroke="#7b55c7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M62 464l10 6l-10 6z"/></g><text x="88" y="467" font-size="13" fill="#1d1f22" font-weight="600">Run the work</text><text x="88" y="484" font-size="11.5" fill="#5c6168">run-pipeline, for-each, sql</text><rect x="276" y="442" width="208" height="56" rx="8" fill="#7b55c7" fill-opacity="0.08" stroke="#7b55c7" stroke-width="1.25"/><circle cx="302" cy="470" r="13" fill="#7b55c7" fill-opacity="0.16" stroke="#7b55c7" stroke-width="1.25"/><g fill="none" stroke="#7b55c7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="302" cy="470" r="7"/><path d="M302 466v4l3 2"/></g><text x="324" y="467" font-size="13" fill="#1d1f22" font-weight="600">Check and wait</text><text x="324" y="484" font-size="11.5" fill="#5c6168">check-source, wait-for, wait</text><rect x="512" y="442" width="208" height="56" rx="8" fill="#7b55c7" fill-opacity="0.08" stroke="#7b55c7" stroke-width="1.25"/><circle cx="538" cy="470" r="13" fill="#7b55c7" fill-opacity="0.16" stroke="#7b55c7" stroke-width="1.25"/><g fill="none" stroke="#7b55c7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M532 474v-4a6 6 0 0 1 12 0v4l2 2h-16z"/><path d="M536 478a2 2 0 0 0 4 0"/></g><text x="560" y="467" font-size="13" fill="#1d1f22" font-weight="600">Tell and end</text><text x="560" y="484" font-size="11.5" fill="#5c6168">notify, stop</text><path d="M248 470 L274 470" fill="none" stroke="#7b55c7" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a7b55c7)"/><path d="M484 470 L510 470" fill="none" stroke="#7b55c7" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a7b55c7)"/><rect x="24" y="524" width="712" height="34" rx="8" fill="#efede7"/><g fill="none" stroke="#5c6168" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M44 536c-2 -2 -6 -2 -8 -1v12c2 -1 6 -1 8 1c2 -2 6 -2 8 -1v-12c-2 -1 -6 -1 -8 1z"/><path d="M44 536v12"/></g><text x="62" y="545.5" font-size="11.5" fill="#1d1f22">Every settings table in the reference is made from the catalogue the server uses, and the build checks it.</text></svg>
