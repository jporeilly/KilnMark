<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 384" width="760" height="384" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="A gate decides what happens to each row that fails its rules"><title>A gate decides what happens to each row that fails its rules</title><defs><marker id="ab4aea2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b4aea2"/></marker><marker id="a1c9a3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1c9a3b"/></marker><marker id="ad23f3f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d23f3f"/></marker><marker id="ac08217" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c08217"/></marker><marker id="a2f72d8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f72d8"/></marker></defs><rect x="0" y="0" width="760" height="384" rx="0" fill="#ffffff"/><text x="24" y="34" font-size="16" fill="#1d1f22" font-weight="650">A gate decides what happens to each row that fails its rules</text><text x="24" y="55" font-size="12" fill="#5c6168">on_fail is set on the gate: stop (the default), quarantine or warn</text><rect x="24" y="140" width="120" height="56" rx="8" fill="#2f72d8" fill-opacity="0.08" stroke="#2f72d8" stroke-width="1.25"/><circle cx="50" cy="168" r="13" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><g fill="none" stroke="#2f72d8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="50" cy="163" rx="7" ry="3"/><path d="M43 163v10a7 3 0 0 0 14 0v-10"/><path d="M43 168a7 3 0 0 0 14 0"/></g><text x="72" y="165" font-size="13" fill="#1d1f22" font-weight="600">Rows</text><text x="72" y="182" font-size="11.5" fill="#5c6168">from the read</text><path d="M144 168 L194 168" fill="none" stroke="#b4aea2" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ab4aea2)"/><polygon points="196,168 254,124 312,168 254,212" fill="#efede7" stroke="#b4aea2" stroke-width="1.25"/><text x="254" y="164" font-size="12.5" fill="#1d1f22" font-weight="600" text-anchor="middle">Does the row</text><text x="254" y="180" font-size="12.5" fill="#1d1f22" font-weight="600" text-anchor="middle">pass its rules?</text><path d="M312 168 L356 168 L356 96 L404 96" fill="none" stroke="#1c9a3b" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a1c9a3b)"/><rect x="406" y="68" width="330" height="56" rx="8" fill="#1c9a3b" fill-opacity="0.13" stroke="#1c9a3b" stroke-width="2"/><circle cx="432" cy="96" r="13" fill="#1c9a3b" fill-opacity="0.16" stroke="#1c9a3b" stroke-width="1.25"/><g fill="none" stroke="#1c9a3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M427 96l4 4l7 -8"/></g><text x="454" y="93" font-size="13" fill="#1d1f22" font-weight="600">Passes</text><text x="454" y="110" font-size="11.5" fill="#5c6168">on to the next node, through out</text><path d="M312 168 L356 168 L356 168 L404 168" fill="none" stroke="#d23f3f" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#ad23f3f)"/><rect x="406" y="140" width="330" height="56" rx="8" fill="#d23f3f" fill-opacity="0.08" stroke="#d23f3f" stroke-width="1.25"/><circle cx="432" cy="168" r="13" fill="#d23f3f" fill-opacity="0.16" stroke="#d23f3f" stroke-width="1.25"/><g fill="none" stroke="#d23f3f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M426 162l12 12M438 162l-12 12"/></g><text x="454" y="165" font-size="13" fill="#1d1f22" font-weight="600">on_fail: stop</text><text x="454" y="182" font-size="11.5" fill="#5c6168">the run fails; writes after the gate do not commit</text><path d="M312 168 L356 168 L356 240 L404 240" fill="none" stroke="#c08217" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#ac08217)"/><rect x="406" y="212" width="330" height="56" rx="8" fill="#c08217" fill-opacity="0.08" stroke="#c08217" stroke-width="1.25"/><circle cx="432" cy="240" r="13" fill="#c08217" fill-opacity="0.16" stroke="#c08217" stroke-width="1.25"/><g fill="none" stroke="#c08217" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M424 234h16l-6 7v6l-4 2v-8z"/></g><text x="454" y="237" font-size="13" fill="#1d1f22" font-weight="600">on_fail: quarantine</text><text x="454" y="254" font-size="11.5" fill="#5c6168">set aside on quarantine; the run goes on</text><path d="M312 168 L356 168 L356 312 L404 312" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#a2f72d8)"/><rect x="406" y="284" width="330" height="56" rx="8" fill="#2f72d8" fill-opacity="0.08" stroke="#2f72d8" stroke-width="1.25"/><circle cx="432" cy="312" r="13" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><g fill="none" stroke="#2f72d8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M424 312q8 -8 16 0q-8 8 -16 0"/><circle cx="432" cy="312" r="2.5"/></g><text x="454" y="309" font-size="13" fill="#1d1f22" font-weight="600">on_fail: warn</text><text x="454" y="326" font-size="11.5" fill="#5c6168">goes on through out; recorded with the run</text><text x="366" y="86" font-size="11.5" fill="#1c9a3b" text-anchor="start">yes</text><text x="366" y="208" font-size="11.5" fill="#5c6168" text-anchor="start">no:</text><text x="366" y="224" font-size="11.5" fill="#5c6168" text-anchor="start">on_fail</text></svg>
