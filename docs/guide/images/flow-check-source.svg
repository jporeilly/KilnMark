<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="What a check-source node does"><title>What a check-source node does</title><defs><marker id="a2f72d8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f72d8"/></marker><marker id="ad23f3f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d23f3f"/></marker><marker id="a1c9a3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1c9a3b"/></marker></defs><rect x="0" y="0" width="760" height="400" rx="0" fill="#ffffff"/><text x="24" y="34" font-size="16" fill="#1d1f22" font-weight="650">What a check-source node does</text><text x="24" y="55" font-size="12" fill="#5c6168">Before the work starts: can the source be reached, and is everything it needs there?</text><rect x="40" y="68" width="230" height="56" rx="8" fill="#2f72d8" fill-opacity="0.08" stroke="#2f72d8" stroke-width="1.25"/><circle cx="64" cy="96" r="10" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><text x="64" y="100" font-size="11" fill="#2f72d8" font-weight="600" text-anchor="middle">1</text><text x="82" y="93" font-size="13" fill="#1d1f22" font-weight="600">Connect</text><text x="82" y="110" font-size="11.5" fill="#5c6168">as the source's Test does</text><path d="M270 96 L318 96" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><rect x="320" y="68" width="230" height="56" rx="8" fill="#2f72d8" fill-opacity="0.08" stroke="#2f72d8" stroke-width="1.25"/><circle cx="344" cy="96" r="10" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><text x="344" y="100" font-size="11" fill="#2f72d8" font-weight="600" text-anchor="middle">2</text><text x="362" y="93" font-size="13" fill="#1d1f22" font-weight="600">Look up each name</text><text x="362" y="110" font-size="11.5" fill="#5c6168">names and columns, no rows</text><path d="M550 96 L598 96" fill="none" stroke="#2f72d8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a2f72d8)"/><rect x="600" y="68" width="136" height="56" rx="8" fill="#1c9a3b" fill-opacity="0.13" stroke="#1c9a3b" stroke-width="2"/><circle cx="626" cy="96" r="13" fill="#1c9a3b" fill-opacity="0.16" stroke="#1c9a3b" stroke-width="1.25"/><g fill="none" stroke="#1c9a3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M621 96l4 4l7 -8"/></g><text x="648" y="93" font-size="13" fill="#1d1f22" font-weight="600">All there</text><text x="648" y="110" font-size="11.5" fill="#5c6168">missing: 0</text><path d="M155 124 L155 166" fill="none" stroke="#d23f3f" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#ad23f3f)"/><text x="165" y="148" font-size="11.5" fill="#d23f3f" text-anchor="start">cannot reach it</text><rect x="40" y="168" width="230" height="56" rx="8" fill="#d23f3f" fill-opacity="0.08" stroke="#d23f3f" stroke-width="1.25"/><circle cx="66" cy="196" r="13" fill="#d23f3f" fill-opacity="0.16" stroke="#d23f3f" stroke-width="1.25"/><g fill="none" stroke="#d23f3f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M60 190l12 12M72 190l-12 12"/></g><text x="88" y="193" font-size="13" fill="#1d1f22" font-weight="600">Fails</text><text x="88" y="210" font-size="11.5" fill="#5c6168">&quot;Could not reach warehouse&quot;</text><path d="M435 124 L435 166" fill="none" stroke="#d23f3f" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#ad23f3f)"/><text x="445" y="148" font-size="11.5" fill="#d23f3f" text-anchor="start">some not there: missing 2</text><rect x="320" y="168" width="260" height="56" rx="8" fill="#d23f3f" fill-opacity="0.08" stroke="#d23f3f" stroke-width="1.25"/><circle cx="346" cy="196" r="13" fill="#d23f3f" fill-opacity="0.16" stroke="#d23f3f" stroke-width="1.25"/><g fill="none" stroke="#d23f3f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M340 190l12 12M352 190l-12 12"/></g><text x="368" y="193" font-size="13" fill="#1d1f22" font-weight="600">Fails, naming them</text><text x="368" y="210" font-size="11.5" fill="#5c6168">&quot;2 of 3 tables are missing ...&quot;</text><path d="M668 124 L668 266" fill="none" stroke="#1c9a3b" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a1c9a3b)"/><text x="678" y="216" font-size="11.5" fill="#1c9a3b" text-anchor="start">next node</text><path d="M155 224 L155 294 L300 294" fill="none" stroke="#d23f3f" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ad23f3f)"/><path d="M528 224 L528 294 L442 294" fill="none" stroke="#d23f3f" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ad23f3f)"/><rect x="302" y="266" width="140" height="56" rx="8" fill="#d23f3f" fill-opacity="0.08" stroke="#d23f3f" stroke-width="1.25"/><circle cx="328" cy="294" r="13" fill="#d23f3f" fill-opacity="0.16" stroke="#d23f3f" stroke-width="1.25"/><g fill="none" stroke="#d23f3f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M322 298v-4a6 6 0 0 1 12 0v4l2 2h-16z"/><path d="M326 302a2 2 0 0 0 4 0"/></g><text x="350" y="291" font-size="13" fill="#1d1f22" font-weight="600">failure</text><text x="350" y="308" font-size="11.5" fill="#5c6168">a notice, a stop</text><rect x="600" y="266" width="136" height="56" rx="8" fill="#1c9a3b" fill-opacity="0.08" stroke="#1c9a3b" stroke-width="1.25"/><circle cx="626" cy="294" r="13" fill="#1c9a3b" fill-opacity="0.16" stroke="#1c9a3b" stroke-width="1.25"/><g fill="none" stroke="#1c9a3b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M622 288l10 6l-10 6z"/></g><text x="648" y="291" font-size="13" fill="#1d1f22" font-weight="600">The work</text><text x="648" y="308" font-size="11.5" fill="#5c6168">runs</text><rect x="24" y="348" width="712" height="34" rx="8" fill="#efede7"/><g fill="none" stroke="#5c6168" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M44 357l7 3v5c0 4 -3 7 -7 8c-4 -1 -7 -4 -7 -8v-5z"/></g><text x="62" y="369.5" font-size="11.5" fill="#1d1f22">Its messages name only what the flow wrote: never the source's settings or its driver's words.</text></svg>
