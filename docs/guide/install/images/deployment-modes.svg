<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 570" width="760" height="570" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="The two deployment modes"><title>The two deployment modes</title><defs><marker id="a1f3d73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f3d73"/></marker><marker id="ad23f3f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d23f3f"/></marker></defs><rect x="0" y="0" width="760" height="570" rx="0" fill="#ffffff"/><text x="24" y="34" font-size="16" fill="#1d1f22" font-weight="650">The two deployment modes</text><text x="24" y="55" font-size="12" fill="#5c6168">Chosen once at install: what each signs in with and what it holds</text><rect x="24" y="76" width="712" height="56" rx="8" fill="#1f3d73" fill-opacity="0.13" stroke="#1f3d73" stroke-width="2"/><circle cx="50" cy="104" r="13" fill="#1f3d73" fill-opacity="0.16" stroke="#1f3d73" stroke-width="1.25"/><g fill="none" stroke="#1f3d73" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M44 99l4 4l-4 4"/><path d="M51 108h6"/></g><text x="72" y="101" font-size="13" fill="#1d1f22" font-weight="600">install sets KILNMARK_MODE once; Kilnmark records it at its first start</text><text x="72" y="118" font-size="11.5" fill="#5c6168">production by default, starter-pack with --starter; editing .env never changes it</text><path d="M194 132 L194 164" fill="none" stroke="#1f3d73" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a1f3d73)"/><path d="M566 132 L566 164" fill="none" stroke="#1f3d73" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#a1f3d73)"/><rect x="24" y="166" width="340" height="340" rx="12" fill="#2f72d8" fill-opacity="0.06"/><text x="40" y="185" font-size="10.5" fill="#2f72d8" font-weight="700" letter-spacing="0.08em">PRODUCTION: FOR REAL WORK</text><rect x="396" y="166" width="340" height="340" rx="12" fill="#e8663d" fill-opacity="0.06"/><text x="412" y="185" font-size="10.5" fill="#e8663d" font-weight="700" letter-spacing="0.08em">STARTER PACK: TRAINING AND DEVELOPMENT</text><text x="194" y="202" font-size="11.5" fill="#5c6168" text-anchor="middle">Sign-in, one of:</text><rect x="38" y="212" width="312" height="52" rx="8" fill="#2f72d8" fill-opacity="0.08" stroke="#2f72d8" stroke-width="1.25"/><circle cx="64" cy="238" r="13" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><g fill="none" stroke="#2f72d8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M64 230l7 3v5c0 4 -3 7 -7 8c-4 -1 -7 -4 -7 -8v-5z"/></g><text x="86" y="235" font-size="13" fill="#1d1f22" font-weight="600">Your organisation's own provider</text><text x="86" y="252" font-size="11.5" fill="#5c6168">recommended for regulated organisations</text><rect x="38" y="280" width="312" height="52" rx="8" fill="#2f72d8" fill-opacity="0.08" stroke="#2f72d8" stroke-width="1.25"/><circle cx="64" cy="306" r="13" fill="#2f72d8" fill-opacity="0.16" stroke="#2f72d8" stroke-width="1.25"/><g fill="none" stroke="#2f72d8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="64" cy="302.5" r="3.5"/><path d="M58 314a6 5 0 0 1 12 0"/></g><text x="86" y="303" font-size="13" fill="#1d1f22" font-weight="600">Kilnmark's own Keycloak, or tokens only</text><text x="86" y="320" font-size="11.5" fill="#5c6168">people add and import with the Keycloak</text><rect x="38" y="348" width="312" height="52" rx="8" fill="#d23f3f" fill-opacity="0.08" stroke="#d23f3f" stroke-width="1.25"/><circle cx="64" cy="374" r="13" fill="#d23f3f" fill-opacity="0.16" stroke="#d23f3f" stroke-width="1.25"/><g fill="none" stroke="#d23f3f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M58 368l12 12M70 368l-12 12"/></g><text x="86" y="371" font-size="13" fill="#1d1f22" font-weight="600">No samples database, no example people</text><text x="86" y="388" font-size="11.5" fill="#5c6168">the pack refused; their sign-ins refused</text><text x="566" y="202" font-size="11.5" fill="#5c6168" text-anchor="middle">Sign-in:</text><rect x="410" y="212" width="312" height="52" rx="8" fill="#e8663d" fill-opacity="0.08" stroke="#e8663d" stroke-width="1.25"/><circle cx="436" cy="238" r="13" fill="#e8663d" fill-opacity="0.16" stroke="#e8663d" stroke-width="1.25"/><g fill="none" stroke="#e8663d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="436" cy="234.5" r="3.5"/><path d="M430 246a6 5 0 0 1 12 0"/></g><text x="458" y="235" font-size="13" fill="#1d1f22" font-weight="600">Kilnmark's own Keycloak, always</text><text x="458" y="252" font-size="11.5" fill="#5c6168">never an outside provider: it does not start</text><rect x="410" y="280" width="312" height="52" rx="8" fill="#e8663d" fill-opacity="0.13" stroke="#e8663d" stroke-width="2"/><circle cx="436" cy="306" r="13" fill="#e8663d" fill-opacity="0.16" stroke="#e8663d" stroke-width="1.25"/><g fill="none" stroke="#e8663d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="436" cy="301" rx="7" ry="3"/><path d="M429 301v10a7 3 0 0 0 14 0v-10"/><path d="M429 306a7 3 0 0 0 14 0"/></g><text x="458" y="303" font-size="13" fill="#1d1f22" font-weight="600">The samples database, kilnmark_samples</text><text x="458" y="320" font-size="11.5" fill="#5c6168">an admin turns the example data on and off</text><rect x="410" y="348" width="312" height="52" rx="8" fill="#e8663d" fill-opacity="0.13" stroke="#e8663d" stroke-width="2"/><circle cx="436" cy="374" r="13" fill="#e8663d" fill-opacity="0.16" stroke="#e8663d" stroke-width="1.25"/><g fill="none" stroke="#e8663d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="436" cy="370.5" r="3.5"/><path d="M430 382a6 5 0 0 1 12 0"/></g><text x="458" y="371" font-size="13" fill="#1d1f22" font-weight="600">Five example people</text><text x="458" y="388" font-size="11.5" fill="#5c6168">made by starter people, at kilnmark.com</text><text x="194" y="416" font-size="11.5" fill="#1c9a3b" text-anchor="middle">Templates on both</text><text x="566" y="416" font-size="11.5" fill="#1c9a3b" text-anchor="middle">Templates on both</text><path d="M400 462 L366 462" fill="none" stroke="#d23f3f" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#ad23f3f)"/><rect x="38" y="438" width="312" height="48" rx="8" fill="#d23f3f" fill-opacity="0.08" stroke="#d23f3f" stroke-width="1.25"/><g fill="none" stroke="#d23f3f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M58 456l12 12M70 456l-12 12"/></g><text x="86" y="458" font-size="13" fill="#1d1f22" font-weight="600">Started as production: refused</text><text x="86" y="475" font-size="11.5" fill="#5c6168">never converted; install afresh for production</text><rect x="410" y="438" width="312" height="48" rx="8" fill="#e8663d" fill-opacity="0.08" stroke="#e8663d" stroke-width="1.25"/><text x="426" y="458" font-size="13" fill="#1d1f22" font-weight="600">A Starter Pack install, as recorded</text><text x="426" y="475" font-size="11.5" fill="#5c6168">only a new database records a mode</text><rect x="24" y="520" width="712" height="34" rx="8" fill="#efede7"/><g fill="none" stroke="#5c6168" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="37" y="535" width="14" height="10" rx="2"/><path d="M40 535v-3a4 4 0 0 1 8 0v3"/></g><text x="62" y="541.5" font-size="11.5" fill="#1d1f22">Either way round, a start whose KILNMARK_MODE differs from the record is refused, saying what to do.</text></svg>
