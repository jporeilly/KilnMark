[versions]
quarkus = "3.40.1"
arrow = "19.0.0"
datasketches = "9.0.0"
postgresql = "42.7.14"
mssql-jdbc = "13.6.1.jre11"
# MySQL and MariaDB (LGPL-2.1-or-later, used unmodified; ADR 0007). Never MySQL Connector/J (GPL).
mariadb-java-client = "3.5.11"
# Oracle's JDBC driver, for tests only: it is under the Oracle Free Use Terms and Conditions, which
# do not allow it in a product that is sold, so it never ships; customers install it (ADR 0007).
# Keep in step with OracleConnector.DRIVER.
ojdbc11 = "23.26.4.0.0"
# H2 (MPL 2.0 or EPL 1.0, not GPL), for tests only: the generic JDBC connector's tests register it
# as an admin would register a customer's driver. It never ships (checkNoCustomerDrivers).
h2 = "2.5.252"
junit = "5.14.4"
testcontainers = "2.0.5"
hardwood = "1.0.1.Final"
zstd-jni = "1.5.7-16"
snappy-java = "1.1.10.12"
lz4-java = "1.12.1"
jackson = "2.22.4"
awssdk = "2.57.8"
# AI runtime (ADR 0016)
langchain4j = "1.22.0"
tika = "3.3.3"
poi = "5.5.1"
# The Quarkus platform pins mime4j for the server; the plug-ins and their tests use the same version.
mime4j = "0.8.15"
json-schema-validator = "1.5.9"
# Pipeline YAML (docs/design/pipelines.md): YAML 1.2, safe by default, Apache-2.0
snakeyaml-engine = "3.2"
greenmail = "2.1.15"

[libraries]
quarkus-bom = { module = "io.quarkus.platform:quarkus-bom", version.ref = "quarkus" }
arrow-vector = { module = "org.apache.arrow:arrow-vector", version.ref = "arrow" }
arrow-memory-netty = { module = "org.apache.arrow:arrow-memory-netty", version.ref = "arrow" }
arrow-memory-unsafe = { module = "org.apache.arrow:arrow-memory-unsafe", version.ref = "arrow" }
arrow-jdbc = { module = "org.apache.arrow:arrow-jdbc", version.ref = "arrow" }
datasketches = { module = "org.apache.datasketches:datasketches-java", version.ref = "datasketches" }
hardwood = { module = "dev.hardwood:hardwood-core", version.ref = "hardwood" }
zstd-jni = { module = "com.github.luben:zstd-jni", version.ref = "zstd-jni" }
lz4-java = { module = "at.yawk.lz4:lz4-java", version.ref = "lz4-java" }
snappy-java = { module = "org.xerial.snappy:snappy-java", version.ref = "snappy-java" }
jackson-core = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "jackson" }
awssdk-s3 = { module = "software.amazon.awssdk:s3", version.ref = "awssdk" }
awssdk-url-connection-client = { module = "software.amazon.awssdk:url-connection-client", version.ref = "awssdk" }
# AI runtime (ADR 0016): LangChain4j provider modules, and the MCP server through the Quarkus platform
langchain4j-open-ai = { module = "dev.langchain4j:langchain4j-open-ai", version.ref = "langchain4j" }
langchain4j-anthropic = { module = "dev.langchain4j:langchain4j-anthropic", version.ref = "langchain4j" }
langchain4j-google-ai-gemini = { module = "dev.langchain4j:langchain4j-google-ai-gemini", version.ref = "langchain4j" }
quarkus-mcp-server-bom = { module = "io.quarkus.platform:quarkus-mcp-server-bom", version.ref = "quarkus" }
tika-core = { module = "org.apache.tika:tika-core", version.ref = "tika" }
tika-parser-pdf = { module = "org.apache.tika:tika-parser-pdf-module", version.ref = "tika" }
tika-parser-microsoft = { module = "org.apache.tika:tika-parser-microsoft-module", version.ref = "tika" }
tika-parser-mail = { module = "org.apache.tika:tika-parser-mail-module", version.ref = "tika" }
tika-parser-miscoffice = { module = "org.apache.tika:tika-parser-miscoffice-module", version.ref = "tika" }
mime4j-core = { module = "org.apache.james:apache-mime4j-core", version.ref = "mime4j" }
mime4j-dom = { module = "org.apache.james:apache-mime4j-dom", version.ref = "mime4j" }
poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "poi" }
poi-ooxml-lite = { module = "org.apache.poi:poi-ooxml-lite", version.ref = "poi" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
mssql-jdbc = { module = "com.microsoft.sqlserver:mssql-jdbc", version.ref = "mssql-jdbc" }
mariadb-java-client = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb-java-client" }
ojdbc11 = { module = "com.oracle.database.jdbc:ojdbc11", version.ref = "ojdbc11" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
testcontainers-mssqlserver = { module = "org.testcontainers:testcontainers-mssqlserver", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers" }
snakeyaml-engine = { module = "org.snakeyaml:snakeyaml-engine", version.ref = "snakeyaml-engine" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }
greenmail = { module = "com.icegreen:greenmail", version.ref = "greenmail" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
quarkus = { id = "io.quarkus", version.ref = "quarkus" }
