# Kilnmark, small topology: two containers on one Linux VM.
# Works with Podman (podman compose up --build) and Docker (docker compose up --build).
# Build the server first: ./gradlew :server:quarkusBuild
services:
  postgres:
    build:
      context: containers/postgres
      dockerfile: Containerfile
    environment:
      POSTGRES_DB: kilnmark
      POSTGRES_USER: kilnmark
      POSTGRES_PASSWORD: ${KILNMARK_DB_PASSWORD:-kilnmark}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kilnmark -d kilnmark"]
      interval: 5s
      retries: 20
    ports:
      # Published on 5442 so it never clashes with another PostgreSQL on this machine
      # (a Pentaho repository often uses 5432). Change with KILNMARK_DB_PORT.
      - "${KILNMARK_DB_PORT:-5442}:5432"

  kilnmark:
    build:
      context: .
      dockerfile: containers/server/Containerfile
    environment:
      KILNMARK_ROLES: api,scheduler,worker
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/kilnmark
      QUARKUS_DATASOURCE_USERNAME: kilnmark
      QUARKUS_DATASOURCE_PASSWORD: ${KILNMARK_DB_PASSWORD:-kilnmark}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach databases on this machine (Podman also has host.containers.internal)
    volumes:
      - keys:/var/lib/kilnmark     # the key for stored source passwords: back it up apart from pgdata
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # 8780, not 8080, which Pentaho and Tomcat use. Change the host side with KILNMARK_PORT.
      - "${KILNMARK_PORT:-8780}:8780"

volumes:
  pgdata:
  keys:
