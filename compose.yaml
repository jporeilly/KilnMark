# Kilnmark, small topology: two containers on one Linux VM.
# Works with Podman (podman compose up --build) and Docker (docker compose up --build).
# Build the server first: ./gradlew release
# If a compose tool cannot build (podman-compose on Windows, for example), build the two images
# by hand, then start without --build:
#   podman build -t localhost/kilnmark-postgres:dev -f containers/postgres/Containerfile containers/postgres
#   podman build -t localhost/kilnmark-server:dev -f containers/server/Containerfile .
#   podman compose up
services:
  postgres:
    image: localhost/kilnmark-postgres:dev
    build:
      context: containers/postgres
      dockerfile: Containerfile
    environment:
      POSTGRES_DB: kilnmark
      POSTGRES_USER: kilnmark
      POSTGRES_PASSWORD: ${KILNMARK_DB_PASSWORD:-kilnmark}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kilnmark -d kilnmark"]
      interval: 5s
      retries: 20
    ports:
      # Published on 5442 so it never clashes with another PostgreSQL on this machine
      # (a Pentaho repository often uses 5432). Change with KILNMARK_DB_PORT.
      - "${KILNMARK_DB_PORT:-5442}:5432"

  kilnmark:
    image: localhost/kilnmark-server:dev
    build:
      context: .
      dockerfile: containers/server/Containerfile
    environment:
      KILNMARK_ROLES: api,scheduler,worker
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/kilnmark
      QUARKUS_DATASOURCE_USERNAME: kilnmark
      QUARKUS_DATASOURCE_PASSWORD: ${KILNMARK_DB_PASSWORD:-kilnmark}
      # Optional admin API token (km_ + 43 or more base64url characters). Unset, the first start
      # writes one to /var/lib/kilnmark/admin-token in the keys volume.
      KILNMARK_ADMIN_TOKEN: ${KILNMARK_ADMIN_TOKEN:-}
      # Folders that folder sources may read. The share below is mounted here read-only.
      KILNMARK_FILES_ROOTS: /srv/files
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach databases on this machine (Podman also has host.containers.internal)
    volumes:
      - keys:/var/lib/kilnmark     # the key for stored source passwords: back it up apart from pgdata
      # A folder to scan, read-only; by default the reference lab's file share. In Kilnmark,
      # add a source of kind files with path /srv/files. Point KILNMARK_FILES_DIR at your own folder.
      - ${KILNMARK_FILES_DIR:-./lab/files/share}:/srv/files:ro,Z
    depends_on:
      postgres:
        condition: service_healthy
    # On stop, running scans get 30 s to finish and 15 s to hand back to the queue
    # (kilnmark.worker.shutdown-timeout); the default 10 s would cut them off.
    stop_grace_period: 60s
    ports:
      # 8780, not 8080, which Pentaho and Tomcat use. Change the host side with KILNMARK_PORT.
      - "${KILNMARK_PORT:-8780}:8780"

# A fixed network name, so the reference lab (lab/compose.yaml) can join it and Kilnmark reaches
# the lab's services by name (lab-postgres, lab-s3), whatever the container runtime.
networks:
  default:
    name: kilnmark

volumes:
  pgdata:
  keys:
