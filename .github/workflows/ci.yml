name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, kilnmark-heavy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The wrapper's jar runs before anything else is checked: it must be one Gradle published
      # (ADR 0042). Every library Gradle then downloads is checked against
      # gradle/verification-metadata.xml.
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Gradle builds the web UI with npm and packages it in the server.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # Integration tests run against the same PostgreSQL image Kilnmark ships with.
      - name: Build the PostgreSQL image (AGE, pgvector)
        run: docker build -t kilnmark-postgres:dev -f containers/postgres/Containerfile containers/postgres

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      # Error Prone runs in every compile and fails the build on a finding (ADR 0042).
      - name: Build, test, check licences and that the release holds the product only (ADR 0024)
        run: ./gradlew build release --no-daemon

      # Only builds of main keep their release folder, and only for a week: each one is about
      # 50 MB, and keeping one per push and pull request filled the repository's artifact quota.
      - name: Keep the release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kilnmark-release
          path: dist/release/
          retention-days: 7

  # Integration tests against heavy databases, apart so the main build stays quick.
  heavy-databases:
    runs-on: [self-hosted, kilnmark-heavy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: SQL Server, MySQL and MariaDB integration tests
        run: ./gradlew :kiln-plugins:heavyTest -PskipUi --no-daemon

      # Oracle in a Gradle run of its own, so the servers above are stopped first (the runner has 7 GB)
      - name: Oracle integration tests
        run: ./gradlew :kiln-plugins:oracleTest -PskipUi --no-daemon
