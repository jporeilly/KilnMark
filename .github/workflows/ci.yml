name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, kilnmark-heavy]
    steps:
      - uses: actions/checkout@v4

      # Gradle builds the web UI with npm and packages it in the server.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # Integration tests run against the same PostgreSQL image Kilnmark ships with.
      - name: Build the PostgreSQL image (AGE, pgvector)
        shell: powershell
        run: |
          # The same engine choice as build.ps1: podman first, then docker.
          $engine = if (Get-Command podman -ErrorAction SilentlyContinue) { 'podman' }
            elseif (Get-Command docker -ErrorAction SilentlyContinue) { 'docker' }
            else { throw 'Neither podman nor docker is on the PATH.' }
          & $engine build -t kilnmark-postgres:dev -f containers/postgres/Containerfile containers/postgres
          if ($LASTEXITCODE -ne 0) { throw "$engine build failed with exit code $LASTEXITCODE" }
          # Testcontainers talks to Docker, which keeps its own image store: copy the image across when
          # Docker is installed, so the integration tests can start it.
          if ($engine -ne 'docker' -and (Get-Command docker -ErrorAction SilentlyContinue)) {
            $tar = Join-Path $env:RUNNER_TEMP 'kilnmark-postgres.tar'
            & podman save -o $tar kilnmark-postgres:dev
            if ($LASTEXITCODE -ne 0) { throw "podman save failed with exit code $LASTEXITCODE" }
            & docker load -i $tar
            if ($LASTEXITCODE -ne 0) { throw "docker load failed with exit code $LASTEXITCODE" }
            Remove-Item $tar
          }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build, test, check licences and that the release holds the product only (ADR 0024)
        run: ./gradlew build release --no-daemon

      # Only builds of main keep their release folder, and only for a week: each one is about
      # 50 MB, and keeping one per push and pull request filled the repository's artifact quota.
      - name: Keep the release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: kilnmark-release
          path: dist/release/
          retention-days: 7

  # Integration tests against heavy databases, apart so the main build stays quick.
  heavy-databases:
    runs-on: [self-hosted, kilnmark-heavy]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: SQL Server, MySQL and MariaDB integration tests
        run: ./gradlew :kiln-plugins:heavyTest -PskipUi --no-daemon

      # Oracle in a Gradle run of its own, so the servers above are stopped first (the runner has 7 GB)
      - name: Oracle integration tests
        run: ./gradlew :kiln-plugins:oracleTest -PskipUi --no-daemon
