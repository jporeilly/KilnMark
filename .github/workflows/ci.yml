name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gradle builds the web UI with npm and packages it in the server.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # Integration tests run against the same PostgreSQL image Kilnmark ships with.
      - name: Build the PostgreSQL image (AGE, pgvector)
        run: docker build -t kilnmark-postgres:dev -f containers/postgres/Containerfile containers/postgres

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build, test and check licences
        run: ./gradlew build release --no-daemon

      - name: Keep the release
        uses: actions/upload-artifact@v4
        with:
          name: kilnmark-release
          path: dist/release/
