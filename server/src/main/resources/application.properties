# Kilnmark server configuration.
# Every setting can be overridden by an environment variable, for example
# KILNMARK_ROLES=worker or QUARKUS_DATASOURCE_JDBC_URL=...

quarkus.application.name=kilnmark
kilnmark.roles=api,scheduler,worker

quarkus.http.port=8080

# Metadata store: PostgreSQL with Apache AGE and pgvector (see containers/postgres).
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/kilnmark
quarkus.datasource.username=kilnmark
quarkus.datasource.password=kilnmark
quarkus.datasource.devservices.enabled=false
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

quarkus.smallrye-openapi.info-title=Kilnmark API

# Tests run without a database until the integration suite (sprint 1).
%test.quarkus.datasource.active=false
%test.quarkus.flyway.migrate-at-start=false
