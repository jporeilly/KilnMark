# Kilnmark server configuration.
# Every setting can be overridden by an environment variable, for example
# KILNMARK_ROLES=worker or QUARKUS_DATASOURCE_JDBC_URL=...

quarkus.application.name=kilnmark
kilnmark.roles=api,scheduler,worker

# Encryption key for stored source passwords: KILNMARK_SECRET_KEY (base64, 32 bytes), or a key file
# that the server creates on first start. Keep the key file off the database's volume.
kilnmark.secret-key-file=${user.home}/.kilnmark/secret.key

# Bulk import may name passwords as env:VARIABLE, or secret:NAME for a file in this folder
# (for example a mounted Podman or Kubernetes secret). Nothing outside it can be read.
kilnmark.secrets-dir=/run/secrets

# Scans: tables profiled at the same time, and how many rows of a view to read.
kilnmark.scan.parallel-tables=2
kilnmark.scan.view-row-limit=100000
kilnmark.scan.memory-limit-mb=512

# Folder sources (kind files) may only read inside these folders, comma-separated, for example
# KILNMARK_FILES_ROOTS=/srv/share,/mnt/exports. Unset: folder sources are refused, so adding a
# source never exposes the server's own files.
#kilnmark.files.roots=
# Parquet: decoding threads shared by every read, and the most fetched in one request (MiB).
kilnmark.files.parquet-threads=2
kilnmark.files.parquet-chunk-mb=8
# S3 sources need their own access key. true lets sources on AWS (no endpoint) use this server's
# own AWS identity instead; only for a server whose every user may use that identity.
kilnmark.s3.allow-default-credentials=false

# Managing sources: how long a connection test or a listing of schemas or folders may take, and
# how many may run at once. Bulk import can rewrite host names in URLs when asked (remapHosts=true),
# as from=to pairs, so sources written from a desktop's view work from inside a container, for
# example KILNMARK_SOURCES_HOST_MAP=localhost=host.docker.internal,127.0.0.1=host.docker.internal
kilnmark.sources.check-timeout=15s
kilnmark.sources.check-concurrency=4
#kilnmark.sources.host-map=
# Hosts sources may connect to (database URLs, S3 endpoints): names, addresses or *.example.com,
# comma-separated, for example KILNMARK_SOURCES_ALLOWED_HOSTS=*.corp.example.com,10.0.4.12.
# Unset: any host. Stewards can test, list and edit sources, so set this where the server can
# reach networks that stewards should not.
#kilnmark.sources.allowed-hosts=
# Readiness (/q/health/ready) reports the database, migrations and worker without detail; the
# built-in datasource check is off because its failure message can name hosts and users.
quarkus.datasource.health.enabled=false

# Documents (PDF, Office, mail, ...) are untrusted input. Larger files are recorded but not read;
# text past max-characters is not kept; a document still being read after timeout-seconds is
# abandoned and marked not readable. threads documents are read at once across the server.
# Chunks of about chunk-characters, repeating chunk-overlap characters, are kept for search.
kilnmark.documents.max-file-mb=100
kilnmark.documents.max-legacy-file-mb=30
# An Office file's shared strings, styles and workbook parts are held whole by parsers: the most
# each may really expand to (what the archive declares is not trusted).
kilnmark.documents.max-part-mb=64
kilnmark.documents.max-characters=1000000
kilnmark.documents.timeout-seconds=60
kilnmark.documents.max-depth=3
kilnmark.documents.threads=2
kilnmark.documents.chunk-characters=1500
kilnmark.documents.chunk-overlap=150
# POI logs hostile or damaged files at FATAL with a stack trace; each such document is already
# reported as not readable, with the reason, so POI's own log is turned off.
quarkus.log.category."org.apache.poi".level=OFF

# Organisation branding (docs/guide/branding.md): manifest.json and the images it names, for the
# product name and logo and connector logos. Missing folder: Kilnmark's own look. Images larger
# than max-file-kb are ignored. Served without sign-in, as the sign-in page shows the logo.
kilnmark.branding.dir=/etc/kilnmark/branding
kilnmark.branding.max-file-kb=256

# Data quality. Rule webhooks may only call URLs starting with one of these prefixes
# (comma-separated); none by default. A rule's query in a source database is cancelled after
# query-timeout. Samples: rows per asset (a source's sample_rows overrides; its keep_samples=false
# keeps no values at all).
#kilnmark.quality.webhook-allow-list=https://hooks.example.com/kilnmark/
kilnmark.quality.query-timeout=60s
kilnmark.quality.sample-rows=1000
kilnmark.quality.keep-versions=30
# Custom SQL rules (admins only) can read anything the source's login can see: off unless turned on.
kilnmark.quality.custom-sql=false

# 8780, not 8080: Tomcat and many Java servers already use 8080. Override with QUARKUS_HTTP_PORT.
quarkus.http.port=8780

# Metadata store: PostgreSQL with Apache AGE and pgvector (see containers/postgres).
# Tests start their own (see the end of this file), so the connection is set for dev and prod only.
quarkus.datasource.db-kind=postgresql
%dev,prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5442/kilnmark
%dev,prod.quarkus.datasource.username=kilnmark
%dev,prod.quarkus.datasource.password=kilnmark
%dev,prod.quarkus.datasource.devservices.enabled=false
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration
# Pin the history table to the kilnmark schema. Without this, a database user called kilnmark
# resolves "$user" to that schema once it exists, and the next start cannot find the history.
quarkus.flyway.default-schema=kilnmark
quarkus.flyway.schemas=kilnmark

quarkus.smallrye-openapi.info-title=Kilnmark API
# Interactive API documentation at /api/docs (served by this server, so it works offline), from
# the OpenAPI document at /q/openapi. Both describe the API only; calls still need an API token,
# entered with the Authorize button. Turn them off with QUARKUS_SWAGGER_UI_ENABLE=false and
# QUARKUS_SMALLRYE_OPENAPI_ENABLE=false.
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/api/docs
quarkus.swagger-ui.title=Kilnmark API
quarkus.swagger-ui.persist-authorization=false
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=apiToken
quarkus.smallrye-openapi.security-scheme-description=A Kilnmark API token (km_...), from Settings, API tokens
quarkus.smallrye-openapi.jwt-bearer-format=km_ token

# Sign-in: API tokens sent as "Authorization: Bearer km_...". Roles: viewer, steward, admin.
# KILNMARK_ADMIN_TOKEN sets an admin token; without it, the first start writes one to
# admin-token next to the secret key file (valid for 24 hours). KILNMARK_AUTH_MODE=off turns
# sign-in off, and is refused unless quarkus.http.host is a loopback address; other values stop the server.
kilnmark.auth.mode=tokens
# Check tokens only where an endpoint needs them, so errors come back as {"error": "..."}.
quarkus.http.auth.proactive=false
# An endpoint with no role annotation is refused rather than left open.
quarkus.security.jaxrs.deny-unannotated-endpoints=true

# Worker role: scans run at the same time, and how often to look for queued jobs when no
# notification arrives (see KilnmarkConfig.Worker for the rest).
kilnmark.worker.concurrency=2
kilnmark.worker.poll-interval=5s

# `java -jar quarkus-run.jar` needs no flags: Quarkus's manifest already opens java.nio (for Arrow),
# and this lets the compression libraries (zstd, snappy) load their native code without warnings.
quarkus.package.jar.manifest.attributes."Enable-Native-Access"=ALL-UNNAMED

# AI runtime (ADR 0016). Models are added at run time under AI models (admin), not here.
# forbidden locks out every model that is not local, whatever an admin chooses in the UI. While it
# is on, a model counts as local only if its address is in kilnmark.ai.local-hosts (default:
# loopback and private networks and localhost; in a container also host.containers.internal and
# host.docker.internal, the names Podman and Docker give the machine it runs on, which count only
# while they resolve to loopback, private addresses or Podman's 169.254.1.2; other names are
# matched as written, never resolved). Setting it replaces the whole default. Any other value
# stops the server.
kilnmark.ai.hosted-models=allowed
#kilnmark.ai.local-hosts=10.20.0.0/16,ai
# Link-local addresses and cloud metadata names are refused as model addresses unless this is true.
kilnmark.ai.allow-metadata-addresses=false
# Usage records older than this are deleted.
kilnmark.ai.usage-retention=90d
# Retries after a failed model call, assets per embedding request, the least cosine similarity
# for search by meaning, and whether usage records keep prompt and answer text (off).
kilnmark.ai.max-retries=2
kilnmark.ai.embed-batch-size=16
kilnmark.ai.min-similarity=0.3
kilnmark.ai.keep-usage-text=false

# Read-only MCP server for outside AI assistants: Streamable HTTP at /mcp, behind an API token with
# the viewer role or above. The extension's older SSE transport is refused (nothing needs it).
quarkus.mcp.server.server-info.name=kilnmark
quarkus.mcp.server.server-info.title=Kilnmark catalogue
quarkus.mcp.server.server-info.instructions=Search and read the Kilnmark data catalogue. Read-only.
quarkus.http.auth.permission.mcp.paths=/mcp,/mcp/*
quarkus.http.auth.permission.mcp.policy=kilnmark-viewer
quarkus.http.auth.policy.kilnmark-viewer.roles-allowed=viewer
quarkus.http.auth.permission.mcp-sse.paths=/mcp/sse,/mcp/sse/*,/mcp/messages,/mcp/messages/*
quarkus.http.auth.permission.mcp-sse.policy=deny

# Tests start their own PostgreSQL with AGE and pgvector: the image built from
# containers/postgres/Containerfile, tagged kilnmark-postgres:dev.
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=kilnmark-postgres:dev
# Same names as production: a user called kilnmark owning a schema called kilnmark.
%test.quarkus.datasource.devservices.db-name=kilnmark
%test.quarkus.datasource.devservices.username=kilnmark
%test.quarkus.datasource.devservices.password=kilnmark
# A random port, so several builds can run their tests at once.
%test.quarkus.http.test-port=0
%test.kilnmark.secret-key=AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
# Tests sign in with this admin token (see server/src/test/.../Tokens.java).
%test.kilnmark.admin-token=km_test-admin-0123456789abcdefghijklmnopqrstuvwxyzABCDEF
%test.kilnmark.secret-key-file=${java.io.tmpdir}/kilnmark-test/secret.key
%test.kilnmark.worker.poll-interval=1s
%test.kilnmark.worker.heartbeat-interval=1s
%test.kilnmark.sources.host-map=localhost=db.internal
%test.kilnmark.sources.check-timeout=3s
%test.kilnmark.files.roots=${java.io.tmpdir}/kilnmark-test-files
# AI tests: fail fast against the fake model server.
%test.kilnmark.ai.max-retries=1
# Data quality tests post webhooks to a local server on this port.
%test.kilnmark.quality.webhook-allow-list=http://127.0.0.1:47391/hooks/
%test.kilnmark.quality.query-timeout=5s
%test.kilnmark.quality.custom-sql=true
