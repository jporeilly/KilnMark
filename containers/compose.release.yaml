# Kilnmark @VERSION@: PostgreSQL and the Kilnmark server, two containers on one Linux VM.
# Works with Podman and Docker. Start, stop and look after it with the control script beside this
# file (INSTALL.md, "A. Install a release"):
#   ./kilnmark.sh install        (Windows: kilnmark.cmd install)
# which gets the images (loaded from the offline images file, pulled, or built), makes .env with new
# secrets, and starts everything. By hand, from this folder with a .env beside it:
#   podman compose up -d          (or: docker compose up -d)
# The images are ghcr.io/jporeilly/kilnmark-server and -postgres, tag @VERSION@: pulled, loaded from
# kilnmark-@VERSION@-images.tar.gz, or built from containers/ (podman compose build).
#
# Nothing here has a default password or token: compose stops with a message naming a missing one.
#   KILNMARK_DB_PASSWORD   required: password of Kilnmark's database, and of its PostgreSQL owner
#   KILNMARK_ADMIN_TOKEN   required: Kilnmark's admin API token
#   KILNMARK_PORT          optional: the port Kilnmark is published on (8780)
#   KILNMARK_DB_PORT       optional: the port its database is published on, on this machine only (5442)
#   KILNMARK_CERTS_DIR     optional: the folder holding server.crt and server.key for HTTPS (./tls)
#   KILNMARK_SAMPLES_DB_PASSWORD   password of the Starter Pack's database login (the control script
#                          makes one); unset, that database is not made and the pack cannot be turned on
#   KILNMARK_FILES_DIR     optional: your own folder, read-only at /srv/share
# The key that encrypts stored source passwords is generated on first start, in the keys volume.
#
# The project is always called kilnmark, whatever this folder is called, so its volumes keep their
# names from one version's folder to the next.
name: kilnmark

services:
  postgres:
    image: ghcr.io/jporeilly/kilnmark-postgres:@VERSION@
    restart: always   # back after a reboot (down removes the containers, so a stop stays a stop)
    build:
      context: containers/postgres
      dockerfile: Containerfile
    environment:
      POSTGRES_DB: kilnmark
      POSTGRES_USER: kilnmark
      # The kilnmark user owns the database and is its PostgreSQL superuser: no default password.
      POSTGRES_PASSWORD: ${KILNMARK_DB_PASSWORD:?Set KILNMARK_DB_PASSWORD to a strong password before starting Kilnmark (see .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kilnmark -d kilnmark"]
      interval: 5s
      retries: 20
    ports:
      # Kilnmark reaches the database inside this stack; it is published on this machine only, for
      # backups and administration, on 5442 so it never clashes with another PostgreSQL here.
      - "127.0.0.1:${KILNMARK_DB_PORT:-5442}:5432"

  # The Starter Pack's database (ADR 0051), on a Starter Pack install only (the control script
  # turns this profile on in that mode): a one-off at every start that makes, or keeps, the empty
  # database kilnmark_samples on the server above, owned by a login of its own (kilnmark_samples),
  # and, once, when it makes it, closes it to everyone but that login. Then it stops. Kilnmark
  # fills it only when an admin turns the Starter Pack on (Settings, Starter Pack). Kilnmark's
  # backups hold Kilnmark's own database only, never this one.
  samples-db:
    image: ghcr.io/jporeilly/kilnmark-postgres:@VERSION@
    profiles: ["starter-pack"]
    entrypoint: ["/usr/local/bin/kilnmark-samples-db.sh"]
    environment:
      PGHOST: postgres
      PGUSER: kilnmark
      PGSSLMODE: require
    # Its two passwords, the database's and the samples login's (KILNMARK_DB_PASSWORD and
    # KILNMARK_SAMPLES_DB_PASSWORD), are read from config/.env, read-only: never in its environment,
    # which podman-compose puts on podman's command line. No default: unset, nothing is made.
    volumes:
      - ${KILNMARK_ENV_FILE:-../../config/.env}:/run/kilnmark/env:ro,z
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  kilnmark:
    image: ghcr.io/jporeilly/kilnmark-server:@VERSION@
    restart: always   # back after a reboot (down removes the containers, so a stop stays a stop)
    build:
      context: .
      dockerfile: containers/server/Containerfile
      args:
        APP_DIR: server     # the built server in this folder
    environment:
      KILNMARK_ROLES: api,scheduler,worker
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/kilnmark?sslmode=require
      QUARKUS_DATASOURCE_USERNAME: kilnmark
      QUARKUS_DATASOURCE_PASSWORD: ${KILNMARK_DB_PASSWORD:?Set KILNMARK_DB_PASSWORD to a strong password before starting Kilnmark (see .env.example)}
      # The admin API token: km_ followed by 43 or more letters, digits, - or _ (see .env.example).
      KILNMARK_ADMIN_TOKEN: ${KILNMARK_ADMIN_TOKEN:?Set KILNMARK_ADMIN_TOKEN to a new admin token before starting Kilnmark (see .env.example)}
      # The folders file sources may use: /srv/files, Kilnmark's own (the files volume), which they
      # may write with Allow writing on, and /srv/share, your own folder (KILNMARK_FILES_DIR),
      # read-only (see volumes below).
      KILNMARK_FILES_ROOTS: /srv/files,/srv/share
      # The Starter Pack (ADR 0051; Settings, Starter Pack): the samples' database login, made by
      # samples-db above. No default, as for every secret.
      KILNMARK_SAMPLES_DB_PASSWORD: ${KILNMARK_SAMPLES_DB_PASSWORD}
      # The deployment mode (ADR 0051): production, or starter-pack for training and development,
      # written at install and recorded in Kilnmark's database at the first start. The server does
      # not start without it, or with one that differs from the record. Kilnmark holds no Keycloak
      # credential: the pack's example people are made by keycloak-setup (below).
      KILNMARK_MODE: ${KILNMARK_MODE:?Set KILNMARK_MODE to production or starter-pack (the control script sets it)}
      # Optional host names bulk import rewrites when asked to (remapHosts=true), as from=to pairs,
      # for example localhost=host.docker.internal. Unset by default.
      KILNMARK_SOURCES_HOST_MAP: ${KILNMARK_SOURCES_HOST_MAP:-}
      # HTTPS on Kilnmark itself (INSTALL.md, "HTTPS"): the certificate (with its chain) and its key,
      # as PEM files in ./tls, mounted below. Unset, Kilnmark serves plain HTTP for a proxy to end TLS.
      KILNMARK_TLS_CERT_FILE: ${KILNMARK_TLS_CERT_FILE:-}
      KILNMARK_TLS_KEY_FILE: ${KILNMARK_TLS_KEY_FILE:-}
      # With HTTPS on: what plain HTTP from other machines does (enabled, redirect or disabled), and
      # the HTTPS port browsers use, for redirects. Behind a proxy that ends TLS, set
      # KILNMARK_HTTP_HSTS=always so browsers still keep to HTTPS.
      KILNMARK_HTTP_PLAIN: ${KILNMARK_HTTP_PLAIN:-enabled}
      KILNMARK_HTTP_HTTPS_PORT: ${KILNMARK_HTTPS_PORT:-8443}
      KILNMARK_HTTP_HSTS: ${KILNMARK_HTTP_HSTS:-when-https}
      # Sign-in with the organisation's identity provider (ADR 0036; INSTALL.md, "Sign in with your
      # identity provider"). Off unless KILNMARK_OIDC_ENABLED=true; API tokens work either way.
      QUARKUS_OIDC_TENANT_ENABLED: ${KILNMARK_OIDC_ENABLED:-false}
      QUARKUS_OIDC_AUTH_SERVER_URL: ${KILNMARK_OIDC_ISSUER:-}
      QUARKUS_OIDC_CLIENT_ID: ${KILNMARK_OIDC_CLIENT_ID:-}
      # No default, as for every secret (ADR 0024): unset, compose notes it and sign-in with the provider stays off
      QUARKUS_OIDC_CREDENTIALS_SECRET: ${KILNMARK_OIDC_CLIENT_SECRET}
      # true behind a proxy that ends TLS, so the redirect URI the provider sees is https://
      QUARKUS_OIDC_AUTHENTICATION_FORCE_REDIRECT_HTTPS_SCHEME: ${KILNMARK_OIDC_BEHIND_TLS_PROXY:-false}
      # Scopes asked for beside openid: offline_access where the provider issues a refresh token only
      # then (Entra ID, Okta), so a sign-in renews rather than ending with its first ID token. Never for Keycloak.
      QUARKUS_OIDC_AUTHENTICATION_SCOPES: ${KILNMARK_OIDC_SCOPES:-}
      KILNMARK_AUTH_OIDC_PROVIDER_NAME: ${KILNMARK_OIDC_PROVIDER_NAME:-your organisation}
      KILNMARK_AUTH_OIDC_GROUPS_CLAIM: ${KILNMARK_OIDC_GROUPS_CLAIM:-groups}
      KILNMARK_AUTH_OIDC_VIEWER_GROUPS: ${KILNMARK_OIDC_VIEWER_GROUPS:-}
      KILNMARK_AUTH_OIDC_STEWARD_GROUPS: ${KILNMARK_OIDC_STEWARD_GROUPS:-}
      KILNMARK_AUTH_OIDC_DESIGNER_GROUPS: ${KILNMARK_OIDC_DESIGNER_GROUPS:-}
      KILNMARK_AUTH_OIDC_ADMIN_GROUPS: ${KILNMARK_OIDC_ADMIN_GROUPS:-}
      KILNMARK_AUTH_OIDC_UNMASK_GROUPS: ${KILNMARK_OIDC_UNMASK_GROUPS:-}
      KILNMARK_AUTH_OIDC_MFA_ACR: ${KILNMARK_OIDC_MFA_ACR:-}
      KILNMARK_AUTH_OIDC_MAX_SESSION: ${KILNMARK_OIDC_MAX_SESSION:-8h}
      # The longest an API token may last, e.g. 90d (ADR 0037); unset, tokens may never expire.
      KILNMARK_AUTH_TOKEN_MAX_LIFETIME: ${KILNMARK_TOKEN_MAX_LIFETIME:-}
      # true: a second admin approves a designer token seeing sensitive values (ADR 0038)
      KILNMARK_AUTH_UNMASK_APPROVAL: ${KILNMARK_UNMASK_APPROVAL:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach databases on this machine (Podman also has host.containers.internal)
    volumes:
      - keys:/var/lib/kilnmark     # the key for stored source passwords, and drivers/ (Settings > Drivers): back it up apart from pgdata
      # Kilnmark's own files folder, writable: the files volume. The samples and the Starter Pack
      # write here (ADR 0051), never in your folder.
      - files:/srv/files:Z
      # Your own folder, read-only, when config/.env sets KILNMARK_FILES_DIR to its full path
      # (INSTALL.md, "The files folder"); else an empty volume. In Kilnmark, add a source of kind
      # files with path /srv/share. Podman labels it for this container (:Z, on SELinux hosts).
      - ${KILNMARK_FILES_DIR:-share}:/srv/share:ro,Z
      # Optional organisation branding: product name, logo and connector logos you are licensed to use
      # (Documentation, "Branding and appearance"). Kilnmark reads /etc/kilnmark/branding; without
      # it, Kilnmark's own name and letter tiles are shown.
      # - ./branding:/etc/kilnmark/branding:ro,Z
      # Certificate and key for HTTPS (INSTALL.md, "HTTPS"), read-only. Empty, Kilnmark serves plain
      # HTTP; it reads them only when KILNMARK_TLS_CERT_FILE and KILNMARK_TLS_KEY_FILE are set.
      - ${KILNMARK_CERTS_DIR:-./tls}:/etc/kilnmark/tls:ro,Z
    depends_on:
      postgres:
        condition: service_healthy
    # Ready when the database answers, migrations are applied and the worker runs (/q/health/ready).
    # The image has no curl, so bash asks over a plain TCP connection.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8780 && printf 'GET /q/health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 3
    # On stop, running scans get 30 s to finish and 15 s to hand back to the queue
    # (kilnmark.worker.shutdown-timeout); the default 10 s would cut them off.
    stop_grace_period: 60s
    ports:
      # 8780, not 8080, which Tomcat and many Java servers use. Change the host side with KILNMARK_PORT.
      - "${KILNMARK_PORT:-8780}:8780"
      # HTTPS, once a certificate is set (above). Change the host side with KILNMARK_HTTPS_PORT.
      - "${KILNMARK_HTTPS_PORT:-8443}:8443"

  # Keycloak, for an organisation with no identity provider of its own, or with only Active
  # Directory or LDAP, which Keycloak can read (ADR 0014; INSTALL.md, "Keycloak, if you have no
  # identity provider"). Started only when asked for, after setting its values in .env:
  #   podman compose --profile auth up -d
  # keycloak-setup then makes the kilnmark realm: the groups that give Kilnmark's roles, the client
  # Kilnmark signs in with, a sign-in of a password and a one-time code, and Kilnmark's sign-in page.
  # Run it again after changing KILNMARK_URL or the client secret:
  #   podman compose --profile auth run --rm keycloak-setup
  # Its secrets have no defaults: while one is missing, keycloak-db or keycloak-setup stops and says
  # which. They are optional to compose itself, so Kilnmark starts the same without this profile.
  keycloak-db:
    image: ghcr.io/jporeilly/kilnmark-postgres:@VERSION@
    restart: always   # back after a reboot (down removes the containers, so a stop stays a stop)
    profiles: ["auth"]
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KILNMARK_KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:3f3c5f8e03c614774b4bd9173b88391fefa4153bfc010d8012d59ad825377332
    restart: always   # back after a reboot (down removes the containers, so a stop stays a stop)
    profiles: ["auth"]
    command: ["start"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak?sslmode=require
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KILNMARK_KEYCLOAK_DB_PASSWORD}
      # The address browsers reach Keycloak at. Kilnmark reaches it inside this stack
      # (http://keycloak:8080), so its calls behind the scenes use that address instead.
      KC_HOSTNAME: ${KILNMARK_KEYCLOAK_URL:-http://localhost:8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # Plain HTTP, published on this machine only (ports, below): browsers on it, or a proxy on it
      # that ends TLS for other machines. Behind that proxy, set KILNMARK_KEYCLOAK_URL to its
      # https:// address; Keycloak takes the client's address and scheme from the proxy's
      # X-Forwarded headers, which only something on this machine can send it.
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # Keycloak's first admin, for its console (KILNMARK_KEYCLOAK_URL/admin) and keycloak-setup.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KILNMARK_KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KILNMARK_KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - ./containers/keycloak/themes/kilnmark:/opt/keycloak/themes/kilnmark:ro,Z
    depends_on:
      keycloak-db:
        condition: service_healthy
    # Ready when /health/ready answers on the management port; the image has no curl.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 6
    ports:
      # On this machine only: Keycloak's pages carry passwords and codes, so other machines reach
      # it through a proxy here that ends TLS (INSTALL.md). Kilnmark reaches it inside this stack.
      # If you change the port, change KILNMARK_KEYCLOAK_URL to match.
      - "127.0.0.1:${KILNMARK_KEYCLOAK_PORT:-8180}:8080"

  keycloak-setup:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:3f3c5f8e03c614774b4bd9173b88391fefa4153bfc010d8012d59ad825377332
    profiles: ["auth"]
    entrypoint: ["/bin/bash", "/opt/kilnmark/setup.sh"]
    # As root in its own container, to read config/.env (yours only) for Keycloak's admin password
    # and the client secret: never in its environment, which podman-compose puts on podman's command
    # line, where other users of the machine can read it.
    user: "0"
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KC_ADMIN_USER: ${KILNMARK_KEYCLOAK_ADMIN:-admin}
      # The address browsers reach Kilnmark at: Keycloak sends people back there after sign-in.
      KILNMARK_URL: ${KILNMARK_URL:-http://localhost:8780}
      # The Starter Pack's five example people (ADR 0051), only on a Starter Pack install: made when
      # the control script asks (kilnmark.sh starter people, which hands this one run the password
      # you typed, on standard input, never here), while KILNMARK_STARTER=allowed, and removed at the
      # next start once it is not.
      KILNMARK_STARTER: ${KILNMARK_STARTER:-}
      KILNMARK_MODE: ${KILNMARK_MODE:-}
      # Set by the control script's starter people for that one run only, from its own environment,
      # never from .env: add, new-password or remove.
      KILNMARK_STARTER_PEOPLE_ACTION: ${KILNMARK_STARTER_PEOPLE_ACTION:-}
      # People of your own, in either mode: set by the control script's people command (and
      # install's first admin) for that one run only, never in .env (the script refuses them there):
      # add, import, activate or list, and the one person. Passwords go on standard input.
      KILNMARK_PEOPLE_ACTION: ${KILNMARK_PEOPLE_ACTION:-}
      KILNMARK_PERSON_EMAIL: ${KILNMARK_PERSON_EMAIL:-}
      KILNMARK_PERSON_FIRST_NAME: ${KILNMARK_PERSON_FIRST_NAME:-}
      KILNMARK_PERSON_LAST_NAME: ${KILNMARK_PERSON_LAST_NAME:-}
      KILNMARK_PERSON_GROUPS: ${KILNMARK_PERSON_GROUPS:-}
      # How long a temporary password may wait unused before its person is disabled: 1 to 720 hours.
      KILNMARK_PEOPLE_ACTIVATION_HOURS: ${KILNMARK_PEOPLE_ACTIVATION_HOURS:-72}
    volumes:
      - ./containers/keycloak/setup.sh:/opt/kilnmark/setup.sh:ro,Z
      # config/.env, read-only, from the install root (KILNMARK_ENV_FILE elsewhere): only its two
      # secrets above are read from it.
      - ${KILNMARK_ENV_FILE:-../../config/.env}:/run/kilnmark/env:ro,z
    depends_on:
      keycloak:
        condition: service_healthy
    restart: "no"

  # AI models, started only when asked for. llama.cpp's llama-server serves GGUF model files from
  # the models volume through the OpenAI API, inside this stack's network. Download the models first:
  #   podman compose --profile ai-download run --rm ai-download
  # then start one of:
  #   podman compose --profile ai up -d          # CPU: chat on ai, embeddings on ai-embed
  #   podman compose --profile ai-cuda up -d     # NVIDIA GPU: chat on ai-cuda, embeddings on ai-embed
  # and add them in Kilnmark under AI models (base URLs http://ai:8080/v1 or http://ai-cuda:8080/v1,
  # and http://ai-embed:8080/v1). Images are pinned by tag and digest.
  # Slots: chat has 2 (--parallel 2) sharing 8,192 tokens, so 4,096 each, matching Kilnmark's
  # default of 2 calls at a time per model; embeddings have 2 slots of 512 tokens, bge's maximum.
  # llama-server refuses a longer input instead of cutting it, so give the embedding profile a
  # context size of 512 in Kilnmark: it then sizes asset text to fit (1.5 characters per token).
  ai:
    image: ghcr.io/ggml-org/llama.cpp:server-b11429@sha256:2f8ebc2dde83c4bd7e5c6d61efa57965e0d5a79d29802c246c4593740d9c04c1
    restart: always   # back after a reboot (down removes the containers, so a stop stays a stop)
    profiles: ["ai"]
    command: ["-m", "/models/${KILNMARK_AI_CHAT_MODEL:-qwen2.5-1.5b-instruct-q4_k_m.gguf}",
              "--alias", "${KILNMARK_AI_CHAT_ALIAS:-qwen2.5-1.5b-instruct}",
              "--host", "0.0.0.0", "--port", "8080", "--ctx-size", "8192", "--parallel", "2", "--jinja"]
    volumes:
      - models:/models:ro
    ports:
      # On this machine only, for a Kilnmark server run outside this stack.
      - "127.0.0.1:${KILNMARK_AI_PORT:-8781}:8080"

  ai-cuda:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b11429@sha256:883915ea20a4b350e98f7284098f4d400c21e9b366e248d397cd42d90602a84c
    restart: always   # back after a reboot (down removes the containers, so a stop stays a stop)
    profiles: ["ai-cuda"]
    command: ["-m", "/models/${KILNMARK_AI_CHAT_MODEL:-qwen2.5-1.5b-instruct-q4_k_m.gguf}",
              "--alias", "${KILNMARK_AI_CHAT_ALIAS:-qwen2.5-1.5b-instruct}",
              "--host", "0.0.0.0", "--port", "8080", "--ctx-size", "8192", "--parallel", "2", "--jinja",
              "--n-gpu-layers", "999"]
    volumes:
      - models:/models:ro
    ports:
      - "127.0.0.1:${KILNMARK_AI_PORT:-8781}:8080"
    deploy:
      resources:
        reservations:
          devices:
            # Docker: NVIDIA Container Toolkit. Podman: CDI (nvidia-ctk cdi generate).
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Embeddings are small and fast on a CPU, so one service serves both profiles.
  ai-embed:
    image: ghcr.io/ggml-org/llama.cpp:server-b11429@sha256:2f8ebc2dde83c4bd7e5c6d61efa57965e0d5a79d29802c246c4593740d9c04c1
    restart: always   # back after a reboot (down removes the containers, so a stop stays a stop)
    profiles: ["ai", "ai-cuda"]
    command: ["-m", "/models/${KILNMARK_AI_EMBED_MODEL:-bge-small-en-v1.5-q8_0.gguf}",
              "--alias", "${KILNMARK_AI_EMBED_ALIAS:-bge-small-en-v1.5}",
              "--embeddings", "--host", "0.0.0.0", "--port", "8080", "--ctx-size", "1024", "--parallel", "2"]
    volumes:
      - models:/models:ro
    ports:
      - "127.0.0.1:${KILNMARK_AI_EMBED_PORT:-8782}:8080"

  # Downloads the default models into the models volume (about 1.2 GB), once. Each file is pinned to
  # a commit of its repository and checked against its SHA-256 before it is kept; a file already
  # there is checked, not trusted. For an offline install, copy the .gguf files into the volume.
  ai-download:
    image: docker.io/curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
    profiles: ["ai-download"]
    user: "0:0"    # a new volume is owned by root; the image's own user could not write to it
    volumes:
      - models:/models
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        set -e; cd /models;
        get() {
          if test -f "$$1" && echo "$$3  $$1" | sha256sum -c -s; then echo "$$1: present and verified"; return; fi;
          curl -fL --retry 3 -o "$$1.part" "$$2";
          echo "$$3  $$1.part" | sha256sum -c -s || { echo "$$1: checksum mismatch, not kept"; rm -f "$$1.part"; exit 1; };
          mv "$$1.part" "$$1"; echo "$$1: downloaded and verified";
        };
        get qwen2.5-1.5b-instruct-q4_k_m.gguf
        https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/91cad51170dc346986eccefdc2dd33a9da36ead9/qwen2.5-1.5b-instruct-q4_k_m.gguf
        6a1a2eb6d15622bf3c96857206351ba97e1af16c30d7a74ee38970e434e9407e;
        get bge-small-en-v1.5-q8_0.gguf
        https://huggingface.co/ggml-org/bge-small-en-v1.5-Q8_0-GGUF/resolve/f2068edd9b54f2a369549ccc71f70ed273a2a801/bge-small-en-v1.5-q8_0.gguf
        f046db1dc724cf4f6f0a0c5917e922823b73eb1d27b8f9a9c2797f7866974804;
        ls -l /models

volumes:
  pgdata:
  keys:
  files:      # /srv/files, Kilnmark's own files folder
  share:      # /srv/share when KILNMARK_FILES_DIR names no folder of your own: empty
  models:     # GGUF model files for the AI profiles
  keycloak-pgdata:   # Keycloak's own database, for the auth profile: back it up with pgdata
