# Reference lab: the test estate Kilnmark discovers. It joins Kilnmark's network, so start
# Kilnmark first (podman compose up -d), then the demo sources you need:
#   .\lab\lab.ps1 start sqlserver          ./lab/lab.sh start postgres s3        (or: start all)
#   podman compose -f lab/compose.yaml --profile all up -d      (or: docker compose ...)
# Every service has a profile named after its demo source (postgres, s3, sqlserver, ...) and the
# profile all, so a bare "up" with no profile starts nothing. See lab/README.md.
# Sources it provides:
#   From Kilnmark:      jdbc:postgresql://lab-postgres:5432/lab     S3 endpoint http://lab-s3:7070
#   From this machine:  localhost:5433                              S3 endpoint http://localhost:9020
#   PostgreSQL  db=lab  user=lab  password=lab   (schemas crm, billing)
#   S3          access key=labadmin  secret=labadmin123  buckets lab-raw, lab-warehouse  (path-style)
#   File share  lab/files/share (read directly from disk)
#   MariaDB     (profile mariadb) host lab-mariadb port 3306 from Kilnmark (localhost:3307 here),
#               user kiln_reader password Lab-Reader-2026 (databases shop, stock)
#   Oracle      (profile oracle) host lab-oracle port 1521 service FREEPDB1 from Kilnmark (localhost:1522
#               here), user kiln_reader password Lab-Reader-2026 (schemas FLEET, FREIGHT)
#   Mailpit     (profile mail) SMTP lab-mailpit:1025 from Kilnmark (localhost:1025 here), no sign-in,
#               security none; the emails it catches at http://localhost:8025
services:
  lab-postgres:
    profiles: ["postgres", "all"]
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_DB: lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
    volumes:
      - ./postgres:/docker-entrypoint-initdb.d:ro,Z
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 5s
      retries: 30

  # S3-compatible object storage: VersityGW (Apache 2.0) serves a folder as a bucket.
  # Each folder under /data is a bucket, so lab/files/bucket appears as bucket lab-raw (the
  # synthetic source data, which pipelines never write). An anonymous volume appears as bucket
  # lab-warehouse, empty at first, for pipeline output; down and up again gives a new, empty one.
  lab-s3:
    profiles: ["s3", "all"]
    image: ghcr.io/versity/versitygw:v1.10.0
    command: ["posix", "/data"]
    environment:
      ROOT_ACCESS_KEY: labadmin
      ROOT_SECRET_KEY: labadmin123
    volumes:
      - ./files/bucket:/data/lab-raw:Z
      - /data/lab-warehouse
    ports:
      - "9020:7070"

  # A mail server that keeps every email it is sent and shows them in a web page, for trying
  # Kilnmark's notifications (Settings > Email: server lab-mailpit, port 1025, security None).
  # Nothing leaves it. Ports stay clear of 8080 (Tomcat) and 8780 (Kilnmark).
  # Demo source "mail": started on its own with the profile (podman compose -f lab/compose.yaml
  # --profile mail up -d, or lab.sh / lab.ps1 start mail), or with everything (--profile all).
  lab-mailpit:
    image: docker.io/axllent/mailpit:v1.31.6
    profiles: ["mail", "all"]
    environment:
      MP_MAX_MESSAGES: "500"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "1025:1025"
      - "8025:8025"

  # ---- SQL Server: synthetic operations data, database labdb (profile sqlserver) ----------------
  # From Kilnmark:      jdbc:sqlserver://lab-sqlserver:1433;databaseName=labdb with the source setting
  #                     trust_server_certificate=true (the certificate is self-signed)
  # From this machine:  localhost,14330 (14330, so it never clashes with a SQL Server you already run)
  # Logins (lab only):  kiln_reader / Lab-Reader-2026 (read-only)   kiln_writer / Lab-Writer-2026
  #                     (creates tables in schema warehouse only)   sa / Lab-Admin-2026
  # Needs about 2 GB of memory. The image is x86-64 only.
  #
  # LICENCE: ACCEPT_EULA=Y below means that starting lab-sqlserver accepts Microsoft's licence terms
  # for SQL Server Developer edition (free for development and testing, never for production):
  #   https://go.microsoft.com/fwlink/?linkid=857698
  # If you do not accept them, do not start the sqlserver profile (or all).
  lab-sqlserver:
    profiles: ["sqlserver", "all"]
    # The tag SqlServerIngestTest pins, so the lab and CI run the same build.
    image: mcr.microsoft.com/mssql/server:2022-CU27-GDR1-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"            # accepts Microsoft's SQL Server licence: see above
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: Lab-Admin-2026
      MSSQL_MEMORY_LIMIT_MB: "2048"
      SQLCMDPASSWORD: Lab-Admin-2026   # for the health check's sqlcmd
    volumes:
      - lab-sqlserver-data:/var/opt/mssql
    ports:
      - "14330:1433"
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-C", "-l", "5", "-b",
             "-Q", "SELECT 1", "-o", "/dev/null"]
      interval: 10s
      timeout: 10s
      start_period: 60s
      retries: 30

  # Loads labdb once (lab/sqlserver/seed.sh): waits for the server, skips if labdb is already
  # loaded, then exits. Uses the server image only for its sqlcmd, so nothing more is pulled.
  lab-sqlserver-init:
    profiles: ["sqlserver", "all"]
    image: mcr.microsoft.com/mssql/server:2022-CU27-GDR1-ubuntu-22.04
    entrypoint: ["/bin/bash"]
    command: ["/seed/seed.sh"]
    environment:
      SQLCMDPASSWORD: Lab-Admin-2026
    volumes:
      - ./sqlserver:/seed:ro,Z
    depends_on:
      - lab-sqlserver
    restart: "no"
  # ---- end SQL Server -----------------------------------------------------------------------------

  # ---- MariaDB: a synthetic shop's orders and inventory, databases shop and stock (profile mariadb) --
  # From Kilnmark:      host lab-mariadb, port 3306 (source kind mariadb; the connector also reads MySQL)
  # From this machine:  localhost:3307 (3307, so it never clashes with a MySQL you already run on 3306)
  # Logins (lab only):  kiln_reader / Lab-Reader-2026 (SELECT on shop and stock)
  #                     kiln_writer / Lab-Writer-2026 (database warehouse only)   root / Lab-Admin-2026
  # The image runs lab/mariadb/*.sql on the first start (an empty volume); later starts skip it.
  lab-mariadb:
    profiles: ["mariadb", "all"]
    # The tag MySqlServers pins for the MariaDB tests, so the lab and CI run the same build.
    image: docker.io/library/mariadb:11.4.12
    environment:
      MARIADB_ROOT_PASSWORD: Lab-Admin-2026
    volumes:
      - ./mariadb:/docker-entrypoint-initdb.d:ro,Z
      - lab-mariadb-data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 30
  # ---- end MariaDB --------------------------------------------------------------------------------

  # ---- Oracle: a synthetic parcel carrier's fleet and freight, schemas FLEET and FREIGHT (profile oracle)
  # From Kilnmark:      host lab-oracle, port 1521, service FREEPDB1 (source kind oracle)
  # From this machine:  localhost:1522, service FREEPDB1 (1522, so it never clashes with an Oracle on 1521)
  # Logins (lab only):  kiln_reader / Lab-Reader-2026 (SELECT on FLEET and FREIGHT)
  #                     warehouse / Lab-Writer-2026 (its own empty schema WAREHOUSE)   system / Lab-Admin-2026
  # Kilnmark needs Oracle's JDBC driver, which it does not ship: Settings > Drivers, or lab.sh driver oracle.
  # The image runs lab/oracle/*.sql on the first start (an empty volume), after creating the
  # database, which takes a minute or two; later starts skip both. Needs about 2 GB of memory.
  lab-oracle:
    profiles: ["oracle", "all"]
    # Oracle Database Free 23ai (free to use, also in production; Oracle's terms). The tests pin the
    # faststart build of the same version.
    image: docker.io/gvenzl/oracle-free:23.26.3-slim
    environment:
      ORACLE_PASSWORD: Lab-Admin-2026
    volumes:
      - ./oracle:/container-entrypoint-initdb.d:ro,Z
      - lab-oracle-data:/opt/oracle/oradata
    ports:
      - "1522:1521"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 10s
      start_period: 180s
      retries: 30
  # ---- end Oracle ---------------------------------------------------------------------------------

# Kilnmark's network (created by the main compose.yaml), so Kilnmark reaches these services by name.
networks:
  default:
    name: kilnmark
    external: true

# Named volumes. lab-sqlserver-data holds SQL Server's databases and lab-mariadb-data MariaDB's;
# lab/lab.sh reset sqlserver (or mariadb) drops it (lab_lab-sqlserver-data on the machine).
volumes:
  lab-sqlserver-data:
  lab-mariadb-data:
  lab-oracle-data:
