# Reference lab: the test estate Kilnmark discovers. Separate from the Kilnmark stack.
#   podman compose -f lab/compose.yaml up -d      (or: docker compose ...)
# Sources it provides:
#   PostgreSQL  localhost:5433  db=lab  user=lab  password=lab   (schemas crm, billing)
#   MinIO (S3)  localhost:9000  console localhost:9001  key=labadmin  secret=labadmin123  bucket=lab-raw
#   File share  lab/files/share (read directly from disk)
services:
  lab-postgres:
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_DB: lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
    volumes:
      - ./postgres:/docker-entrypoint-initdb.d:ro,Z
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 5s
      retries: 30

  lab-minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: labadmin
      MINIO_ROOT_PASSWORD: labadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 30

  # One-shot: creates the bucket and uploads the sample files, then exits.
  lab-minio-seed:
    image: quay.io/minio/mc:latest
    depends_on:
      lab-minio:
        condition: service_healthy
    volumes:
      - ./files/bucket:/seed:ro,Z
    entrypoint: >
      /bin/sh -c "mc alias set lab http://lab-minio:9000 labadmin labadmin123 &&
                  mc mb --ignore-existing lab/lab-raw &&
                  mc mirror --overwrite /seed lab/lab-raw"
