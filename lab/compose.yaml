# Reference lab: the test estate Kilnmark discovers. Separate from the Kilnmark stack.
#   podman compose -f lab/compose.yaml up -d      (or: docker compose ...)
# Sources it provides:
#   PostgreSQL  localhost:5433  db=lab  user=lab  password=lab   (schemas crm, billing)
#   S3          localhost:9000  access key=labadmin  secret=labadmin123  bucket=lab-raw  (path-style)
#   File share  lab/files/share (read directly from disk)
services:
  lab-postgres:
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_DB: lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
    volumes:
      - ./postgres:/docker-entrypoint-initdb.d:ro,Z
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 5s
      retries: 30

  # S3-compatible object storage: VersityGW (Apache 2.0) serves a folder as a bucket.
  # Each folder under /data is a bucket, so lab/files/bucket appears as bucket lab-raw.
  lab-s3:
    image: ghcr.io/versity/versitygw:v1.10.0
    command: ["posix", "/data"]
    environment:
      ROOT_ACCESS_KEY: labadmin
      ROOT_SECRET_KEY: labadmin123
    volumes:
      - ./files/bucket:/data/lab-raw:Z
    ports:
      - "9000:7070"
